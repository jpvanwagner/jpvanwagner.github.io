<title>Quizaga Quiz</title>

<!-- =====================================================================================
     ✏️  EDIT ZONE: everything you'd normally want to change is in this one block.
     Words, rules, colors, sprites, backgrounds and questions. The game engine further down
     reads these values, so you shouldn't need to touch anything below this block.
     (The Quizcade Builder reads and rewrites this block too. Keep the id="quizcade-config".)
     ===================================================================================== -->
<script id="quizcade-config">
const QUIZCADE = {
    game: "quizaga",   // tells the Builder which game this is. Leave it as is.

    /* ---------- WORDS ON SCREEN ---------- */
    text: {
        title: "QUIZAGA",
        pageTitle: "Quizaga Quiz",                 // browser tab title
        prompt: "SHOOT THE CORRECT SHIP!",         // sidebar text before the first question
        start: "START GAME",
        playAgain: "PLAY AGAIN",
        gameOver: "GAME OVER",
        finalScore: "FINAL SCORE:",
        actionButton: "FIRE",                      // the touch-screen action button
        extraLife: "EXTRA LIFE EVERY {points} POINTS",
        tutorial: [                                // one entry per tutorial step ("\n" = new line)
            "STEP 1:\n\nMove left and right, and shoot your lasers!",
            "STEP 2:\n\nAvoid the diving crab ships and their counter-fire!",
            "STEP 3:\n\nShoot the ship holding the correct letter to answer questions!"
        ],
        controls: {
            touch: "USE D-PAD LEFT/RIGHT. TAP FIRE.",
            mouse: "MOUSE (DRAG HORIZONTALLY. CLICK TO FIRE)",
            keys: "A/D OR ARROWS TO MOVE. SPACEBAR TO FIRE.",
            both: "MOUSE OR KEYBOARD. CLICK/SPACE TO FIRE."
        },
        labels: {
            score: "SCORE", level: "LEVEL", lives: "LIVES",
            difficulty: "DIFFICULTY", normal: "NORMAL", hard: "HARD MODE",
            controls: "CONTROLS", controlsPrefix: "CONTROLS:", activeControls: "ACTIVE CONTROLS",
            mouse: "MOUSE", keys: "KEYS", both: "BOTH",
            questionsPerLevel: "QUESTIONS/LEVEL",
            skip: "SKIP", next: "NEXT ➡"
        },
        answerLabels: ["A", "B", "C", "D"],
        share: {                                   // the SHARE YOUR SCORE button and score card on the game over screen
            name: "Quizaga",                       // the game's name in posts
            button: "TRANSMIT YOUR SCORE",
            tagline: "SPACE-SHOOTER QUIZ",         // under the title on the score card
            // {game} {score} {level} {correct} {answered} {accuracy} {ships} are filled in
            message: "I scored {score} in {game}! I reached level {level} and blasted {correct} correct-answer ships. Can you beat it?",
            modeLabel: "MODE", shipsLabel: "SHIPS DESTROYED",
            heading: "SHARE YOUR SCORE",
            hint: "Copy or save the image, then paste or attach it to your post or message.",
            emailSubject: "My {game} score",
            finalScore: "FINAL SCORE", levelLabel: "LEVEL REACHED", rightLabel: "QUESTIONS RIGHT", accuracyLabel: "ACCURACY",
            copyImage: "COPY IMAGE", saveImage: "SAVE IMAGE", copyText: "COPY TEXT", more: "MORE…",
            copied: "COPIED!", couldNotCopy: "COULDN'T COPY", useSave: "USE SAVE IMAGE", pasteIt: "Text copied: paste it in"
        }
    },

    /* ---------- RULES ---------- */
    settings: {
        livesChoices: [1, 3, 5],                   // buttons on the title screen
        defaultLives: 3,
        questionsPerLevelChoices: [3, 5, 10],
        defaultQuestionsPerLevel: 5,
        pointsPerCorrect: 500,
        extraLifeEvery: 2000,                      // 0 = no extra lives
        showTutorial: true,                        // false = START jumps straight into the game
        autoFullscreen: true,                      // go full screen when START is pressed (if the page allows it)
        shuffleQuestions: true,                    // false = ask in the order written below
        shuffleAnswers: false,                     // true = mix up the A/B/C/D order each time
        showDifficulty: true,                      // show the NORMAL / HARD MODE choice
        defaultHardMode: false,                    // hard mode: ships shoot back and dive more often
        playerSpeed: 4,
        bulletSpeed: 13,
        enemyBulletSpeed: 3.5,
        starCount: 160,                            // 0 = no starfield
        showShare: true,                           // SHARE YOUR SCORE on the game over screen
        shareUrl: "https://jvanwagner.neocities.org/pages/project-game-quizaga.html"   // the link in shared posts
    },

    /* ---------- COLORS (any CSS color: "#ff0000", "red", "rgb(255,0,0)") ---------- */
    colors: {
        brand: "#3232FF",                          // buttons and title shadow
        accent: "#f1c40f",                         // title and score text
        pageBackground: "#111111",
        correct: "#2ecc71",
        wrong: "#e74c3c",
        answers: ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f"],   // A, B, C, D (ships and labels)
        space: "#000810",                          // game background
        stars: "#ffffff",
        laser: "#ffff66"
    },

    /* ---------- SPRITES & BACKGROUND ----------
       To swap in your own picture, put an image link or a data: URI in "image" (e.g. "https://.../ship.png").
       Otherwise the pixel art below is used: each letter is one pixel, colored by "palette".
       "." is see-through. The palette color "answer" means "this ship's A/B/C/D color".
       "size" is the width in game pixels (the game screen is 560 x 640). */
    sprites: {
        player: {
            image: "",
            size: 44,
            palette: { W: "#ffffff", B: "#3498db", R: "#e74c3c", Y: "#f1c40f" },
            pixels: [
                "......W......",
                ".....WWW.....",
                ".....WBW.....",
                "....WWBWW....",
                "....WWWWW....",
                "...WWRWRWW...",
                "..WWWRWRWWW..",
                ".WWWWWWWWWWW.",
                "WWWYWWWWWYWWW",
                "WWWYW.W.WYWWW",
                "WW....W....WW"
            ]
        },
        enemy: {                                   // a crab-shaped ship: rear thrusters at the top, claws pointing down at you
            image: "",
            size: 38,
            palette: { M: "answer", G: "#9aa3b5", B: "#9be7ff", W: "#ffffff", K: "#2b2d42" },
            pixels: [
                ".....GG.GG.....",
                "....MMMMMMM....",
                ".G.MMMMMMMMM.G.",
                "G.MMMMMMMMMMM.G",
                "..MMMMWBBMMMM..",
                "...MMMBBBMMM...",
                "..GG.MMMMM.GG..",
                ".GG...MMM...GG.",
                "MMM....K....MMM",
                "M.M....K....M.M",
                "M.M.........M.M"
            ]
        },
        background: {
            image: ""                              // fills the game screen behind the stars
        }
    },

    /* ---------- QUESTIONS ----------
       q = question, opts = 2 to 4 answers (A, B, C, D), ans = number of the correct answer
       counting from 0 (0 = A, 1 = B, 2 = C, 3 = D). */
    questions: [
        { q: "What is the capital of France?", opts: ["Rome", "Berlin", "Paris", "Madrid"], ans: 2 },
        { q: "Which planet is known as the Red Planet?", opts: ["Mars", "Saturn", "Venus", "Jupiter"], ans: 0 },
        { q: "How many continents are there?", opts: ["6", "7", "8", "5"], ans: 1 },
        { q: "What gas do plants take in from the air?", opts: ["Nitrogen", "Oxygen", "Helium", "Carbon dioxide"], ans: 3 },
        { q: "What is the largest ocean on Earth?", opts: ["Pacific", "Indian", "Arctic", "Atlantic"], ans: 0 },
        { q: "How many legs does a spider have?", opts: ["6", "10", "8", "12"], ans: 2 },
        { q: "At what temperature does water freeze in Fahrenheit?", opts: ["100°F", "32°F", "0°F", "50°F"], ans: 1 },
        { q: "Which animal is called the \"King of the Jungle\"?", opts: ["Elephant", "Gorilla", "Lion", "Tiger"], ans: 2 },
        { q: "What color do you get when you mix blue and yellow?", opts: ["Purple", "Orange", "Green", "Brown"], ans: 2 },
        { q: "Who painted the Mona Lisa?", opts: ["Pablo Picasso", "Claude Monet", "Vincent van Gogh", "Leonardo da Vinci"], ans: 3 },
        { q: "What is the tallest animal in the world?", opts: ["Ostrich", "Elephant", "Horse", "Giraffe"], ans: 3 },
        { q: "How many days are in a leap year?", opts: ["366", "364", "365", "367"], ans: 0 },
        { q: "Which instrument has 88 keys?", opts: ["Violin", "Piano", "Guitar", "Trumpet"], ans: 1 },
        { q: "In which sport do you score a touchdown?", opts: ["Soccer", "American football", "Tennis", "Basketball"], ans: 1 },
        { q: "What is the largest planet in our solar system?", opts: ["Neptune", "Saturn", "Jupiter", "Earth"], ans: 2 },
        { q: "What do bees make?", opts: ["Syrup", "Jam", "Butter", "Honey"], ans: 3 },
        { q: "How many sides does a hexagon have?", opts: ["6", "7", "5", "8"], ans: 0 },
        { q: "Which country is home to the kangaroo?", opts: ["India", "Brazil", "Canada", "Australia"], ans: 3 },
        { q: "What is H2O more commonly called?", opts: ["Water", "Oxygen", "Sugar", "Salt"], ans: 0 },
        { q: "Which fruit \"keeps the doctor away,\" according to the saying?", opts: ["A banana", "An orange", "A grape", "An apple"], ans: 3 },
        { q: "What is the closest star to Earth?", opts: ["The Sun", "Sirius", "Polaris", "Alpha Centauri"], ans: 0 },
        { q: "How many minutes are in an hour?", opts: ["30", "100", "60", "90"], ans: 2 },
        { q: "What is the main ingredient in guacamole?", opts: ["Lime", "Tomato", "Avocado", "Pepper"], ans: 2 },
        { q: "Which of these animals is a mammal?", opts: ["Shark", "Trout", "Dolphin", "Octopus"], ans: 2 },
        { q: "Which famous ship sank on its first voyage in 1912?", opts: ["Santa Maria", "Titanic", "Lusitania", "Mayflower"], ans: 1 },
        { q: "What shape has three sides?", opts: ["Square", "Circle", "Triangle", "Pentagon"], ans: 2 },
        { q: "What is the longest river in South America?", opts: ["Danube", "Amazon", "Nile", "Mississippi"], ans: 1 },
        { q: "What does a thermometer measure?", opts: ["Speed", "Temperature", "Time", "Weight"], ans: 1 },
        { q: "How many players does one soccer team have on the field?", opts: ["11", "12", "9", "10"], ans: 0 },
        { q: "What is 7 × 8?", opts: ["56", "48", "54", "64"], ans: 0 },
        { q: "What is the smallest US state by area?", opts: ["Delaware", "Vermont", "Rhode Island", "Connecticut"], ans: 2 },
        { q: "What does a caterpillar turn into?", opts: ["A butterfly or moth", "A beetle", "A bee", "A spider"], ans: 0 },
        { q: "Which month has the fewest days?", opts: ["April", "November", "February", "January"], ans: 2 },
        { q: "Who wrote \"Romeo and Juliet\"?", opts: ["Charles Dickens", "Mark Twain", "William Shakespeare", "Jane Austen"], ans: 2 },
        { q: "What is the hardest natural substance?", opts: ["Diamond", "Iron", "Gold", "Quartz"], ans: 0 },
        { q: "Which of these is a primary color of paint?", opts: ["Purple", "Green", "Orange", "Red"], ans: 3 },
        { q: "In which country are the Great Pyramids of Giza?", opts: ["India", "Egypt", "Mexico", "Peru"], ans: 1 },
        { q: "What is a baby cat called?", opts: ["A kitten", "A foal", "A puppy", "A cub"], ans: 0 },
        { q: "How many strings does a standard guitar have?", opts: ["4", "6", "5", "8"], ans: 1 },
        { q: "Which planet is famous for its rings?", opts: ["Mars", "Saturn", "Venus", "Mercury"], ans: 1 }
    ]
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    /* ==================== SHARED QUIZCADE STYLES (same in every game) ==================== */
    /* Colors come from the EDIT ZONE (colors.brand, colors.accent, ...) and are applied at startup. */
    :root {
        --brand: #3232FF;
        --accent: #f1c40f;
        --page-bg: #111111;
        --good: #2ecc71;
        --bad: #e74c3c;
    }

    /* html only fills the window; the page padding and min-height live on body alone
       (on both, the page came out 20px taller than the window and always scrolled) */
    html { margin: 0; padding: 0; background-color: var(--page-bg); }
    body {
        margin: 0;
        padding: 10px;
        background-color: var(--page-bg);
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
        overscroll-behavior-y: contain;
    }
    :fullscreen { background-color: var(--page-bg); }
    button { font: inherit; }
    .retro-text { font-family: 'Press Start 2P', 'Courier New', Courier, monospace; }

    #game-wrapper {
        width: 100%;
        max-width: 950px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h1 {
        margin: 0 0 15px 0;
        flex-shrink: 0;
        font-size: clamp(16px, 4vw, 24px);
        color: var(--accent);
        text-align: center;
        text-shadow: 2px 2px 0 var(--brand);
    }

    /* Game column + question sidebar */
    #main-content {
        width: 100%;
        display: flex;
        flex-direction: row;
        gap: 20px;
        align-items: stretch;
        justify-content: center;
    }
    #game-column {
        flex: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 300px;
    }
    #ui-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: clamp(8px, 1.5vw, 12px);
        background: #222;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid #555;
        text-transform: uppercase;
    }
    #ui-bar .hud-value { color: var(--accent); }
    #lives-display { display: inline-block; transition: transform 0.2s; }
    #game-container {
        position: relative;
        width: 100%;
        max-width: 560px;
        box-shadow: 0 0 0 4px #444;
        background-color: #000;
    }
    #gameCanvas {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        image-rendering: pixelated;
    }
    #active-controls-hud {
        margin-top: 15px;
        text-align: center;
        font-size: 10px;
        color: #ccc;
        background: #222;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #444;
        line-height: 1.4;
        width: 100%;
        max-width: 560px;
        box-sizing: border-box;
    }

    /* Fullscreen button (hidden automatically where full screen isn't allowed) */
    #fs-toggle-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: 2px solid #fff;
        border-radius: 5px;
        width: 40px;
        height: 40px;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 20;
        transition: background 0.2s, transform 0.1s;
    }
    #fs-toggle-btn:hover { background: rgba(255, 255, 255, 0.3); }
    #fs-toggle-btn:active { transform: scale(0.9); }

    .flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 5;
    }
    #red-flash { background-color: var(--bad); }
    #green-flash { background-color: var(--good); }
    .flash.on { opacity: 0.6; }

    /* Title / game over screens */
    .modal {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        padding: 5%;
        box-sizing: border-box;
        z-index: 10;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow-y: auto;
    }
    .modal.open { display: flex; }
    #game-container.tall-modal #gameCanvas { display: none; }
    #game-container.tall-modal .modal.open { position: relative; inset: auto; }
    /* centered when it fits, scrollable from the top when it doesn't (short screens) */
    .modal > :first-child { margin-top: auto; }
    .modal > :last-child { margin-bottom: auto; }
    .modal h2 {
        margin-top: 0;
        color: var(--accent);
        font-size: clamp(20px, 4vw, 30px);
        line-height: 1.6;
        text-shadow: 2px 2px 0 var(--brand);
    }
    #title-modal h2 { margin-bottom: 10px; }
    #game-over-modal h2 { color: var(--bad); text-shadow: 2px 2px 0 #fff; }
    .final-score { font-size: 10px; margin-top: 20px; }
    #final-score { font-size: 20px; color: var(--accent); }

    .settings-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 15px;
        font-size: 10px;
        color: #ccc;
    }
    .toggle-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .toggle-btn {
        background: #222;
        color: #777;
        border: 2px solid #444;
        padding: 10px 15px;
        font-size: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .toggle-btn.active {
        background: var(--brand);
        color: #fff;
        border-color: #fff;
    }
    .action-btn {
        background: var(--brand);
        color: white;
        border: 4px solid #fff;
        padding: 15px 20px;
        font-size: clamp(12px, 3vw, 16px);
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 20px;
        width: 100%;
        max-width: 350px;
    }
    .action-btn:hover { background: #fff; color: var(--brand); border-color: var(--brand); }
    .action-btn:active { transform: scale(0.95); }

    /* Credit line: pixel head + copyright, links to the portfolio */
    .jv-credit {
        margin-top: 14px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 8px;
        line-height: 1.4;
        color: #aaa;
        text-decoration: none;
        letter-spacing: 1px;
    }
    .jv-credit img { width: 20px; height: 20px; image-rendering: pixelated; flex-shrink: 0; }
    .jv-credit .jv-name { color: var(--accent); }
    .jv-credit:hover .jv-name, .jv-credit:focus-visible .jv-name { text-decoration: underline; }

    /* Question sidebar */
    #sidebar {
        flex: 1;
        min-width: 250px;
        background-color: #000;
        padding: 20px;
        box-sizing: border-box;
        display: none;
        flex-direction: column;
        box-shadow: 0 0 0 4px #444, inset 0 0 0 2px #fff;
    }
    #sidebar.open { display: flex; }
    #question-panel { flex-grow: 1; display: flex; flex-direction: column; }
    #question-text {
        font-size: 16px;
        color: var(--accent);
        margin-bottom: 20px;
        line-height: 1.4;
        font-weight: 600;
    }
    .answer-option {
        display: flex;
        gap: 10px;
        align-items: baseline;
        background: #111;
        border: 2px solid #333;
        border-left: 6px solid var(--answer-color, #444);
        border-radius: 5px;
        padding: 10px 12px;
        margin-bottom: 10px;
        font-size: 14px;
        line-height: 1.4;
    }
    .answer-option .answer-letter { color: var(--answer-color, #fff); font-weight: bold; }
    .option-btn {
        background: #111;
        color: white;
        border: 2px solid #444;
        padding: 15px;
        margin-bottom: 12px;
        text-align: left;
        font-size: 12px;
        line-height: 1.6;
        cursor: pointer;
        transition: background 0.2s;
        border-radius: 5px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 500;
        width: 100%;
    }
    .option-btn:hover { background: #333; border-color: #fff; }
    .option-btn .answer-letter { color: var(--answer-color, #fff); }
    .option-btn.correct { background: #27ae60 !important; border-color: #2ecc71 !important; color: #000; }
    .option-btn.wrong { background: #c0392b !important; border-color: #e74c3c !important; }
    .sidebar-section {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px dashed #444;
        text-align: center;
    }
    .sidebar-heading { font-size: 8px; margin-bottom: 10px; color: #aaa; }
    #extra-life-note { font-size: 12px; font-weight: bold; color: var(--good); }

    /* Tutorial overlay */
    #demo-ui {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 15;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 40px 20px;
        box-sizing: border-box;
    }
    #demo-ui.open { display: flex; }
    #demo-text {
        background: rgba(0, 0, 0, 0.95);
        color: var(--accent);
        padding: 20px;
        border: 2px solid var(--accent);
        font-size: 14px;
        font-weight: bold;
        text-align: center;
        border-radius: 5px;
        width: 90%;
        margin-bottom: 20px;
        line-height: 1.5;
        white-space: pre-line;
    }
    .demo-btn-row { display: flex; gap: 15px; width: 100%; justify-content: center; }
    .demo-btn {
        background: var(--bad);
        color: white;
        border: 2px solid #fff;
        padding: 12px 25px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 5px;
        text-transform: uppercase;
    }
    #next-demo-btn { background: var(--good); color: #000; animation: pulseBtn 1.5s infinite; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* Touch-screen controls */
    #mobile-controls {
        display: none;
        gap: 10px;
        margin-top: 15px;
        justify-content: center;
        width: 100%;
    }
    body.touch #mobile-controls { display: grid; }
    .dpad-btn {
        background-color: rgba(255, 255, 255, 0.2);
        border: 4px solid rgba(255, 255, 255, 0.5);
        color: white;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }
    .dpad-btn:active { background-color: var(--brand); border-color: #fff; }
    #btn-action { background-color: var(--bad); border-radius: 5px; font-size: 14px; font-weight: bold; }
    #btn-action:active { filter: brightness(0.8); }
    body.touch .hide-on-touch { display: none !important; }
    body.touch #active-controls-hud { margin-top: 8px; padding: 6px; font-size: 8px; }
    body.touch #mobile-controls { margin-top: 8px; }

    @media (max-width: 800px) {
        #main-content { flex-direction: column; align-items: center; }
        #game-column, #sidebar { width: 100%; max-width: 560px; }
    }
    /* Share your score (game over screen) */
    .share-btn { background: var(--accent); color: #111; margin-top: 12px; }
    .share-btn:hover { background: #fff; color: var(--brand); border-color: var(--accent); }
    .share-panel {
        width: 100%;
        max-width: 470px;
        margin-top: 12px;
        padding: 12px;
        box-sizing: border-box;
        border: 2px solid #444;
        background: #000;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .share-panel[hidden] { display: none; }
    .share-heading { font-size: 10px; color: var(--accent); }
    .share-preview { width: 128px; align-self: center; border: 2px solid #444; }

    .share-hint { font-size: 11px; color: #888; }
    /* ==================== END SHARED STYLES ==================== */

    /* ==================== QUIZAGA ==================== */
    #gameCanvas { cursor: crosshair; touch-action: none; }
    #mobile-controls { grid-template-columns: 70px 70px 90px; grid-template-rows: 70px; }
    /* On narrow screens the question sits above the game so it's always in view while you play */

        .answer-option { margin: 0; padding: 6px 8px; font-size: 13px; }
        #sidebar .sidebar-section { display: none; }
    }
</style>

<script id="quizcade-engine">
"use strict";
/* =========================================================================================
   SHARED QUIZCADE ENGINE (same in every game): settings, screens, questions, sprites, loop.
   ========================================================================================= */
const CFG = QUIZCADE, T = CFG.text, S = CFG.settings, C = CFG.colors;
const $ = id => document.getElementById(id);
const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);

// Phones and tablets (a touch screen with no mouse) get the on-screen buttons
const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

// Words and colors from the EDIT ZONE
document.title = T.pageTitle || T.title;
document.querySelectorAll('[data-text]').forEach(el => {
    const v = getPath(T, el.dataset.text);
    if (typeof v === 'string') el.textContent = v;
});
[['--brand', C.brand], ['--accent', C.accent], ['--page-bg', C.pageBackground], ['--good', C.correct], ['--bad', C.wrong]]
    .forEach(([name, value]) => { if (value) document.documentElement.style.setProperty(name, value); });

// Credit years: 2025 (first made) through the current year, updated automatically
document.querySelectorAll('.jv-years').forEach(el => {
    const year = new Date().getFullYear();
    el.textContent = year > 2025 ? '2025–' + year : '2025';
});

// Extra-life note in the sidebar
if (S.extraLifeEvery > 0) $('extra-life-note').textContent = (T.extraLife || '').replace('{points}', S.extraLifeEvery);
else $('extra-life-section').style.display = 'none';

function showEl(id, on) {
    $(id).classList.toggle('open', on);
    if (id === 'game-over-modal' && !on) window.shareOpen = false;
    if ($(id).classList.contains('modal')) sizeForModal();
}
// A title/game-over screen taller than the game screen (short mazes, phones, the share panel)
// takes the game screen's place at its full height, instead of getting cut off.
function sizeForModal() {
    const box = $('game-container');
    box.classList.remove('tall-modal');
    const open = box.querySelector('.modal.open');
    if (open && open.scrollHeight > open.clientHeight + 1) box.classList.add('tall-modal');
}

// A row of toggle buttons (lives, questions per level, ...). onPick gets the chosen value.
function buildChoices(group, values, current, onPick, label = v => String(v)) {
    group.innerHTML = '';
    values.forEach(v => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'toggle-btn retro-text' + (v === current ? ' active' : '');
        b.textContent = label(v);
        b.addEventListener('click', () => {
            group.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
            b.blur();   // so SPACE fires in the game instead of pressing this button again
            onPick(v);
        });
        group.appendChild(b);
    });
}

// Control mode: 'mouse' | 'keyboard' | 'both' | 'mobile' (touch screens)
let controlMode = isTouch ? 'mobile' : 'both';
function setControlMode(mode) {
    controlMode = mode;
    document.querySelectorAll('.control-group button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const hud = $('active-controls-hud'), b = document.createElement('b');
    b.textContent = T.labels.controlsPrefix;
    const key = { mobile: 'touch', mouse: 'mouse', keyboard: 'keys', both: 'both' }[mode];
    hud.replaceChildren(b, ' ' + T.controls[key]);
}
document.querySelectorAll('.control-group').forEach(group => {
    [['mouse', T.labels.mouse], ['keyboard', T.labels.keys], ['both', T.labels.both]].forEach(([mode, label]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'toggle-btn retro-text';
        b.dataset.mode = mode;
        b.textContent = label;
        b.addEventListener('click', () => { b.blur(); setControlMode(mode); });
        group.appendChild(b);
    });
});
setControlMode(controlMode);

// Full screen (the button hides itself where the browser or the embedding page doesn't allow it)
const fullscreenAllowed = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function enterFullscreen() {
    try {
        const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        const p = req && req.call(el);
        if (p && p.catch) p.catch(() => {});
    } catch (e) { /* blocked: keep playing in the page */ }
}
function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
    } else enterFullscreen();
}
if (!fullscreenAllowed) $('fs-toggle-btn').style.display = 'none';
$('fs-toggle-btn').addEventListener('click', toggleFullscreen);

// Score, level and lives
let score = 0, lives = 3, level = 1, questionsAnsweredThisLevel = 0, nextExtraLife = S.extraLifeEvery;
let selectedLives = S.defaultLives, selectedQPL = S.defaultQuestionsPerLevel;
function updateUI() {
    $('score-display').textContent = String(score).padStart(6, '0');
    $('level-display').textContent = `${String(level).padStart(2, '0')} (${questionsAnsweredThisLevel}/${selectedQPL})`;
    $('lives-display').textContent = lives > 5 ? '❤️×' + lives : '❤️'.repeat(Math.max(0, lives));
}
function addScore(pts) {
    score += pts;
    if (S.extraLifeEvery > 0 && score >= nextExtraLife) {
        lives++;
        nextExtraLife += S.extraLifeEvery;
        const livesEl = $('lives-display');
        livesEl.style.transform = 'scale(1.5)';
        setTimeout(() => { livesEl.style.transform = 'scale(1)'; }, 300);
    }
    updateUI();
}
// Totals for the score card: correct / answered, plus anything a game adds (dots, ghosts...)
let runStats = { correct: 0, answered: 0 };
function resetScore() {
    score = 0; level = 1; questionsAnsweredThisLevel = 0;
    nextExtraLife = S.extraLifeEvery; lives = selectedLives;
    runStats = { correct: 0, answered: 0 };
    updateUI();
}
function countAnswer(right) {
    runStats.answered++;
    if (right) runStats.correct++;
}
buildChoices($('lives-group'), S.livesChoices, selectedLives, v => { selectedLives = v; });
buildChoices($('questions-group'), S.questionsPerLevelChoices, selectedQPL, v => { selectedQPL = v; updateUI(); });

// Screen flashes
function flash(id, ms) {
    const f = $(id);
    f.classList.add('on');
    if (ms) setTimeout(() => f.classList.remove('on'), ms);
}
function unflash(id) { $(id).classList.remove('on'); }

// Questions: only well-formed ones are used, dealt from a shuffled deck so none repeat until all are used
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}
const QUESTIONS = (CFG.questions || []).filter((item, i) => {
    const ok = item && typeof item.q === 'string' && Array.isArray(item.opts) &&
        item.opts.length >= 2 && item.opts.length <= 4 && Number.isInteger(item.ans) && item.ans >= 0 && item.ans < item.opts.length;
    if (!ok) console.warn('Quizcade: skipping question #' + (i + 1) + ' (needs q, 2 to 4 opts and a valid ans).', item);
    return ok;
});
if (!QUESTIONS.length) QUESTIONS.push({ q: 'No questions yet: add some in the EDIT ZONE.', opts: ['OK', 'Got it'], ans: 0 });
let questionDeck = [];
function nextQuestion() {
    if (!questionDeck.length) questionDeck = S.shuffleQuestions ? shuffle(QUESTIONS.slice()) : QUESTIONS.slice().reverse();
    const src = questionDeck.pop();
    const q = { q: src.q, opts: src.opts.map(String), ans: src.ans };
    if (S.shuffleAnswers) {
        const order = shuffle(q.opts.map((_, i) => i));
        q.opts = order.map(i => String(src.opts[i]));
        q.ans = order.indexOf(src.ans);
    }
    return q;
}
const answerLabel = i => (T.answerLabels && T.answerLabels[i]) || 'ABCD'[i];
const answerColor = i => C.answers[i % C.answers.length];

// Show a question in the sidebar. With onPick the answers are buttons; otherwise they're a key to the game.
function renderQuestion(q, onPick) {
    $('question-text').textContent = q.q;
    const box = $('options-container');
    box.replaceChildren();
    q.opts.forEach((text, i) => {
        const row = document.createElement(onPick ? 'button' : 'div');
        row.className = onPick ? 'option-btn' : 'answer-option';
        row.style.setProperty('--answer-color', answerColor(i));
        const letter = document.createElement('strong');
        letter.className = 'answer-letter';
        letter.textContent = '[' + answerLabel(i) + ']';
        const label = document.createElement('span');
        label.textContent = text;
        row.append(letter, label);
        if (onPick) { row.type = 'button'; row.addEventListener('click', () => onPick(i, row)); }
        box.appendChild(row);
    });
}
function showPrompt(text) {
    $('question-text').textContent = text;
    $('options-container').replaceChildren();
}

// Sprites: an "image" (link or data: URI) if one is set, otherwise the pixel art.
function loadImage(src) {
    if (!src) return null;
    const img = new Image();
    img.onerror = () => console.warn('Quizcade: could not load image', src.slice(0, 80));
    img.src = src;
    return img;
}
const imageReady = img => !!(img && img.complete && img.naturalWidth);
function pixelArt(pixels, palette, tint) {
    if (!pixels || !pixels.length) return null;
    const c = document.createElement('canvas');
    c.width = Math.max(...pixels.map(r => r.length));
    c.height = pixels.length;
    const g = c.getContext('2d');
    pixels.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
            let color = palette[row[x]];
            if (color === 'answer' || color === 'tint') color = tint;
            if (!color) continue;   // "." or any letter not in the palette = see-through
            g.fillStyle = color;
            g.fillRect(x, y, 1, 1);
        }
    });
    return c;
}
function makeSprite(def, tint) {
    def = def || {};
    return { def, img: loadImage(def.image), art: pixelArt(def.pixels, def.palette || {}, tint) };
}
// Draws a sprite centered on (x, y), `width` game pixels wide (height follows the picture's shape).
function drawSprite(g, spr, x, y, width) {
    const src = imageReady(spr.img) ? spr.img : spr.art;
    if (!src) return false;
    const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
    const w = width || spr.def.size || sw, h = w * sh / sw;
    g.imageSmoothingEnabled = sw > w;   // crisp when enlarging pixel art, smooth when shrinking big pictures
    g.drawImage(src, x - w / 2, y - h / 2, w, h);
    return true;
}
// Fills the whole canvas with a picture, cropping to keep its shape (like CSS background-size: cover)
function drawCover(g, img, w, h) {
    if (!imageReady(img)) return false;
    const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
    const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    g.imageSmoothingEnabled = true;
    g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    return true;
}

// Fixed-speed game loop: the game logic runs 60 times a second on every screen
// (120 Hz and 144 Hz monitors used to run the games at double speed), drawing once per frame.
function startLoop(update, render) {
    const STEP = 1000 / 60;
    let last = performance.now(), acc = 0;
    function frame(now) {
        acc += Math.min(now - last, 250);
        last = now;
        let steps = Math.max(0, Math.round(acc / STEP));
        acc -= steps * STEP;
        if (steps > 5) { steps = 5; acc = 0; }
        while (steps-- > 0) update();
        render();
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}

// FIT TO WINDOW: shrinks the game (never below 300px wide) so the whole thing fits the window's height,
// with no scrollbars, whether it's on a page, in a small window, in an embed, full screen or saved to your desktop.
(function () {
    function fit() {
        sizeForModal();
        const w = $('game-wrapper');
        const cs = getComputedStyle(document.body);
        const avail = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
        w.style.maxWidth = '';
        sizeForModal();
        if (window.shareOpen || w.offsetHeight <= avail) return;   // an open share panel scrolls instead
        let lo = 300, hi = w.offsetWidth;
        for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            w.style.maxWidth = mid + 'px';
            sizeForModal();   // a narrower screen wraps the open screen's text taller
            if (w.offsetHeight > avail) hi = mid; else lo = mid;
        }
        w.style.maxWidth = Math.floor(lo) + 'px';
        sizeForModal();
    }
    let t;
    window.fitGame = () => { clearTimeout(t); t = setTimeout(fit, 60); };
    window.addEventListener('resize', window.fitGame);
    window.addEventListener('load', fit);
    document.addEventListener('fullscreenchange', () => setTimeout(fit, 120));
    [0, 300, 1200].forEach(ms => setTimeout(fit, ms));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => window.fitGame());
})();

/* ---------- SHARE YOUR SCORE (game over screen) ----------
   Every link opens that site's compose box with the post already written. Facebook ignores any
   text a site passes in, so its button copies the text first for the player to paste. Save image /
   Copy image make a themed score card PNG (each game draws its own art in drawCardArt()).
   Nothing leaves the page unless the player picks one of these. */
const SHT = T.share || {};
const shareOn = S.showShare !== false && !!S.shareUrl;
const fillIn = (str, vals) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (k in vals ? vals[k] : m));
const creditYears = () => { const y = new Date().getFullYear(); return y > 2025 ? '2025–' + y : '2025'; };

function shareValues() {
    const v = { game: SHT.name || T.title, score: score.toLocaleString(), level };
    for (const [k, n] of Object.entries(runStats)) v[k] = typeof n === 'number' ? n.toLocaleString() : n;
    v.accuracy = runStats.answered ? Math.round(100 * runStats.correct / runStats.answered) + '%' : '–';
    return v;
}

function copyPlainText(text) {
    return navigator.clipboard.writeText(text).then(() => true, () => {
        // blocked (e.g. an embed without clipboard-write): the old way still works
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
        document.body.append(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { /* unsupported */ }
        area.remove();
        return ok;
    });
}
const canCopyImage = () => typeof ClipboardItem !== 'undefined' && !!(navigator.clipboard && navigator.clipboard.write);
async function copyImage(png) {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]); return true; }
    catch (e) { return false; }
}
async function saveImage(png) {
    const blob = await png;
    if (!blob) return;

// The score card: the game's own art on top, then the score, the stats and the credit
async function drawScoreCard(vals) {
    try { await document.fonts.load('40px "Press Start 2P"'); } catch (e) { /* falls back to Courier */ }
    const W = 1080, H = 1350, ART = 560;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const F = px => px + 'px "Press Start 2P", "Courier New", monospace';
    const fit = (text, max, px) => { g.font = F(px); while (g.measureText(text).width > max && px > 12) g.font = F(px -= 2); return px; };

    g.fillStyle = C.pageBackground || '#111';
    g.fillRect(0, 0, W, H);
    g.save();
    g.beginPath(); g.rect(0, 0, W, ART); g.clip();
    drawCardArt(g, W, ART);
    g.restore();

    // Title over the art
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    fit(T.title, W - 120, 72);
    g.fillStyle = C.brand; g.fillText(T.title, W / 2 + 6, 126);
    g.fillStyle = C.accent; g.fillText(T.title, W / 2, 120);
    if (SHT.tagline) {
        g.font = F(22);
        g.fillStyle = 'rgba(0,0,0,0.55)';
        const tw = g.measureText(SHT.tagline).width;
        g.fillRect(W / 2 - tw / 2 - 16, 148, tw + 32, 42);
        g.fillStyle = '#fff';
        g.fillText(SHT.tagline, W / 2, 180);
    }
    g.fillStyle = C.brand;
    g.fillRect(0, ART, W, 10);

    // Final score
    g.fillStyle = '#aaa';
    g.font = F(26);
    g.fillText(SHT.finalScore || 'FINAL SCORE', W / 2, ART + 80);
    fit(vals.score, W - 120, 96);
    g.fillStyle = C.brand; g.fillText(vals.score, W / 2 + 5, ART + 205);
    g.fillStyle = C.accent; g.fillText(vals.score, W / 2, ART + 200);

    // Stats
    const rows = [
        [SHT.levelLabel || 'LEVEL REACHED', vals.level],
        [SHT.rightLabel || 'QUESTIONS RIGHT', vals.correct + ' / ' + vals.answered],
        [SHT.accuracyLabel || 'ACCURACY', vals.accuracy],
        ...cardRows(vals)
    ];
    let y = ART + 290;
    for (const [label, value] of rows) {
        g.textAlign = 'left'; g.fillStyle = '#ccc'; fit(String(label), 600, 24); g.fillText(label, 70, y);
        g.textAlign = 'right'; g.fillStyle = '#fff'; fit(String(value), 300, 24); g.fillText(String(value), W - 70, y);
        g.fillStyle = '#333'; g.fillRect(70, y + 20, W - 140, 3);
        y += 64;
    }

    // Footer: where to play, then the credit with the pixel head
    const link = S.shareUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
    g.textAlign = 'center';
    g.fillStyle = '#999';
    fit(link, W - 140, 18);
    g.fillText(link, W / 2, H - 92);
    const credit = '© ' + creditYears() + ' Joe VanWagner';
    g.font = F(18);
    const cw = g.measureText(credit).width;
    const iconEl = document.querySelector('.jv-credit img');
    const icon = iconEl && await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = iconEl.src; });
    const left = W / 2 - (cw + (icon ? 52 : 0)) / 2;
    if (icon) {
        g.imageSmoothingEnabled = false;
        g.drawImage(icon, left, H - 70, 40, 40);
    }
    g.textAlign = 'left';
    g.fillStyle = C.accent;
    g.fillText(credit, left + (icon ? 52 : 0), H - 40);
    return c;
}

// Called when the game ends: writes the post and wires every button for this run
function prepareShare() {
    if (!shareUI) return;
    const { button, panel, preview, text, tools, links } = shareUI;
    const mobile = isTouch && !!navigator.share;
    const vals = shareValues();
    const message = fillIn(SHT.message || 'I scored {score} in {game}!', vals);
    const url = S.shareUrl, full = message + ' ' + url, enc = encodeURIComponent;

    panel.hidden = true;
    window.shareOpen = false;
    if (preview.src) URL.revokeObjectURL(preview.src);
    preview.removeAttribute('src');
    text.textContent = full;

    const flashLabel = (btn, ok, fail) => {
        const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
        btn.textContent = ok ? (SHT.copied || 'COPIED!') : (fail || SHT.couldNotCopy || "COULDN'T COPY");

    };
    const small = (label, onClick) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'toggle-btn retro-text'; b.textContent = label;

        small(SHT.saveImage || 'SAVE IMAGE', () => saveImage(getPng())),
        small(SHT.copyText || 'COPY TEXT', async e => flashLabel(e.currentTarget, await copyPlainText(full)))
    );

    const tag = enc('#' + (SHT.name || T.title).replace(/\W/g, ''));
    const targets = [
        ['Bluesky', 'https://bsky.app/intent/compose?text=' + enc(full)],
        ['X', 'https://x.com/intent/post?text=' + enc(message) + '&url=' + enc(url)],
        ['Threads', 'https://www.threads.net/intent/post?text=' + enc(full)],
        ['Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url) + '&hashtag=' + tag, true],
        ['Reddit', 'https://www.reddit.com/submit?url=' + enc(url) + '&title=' + enc(message)],
        ['WhatsApp', 'https://wa.me/?text=' + enc(full)],
        ['Email', 'mailto:?subject=' + enc(fillIn(SHT.emailSubject || 'My {game} score', vals)) + '&body=' + enc(message + '\n\n' + url)],
        ...(mobile ? [['Text', 'sms:?&body=' + enc(full)]] : [])
    ];
    links.replaceChildren(...targets.map(([label, href, copyFirst]) => {
        const a = document.createElement('a');
        a.className = 'toggle-btn share-link';
        a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label;
        // Facebook won't take pre-written text: it goes on the clipboard as the link opens
        if (copyFirst) a.addEventListener('click', () => { copyPlainText(full); flashLabel(a, true, null); a.textContent = SHT.pasteIt || 'Text copied: paste it in'; });
        return a;
    }));
    if (mobile) links.append(small(SHT.more || 'MORE…', () => shareNative()));

    // Phones and tablets open their own share sheet (with the picture when they can)
    async function shareNative() {
        try {
            const file = new File([await getPng()], 'score.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: SHT.name || T.title, text: full });
            else await navigator.share({ title: SHT.name || T.title, text: message, url });
        } catch (e) { /* cancelled: fine */ }
    }
    button.onclick = async () => {
        if (mobile) await shareNative();
        panel.hidden = false;
        window.shareOpen = true;
        if (!preview.src) { const blob = await getPng(); if (blob) preview.src = URL.createObjectURL(blob); }
        window.fitGame();
    };
    setTimeout(getPng, 300);   // draw the card in the background so Save / Copy image are instant
}

const canvas = $('gameCanvas');

const GH = canvas.height;

let deathFrame = 0;
let demoStep = 0;
let demoSubFrame = 0;
let formationTick = 0;

/* ---------- Title screen ---------- */

/* ---------- Input ---------- */
const keys = {};

function handleCanvasInteraction(e, isClick) {

/* ---------- Tutorial ---------- */
function resetDemoScene(step) {
    demoSubFrame = 0;
    player.x = GW / 2;
    player.tx = GW / 2;
    bullets = []; enemyBullets = []; enemies = []; particles = [];
    if (step === 1 || step === 2) {
        for (let i = 0; i < 4; i++) {
            const e = makeEnemy(i, 0, 4);
            e.y = e.homeY;
            e.state = 'FORMATION';
            e.isCorrect = step === 2 && i === 1;
            enemies.push(e);
        }
    }
}

function startGame() {
    if (S.autoFullscreen) enterFullscreen();
    showEl('title-modal', false);
    if (!S.showTutorial || !T.tutorial || !T.tutorial.length) { resetGame(true); return; }
    showEl('demo-ui', true);

    state = 'DEMO';

    updateDemoUI();

function skipDemo() {
    showEl('demo-ui', false);
    unflash('green-flash');
    isDemoMode = false;
    resetGame(true);
}

function advanceDemo() {
    demoStep++;
    if (demoStep >= Math.min(3, T.tutorial.length)) {
        skipDemo();
    } else {
        state = 'DEMO';
        resetDemoScene(demoStep);
        updateDemoUI();
    }
}

function updateDemoUI() {
    $('demo-text').textContent = T.tutorial[demoStep] || '';
}

function processDemoLogic() {
    demoSubFrame++;
    if (demoStep === 0) {
        if (demoSubFrame === 10) player.tx = GW / 2 - 100;
        if (demoSubFrame === 40) bullets.push({ x: player.x, y: player.y - 20 });
        if (demoSubFrame === 80) player.tx = GW / 2 + 100;
        if (demoSubFrame === 110) bullets.push({ x: player.x, y: player.y - 20 });
        if (demoSubFrame > 160) resetDemoScene(0);
    } else if (demoStep === 1) {
        if (demoSubFrame === 20 && enemies[0]) enemies[0].state = 'DIVE';
        if (demoSubFrame === 40) player.tx = GW / 2 - 150;
        if (demoSubFrame === 80 && isHardMode && enemies[0]) {
            enemyBullets.push({ x: enemies[0].x, y: enemies[0].y + 20, vx: -1, vy: 3, col: enemies[0].col });
        }
        if (demoSubFrame === 120) player.tx = GW / 2 + 150;
        if (demoSubFrame > 250) resetDemoScene(1);
    } else if (demoStep === 2) {
        if (demoSubFrame === 40 && enemies[1]) player.tx = enemies[1].x;
        if (demoSubFrame === 80) bullets.push({ x: player.x, y: player.y - 20 });
        if (demoSubFrame > 150) resetDemoScene(2);
    }
}

function drawDemoHighlights() {
    ctx.save();
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 4;
    const pulse = (Math.sin(Date.now() / 150) + 1) / 2 * 4;
    let box = null;
    if (demoStep === 0) box = { x: player.x, y: player.y, r: 22 };
    else if (demoStep === 1) {
        const diver = enemies.find(e => e.alive && e.state === 'DIVE') || enemies.find(e => e.alive);
        if (diver) box = { x: diver.x, y: diver.y, r: 18 };
    } else if (demoStep === 2 && enemies[1] && enemies[1].alive) box = { x: enemies[1].x, y: enemies[1].y, r: 18 };
    if (box) ctx.strokeRect(box.x - box.r - pulse / 2, box.y - box.r - pulse / 2, box.r * 2 + pulse, box.r * 2 + pulse);
    ctx.restore();
}

/* ---------- Game systems ---------- */
function makeEnemy(idx, spawnDelay, count) {
    const spacing = 90;
    const offsetX = (GW - ((count - 1) * spacing)) / 2;
    const homeX = offsetX + idx * spacing;
    return {
        x: homeX, y: -60 - spawnDelay,
        homeX, homeY: 120,
        state: 'ENTER',
        idx,
        isCorrect: currentQuestion ? idx === currentQuestion.ans : false,
        alive: true,
        col: answerColor(idx),
        divePhase: 0,
        kamikaze: false,
        startX: 0, startY: 0
    };
}

function updateEnemy(e) {
    if (!e.alive) return;
    const breatheX = Math.sin(formationTick) * 30;
    const breatheY = Math.cos(formationTick * 2) * 10;

    if (e.state === 'ENTER' || e.state === 'RETURN') {
        const targetX = e.homeX + breatheX, targetY = e.homeY + breatheY;
        e.x += (targetX - e.x) * 0.05;
        e.y += (targetY - e.y) * 0.05;
        if (Math.abs(e.x - targetX) < 5 && Math.abs(e.y - targetY) < 5) e.state = 'FORMATION';
    } else if (e.state === 'FORMATION') {
        e.x = e.homeX + breatheX;
        e.y = e.homeY + breatheY;
        // Dives are rare and slow enough to react to
        if (!isDemoMode && state === 'PLAY' && Math.random() < (isHardMode ? 0.002 : 0.0008)) {
            if (enemies.filter(en => en.alive && en.state === 'DIVE').length < 2) {
                e.state = 'DIVE';
                e.divePhase = 0;
                e.kamikaze = Math.random() < 0.2;
                e.startX = e.x;
                e.startY = e.y;
            }
        }
    } else if (e.state === 'DIVE') {
        e.divePhase += 0.015;
        if (e.kamikaze) e.x += (player.x - e.x) * 0.02;
        else e.x = e.startX + Math.sin(e.divePhase * 2) * 80;
        e.y += isHardMode ? 2.2 : 1.5;

        if (isHardMode && e.y > e.homeY + 50 && e.y < GH - 200 && Math.random() < 0.02) {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({ x: e.x, y: e.y + 20, vx: Math.cos(ang) * S.enemyBulletSpeed, vy: Math.sin(ang) * S.enemyBulletSpeed, col: e.col });
        }
        if (e.y > GH + 50) {
            e.state = 'RETURN';
            e.y = -50;
            e.x = e.homeX;
        }
    }
}

function spawnEnemies() {
    const count = currentQuestion ? currentQuestion.opts.length : 4;   // one ship per answer
    enemies = [];
    for (let i = 0; i < count; i++) enemies.push(makeEnemy(i, i * 30, count));
}

function initLevel() {
    currentQuestion = nextQuestion();
    renderQuestion(currentQuestion);
    spawnEnemies();
    window.fitGame();
}

function resetGame(fullReset = false) {
    if (fullReset) {
        resetScore();
        showEl('game-over-modal', false);
        showEl('sidebar', true);
    }
    player.x = GW / 2;
    player.tx = GW / 2;
    bullets = []; enemyBullets = []; particles = [];
    state = 'PLAY';
    updateUI();
    initLevel();
}

function startDeathSequence() {
    state = 'DYING';
    deathFrame = 0;
    flash('red-flash', 400);
}

function finishDeath() {
    if (isDemoMode) {
        resetDemoScene(demoStep);
        state = 'DEMO';
        return;
    }
    lives--;
    updateUI();
    if (lives <= 0) {
        state = 'GAMEOVER';
        $('final-score').textContent = String(score).padStart(6, '0');
        showEl('game-over-modal', true);
        prepareShare();
    } else {
        player.x = GW / 2;
        player.tx = GW / 2;
        bullets = []; enemyBullets = []; particles = [];
        // Send the ships back off-screen so they don't dive straight into you
        enemies.forEach(e => {
            if (e.alive) {
                e.state = 'ENTER';
                e.y = -60 - Math.random() * 60;
                e.x = e.homeX;
            }
        });
        state = 'PLAY';
    }
}

function checkWinCondition() {
    if (questionsAnsweredThisLevel >= selectedQPL) {
        level++;
        questionsAnsweredThisLevel = 0;
    }
    initLevel();   // always deal the next question
}

function hitEnemy(en) {
    en.alive = false;
    spawnParticles(en.x, en.y, en.col, 18);
    if (!isDemoMode) {
        runStats.ships = (runStats.ships || 0) + 1;
        countAnswer(en.isCorrect);
    }
    if (!en.isCorrect) { startDeathSequence(); return; }

    enemies.forEach(e2 => { if (e2.alive) { spawnParticles(e2.x, e2.y, e2.col, 10); e2.alive = false; } });
    enemyBullets = [];
    if (isDemoMode) { flash('green-flash', 500); return; }   // the tutorial just shows it off

    addScore(S.pointsPerCorrect);
    questionsAnsweredThisLevel++;
    updateUI();
    flash('green-flash');
    state = 'PAUSED';
    setTimeout(() => {
        unflash('green-flash');
        if (state !== 'PAUSED') return;
        checkWinCondition();
        state = 'PLAY';
    }, 1000);
}

function spawnParticles(x, y, col, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2 + Math.random() * 3, life: 1, decay: 0.03 + Math.random() * 0.02, col });
    }
}
function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.97; p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* ---------- Update (60 times a second) ---------- */
function update() {
    stars.forEach(s => {
        s.y += s.spd;
        if (s.y > GH) { s.y = -2; s.x = Math.random() * GW; }
    });
    formationTick += 0.02;

    if (state === 'PLAY' || state === 'DEMO') {
        if (state === 'DEMO') processDemoLogic();

        if (keys.ArrowLeft || keys.KeyA) player.tx -= S.playerSpeed;
        if (keys.ArrowRight || keys.KeyD) player.tx += S.playerSpeed;
        if (state === 'PLAY' && controlMode === 'mobile') {
            if (holdLeft) player.tx -= S.playerSpeed * 2;
            if (holdRight) player.tx += S.playerSpeed * 2;
        }
        player.x += (player.tx - player.x) * 0.2;
        player.x = Math.max(30, Math.min(GW - 30, player.x));
        player.tx = Math.max(30, Math.min(GW - 30, player.tx));

        if (shootCool > 0) shootCool--;
        if (player.invincTick > 0) player.invincTick--;

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= S.bulletSpeed;
            if (bullets[i].y < -15) bullets.splice(i, 1);
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const eb = enemyBullets[i];
            eb.x += eb.vx; eb.y += eb.vy;
            if (eb.y > GH + 20) { enemyBullets.splice(i, 1); continue; }
            if (player.invincTick <= 0 && Math.abs(eb.x - player.x) < 18 && Math.abs(eb.y - player.y) < 20) {
                enemyBullets.splice(i, 1);
                startDeathSequence();
            }
        }

        enemies.forEach(updateEnemy);

        // Player laser vs enemy ship
        outer:
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            for (const en of enemies) {
                if (en.alive && Math.abs(b.x - en.x) < 26 && Math.abs(b.y - en.y) < 24) {
                    bullets.splice(bi, 1);
                    hitEnemy(en);
                    break outer;
                }
            }
        }

        // Diving ship vs player
        if (player.invincTick <= 0 && state === 'PLAY') {
            for (const en of enemies) {
                if (en.alive && Math.abs(en.x - player.x) < 26 && Math.abs(en.y - player.y) < 24) {
                    startDeathSequence();
                    break;
                }
            }
        }
        updateParticles();
    } else if (state === 'DYING') {
        deathFrame++;
        updateParticles();
        if (deathFrame > 60) finishDeath();
    } else {
        enemies.forEach(updateEnemy);
        updateParticles();
    }
}

/* ---------- Drawing ---------- */
function drawPlayer(isDying = false) {
    ctx.save();
    ctx.translate(player.x, player.y);
    if (isDying) {
        const scale = Math.max(0, 1 - deathFrame / 40);
        ctx.scale(scale, scale);
        ctx.rotate(deathFrame * 0.5);
    } else if (player.invincTick > 0 && Math.floor(player.invincTick / 4) % 2 === 0) {
        ctx.globalAlpha = 0.3;
    }
    drawSprite(ctx, SPR.player, 0, 0);
    ctx.restore();
}

function drawEnemies() {
    ctx.fillStyle = '#fff';
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    enemies.forEach(e => {
        if (!e.alive) return;
        drawSprite(ctx, SPR.enemies[e.idx % SPR.enemies.length], e.x, e.y);
        ctx.fillText(answerLabel(e.idx), e.x, e.y + 20);
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, p.r * p.life), 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function render() {
    ctx.fillStyle = C.space;
    ctx.fillRect(0, 0, GW, GH);
    drawCover(ctx, SPR.background, GW, GH);
    ctx.fillStyle = C.stars;
    stars.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.fillRect(s.x, s.y, s.sz, s.sz);
    });
    ctx.globalAlpha = 1;

    if (state === 'DYING') {
        drawEnemies();
        drawPlayer(true);
        drawParticles();
        return;
    }
    drawEnemies();
    if (state === 'PLAY' || state === 'DEMO') {
        ctx.fillStyle = C.laser;
        bullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 9, 4, 13));
        enemyBullets.forEach(b => {
            ctx.fillStyle = b.col;
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
        });
    }
    drawPlayer();
    drawParticles();
    if (state === 'DEMO') drawDemoHighlights();
}

/* ---------- Score card art (SHARE YOUR SCORE) ---------- */
function drawCardArt(g, W, H) {
    g.fillStyle = C.space;
    g.fillRect(0, 0, W, H);
    drawCover(g, SPR.background, W, H);
    g.fillStyle = C.stars;
    for (let i = 0; i < 220; i++) {
        g.globalAlpha = 0.3 + Math.random() * 0.7;
        const sz = Math.random() < 0.15 ? 4 : 2;
        g.fillRect(Math.random() * W, Math.random() * H, sz, sz);
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 4; i++) drawSprite(g, SPR.enemies[i % SPR.enemies.length], W / 2 + (i - 1.5) * 210, 285 + (i % 2) * 34, 130);
    g.fillStyle = C.laser;
    g.fillRect(W / 2 - 6, 372, 12, 46);
    drawSprite(g, SPR.player, W / 2, 492, 150);
}
function cardRows() {
    return [
        [SHT.modeLabel || 'MODE', isHardMode ? T.labels.hard : T.labels.normal],
        [SHT.shipsLabel || 'SHIPS DESTROYED', (runStats.ships || 0).toLocaleString()]
    ];
}

/* ---------- Start up ---------- */
$('start-btn').addEventListener('click', startGame);
$('play-again-btn').addEventListener('click', () => resetGame(true));
$('skip-demo-btn').addEventListener('click', skipDemo);
$('next-demo-btn').addEventListener('click', advanceDemo);
updateUI();
spawnEnemies();
startLoop(update, render);
</script>
