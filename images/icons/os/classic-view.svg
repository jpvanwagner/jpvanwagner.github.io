<!-- Classic View icon: a modern web page in a browser window, with a yellow "switch" badge.
     Pixel-style (32x32 grid, crisp edges) to sit with the other desktop icons. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- window shadow + outline -->
  <rect x="3" y="4" width="28" height="23" fill="#000" opacity=".35"/>
  <rect x="1" y="2" width="28" height="23" fill="#1c2433"/>
  <!-- title bar (the site's navy -> teal) with three dots -->
  <rect x="2" y="3" width="26" height="4" fill="#14286b"/>
  <rect x="15" y="3" width="13" height="4" fill="#0f7c80"/>
  <rect x="3" y="4" width="2" height="2" fill="#ff6b6b"/>
  <rect x="6" y="4" width="2" height="2" fill="#ffd166"/>
  <rect x="9" y="4" width="2" height="2" fill="#06d6a0"/>
  <!-- page -->
  <rect x="2" y="7" width="26" height="17" fill="#ffffff"/>
  <!-- page header strip + nav pills -->
  <rect x="3" y="8" width="24" height="3" fill="#e8ecf5"/>
  <rect x="4" y="9" width="5" height="1" fill="#14286b"/>
  <rect x="17" y="9" width="3" height="1" fill="#8a94a8"/>
  <rect x="21" y="9" width="3" height="1" fill="#8a94a8"/>
  <!-- photo block -->
  <rect x="3" y="12" width="9" height="7" fill="#0f7c80"/>
  <rect x="3" y="16" width="9" height="3" fill="#2a4bb3"/>
  <rect x="9" y="13" width="2" height="2" fill="#ffd166"/>
  <!-- text lines -->
  <rect x="13" y="12" width="13" height="2" fill="#14286b"/>
  <rect x="13" y="15" width="12" height="1" fill="#9aa3b5"/>
  <rect x="13" y="17" width="10" height="1" fill="#9aa3b5"/>
  <!-- magenta button -->
  <rect x="13" y="19" width="7" height="3" fill="#c2185b"/>
  <rect x="14" y="20" width="5" height="1" fill="#ffffff"/>
  <!-- switch badge (two arrows) -->
  <rect x="20" y="20" width="12" height="12" fill="#000"/>
  <rect x="21" y="21" width="10" height="10" fill="#ffd400"/>
  <rect x="23" y="23" width="6" height="1" fill="#000"/>
  <rect x="27" y="22" width="1" height="3" fill="#000"/>
  <rect x="28" y="23" width="1" height="1" fill="#000"/>
  <rect x="23" y="28" width="6" height="1" fill="#000"/>
  <rect x="24" y="27" width="1" height="3" fill="#000"/>
  <rect x="23" y="28" width="1" height="1" fill="#000"/>
</svg>
