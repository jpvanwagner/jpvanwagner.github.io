<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel-art "Network" icon: three computers wired to one hub -->
  <!-- top computer -->
  <rect x="10" y="1" width="12" height="9" fill="#000"/><rect x="11" y="2" width="10" height="7" fill="#c0c0c0"/><rect x="12" y="3" width="8" height="5" fill="#000080"/>
  <rect x="14" y="10" width="4" height="1" fill="#000"/><rect x="12" y="11" width="8" height="1" fill="#808080"/>
  <rect x="13" y="3" width="3" height="1" fill="#00ffff"/>
  <!-- bottom-left computer -->
  <rect x="0" y="19" width="12" height="9" fill="#000"/><rect x="1" y="20" width="10" height="7" fill="#c0c0c0"/><rect x="2" y="21" width="8" height="5" fill="#008080"/>
  <rect x="4" y="28" width="4" height="1" fill="#000"/><rect x="2" y="29" width="8" height="2" fill="#808080"/>
  <rect x="3" y="21" width="3" height="1" fill="#ffffff"/>
  <!-- bottom-right computer -->
  <rect x="20" y="19" width="12" height="9" fill="#000"/><rect x="21" y="20" width="10" height="7" fill="#c0c0c0"/><rect x="22" y="21" width="8" height="5" fill="#800080"/>
  <rect x="24" y="28" width="4" height="1" fill="#000"/><rect x="22" y="29" width="8" height="2" fill="#808080"/>
  <rect x="23" y="21" width="3" height="1" fill="#ff99ff"/>
  <!-- cables to the hub -->
  <rect x="15" y="12" width="2" height="4" fill="#ffcc00"/>
  <rect x="5" y="16" width="22" height="2" fill="#ffcc00"/>
  <rect x="5" y="17" width="2" height="2" fill="#ffcc00"/><rect x="25" y="17" width="2" height="2" fill="#ffcc00"/>
  <!-- hub -->
  <rect x="13" y="15" width="6" height="4" fill="#000"/><rect x="14" y="16" width="4" height="2" fill="#808080"/>
  <rect x="14" y="16" width="1" height="1" fill="#00ff00"/><rect x="16" y="16" width="1" height="1" fill="#00ff00"/>
</svg>
