<!-- "Programs" icon: a yellow folder holding a little program window (like Windows 95's Programs group). 32x32 pixel grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- folder back + tab -->
  <rect x="2" y="7" width="11" height="3" fill="#000"/><rect x="3" y="8" width="9" height="2" fill="#ffe680"/>
  <rect x="1" y="9" width="30" height="20" fill="#000"/>
  <rect x="2" y="10" width="28" height="18" fill="#e8b830"/>
  <!-- program window sticking out -->
  <rect x="9" y="3" width="17" height="15" fill="#000"/>
  <rect x="10" y="4" width="15" height="3" fill="#000080"/>
  <rect x="22" y="5" width="2" height="1" fill="#c0c0c0"/>
  <rect x="10" y="7" width="15" height="10" fill="#c0c0c0"/>
  <rect x="11" y="8" width="13" height="8" fill="#fff"/>
  <rect x="12" y="9" width="6" height="1" fill="#008080"/><rect x="12" y="11" width="9" height="1" fill="#808080"/><rect x="12" y="13" width="7" height="1" fill="#808080"/>
  <!-- folder front flap -->
  <rect x="1" y="15" width="30" height="14" fill="#000"/>
  <rect x="2" y="16" width="28" height="12" fill="#ffd21f"/>
  <rect x="2" y="16" width="28" height="1" fill="#fff3a8"/>
  <rect x="2" y="27" width="28" height="1" fill="#c99700"/>
</svg>
