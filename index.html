    <script>
        /*
         * VIEW MODE GATE: decide retro desktop vs classic site before anything draws.
         *   ?mode=retro    -> remember "retro" and stay here
         *   ?mode=classic  -> remember "classic" and go to the plain site
         *   no preference  -> phones/narrow screens get classic, everyone else retro
         */
        (function () {
            var params = new URLSearchParams(location.search);
            var asked = params.get('mode');
            if (asked === 'retro' || asked === 'classic') SiteMode.set(asked);

            var mode = SiteMode.get();
            if (!mode) mode = window.matchMedia('(max-width: 700px)').matches ? 'classic' : 'retro';

            if (mode === 'classic') {
                var page = (params.get('page') || 'home').replace(/\.html$/i, '') + '.html';   // ?page=about or about.html
                if (!/^[a-z0-9_-]+\.html$/i.test(page)) page = 'home.html';
                location.replace('pages/' + page);
                return;
            }
            document.title = SiteConfig.ownerName + ' | ' + SiteConfig.osName;
        })();
    </script>
