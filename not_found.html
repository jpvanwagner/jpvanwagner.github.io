<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <!-- Neocities shows this page for any missing URL, so paths start with "/" -->
    <link rel="icon" href="/images/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/images/icons/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/pages/css/classic.css">
    <link rel="stylesheet" href="/pages/css/modern.css">
</head>
<body>
    <main style="max-width:520px; margin-top:12vh;">
        <section class="panel">
            <div class="panel-body" style="display:flex; gap:18px; align-items:flex-start;">
                <img src="/images/icons/default/error.png" alt="" style="width:48px; height:48px; image-rendering:pixelated; flex-shrink:0;">
                <div>
                    <h1 style="font-size:22px;">Page not found</h1>
                    <p>The page you're looking for doesn't exist or has moved.</p>
                    <div class="btn-row">
                        <a class="btn primary" href="/">Go to the home page</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
