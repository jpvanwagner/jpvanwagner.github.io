/* ────────────────────────────────────────────────────────────────────────────
   8. FORMAT EDITOR (the "Code Structure" panel in the builder)
   Edits the shared format object. Every change re-renders the preview, the
   Reference tab, and the format flags on existing courses.
   ──────────────────────────────────────────────────────────────────────────── */
function FormatEditor({ format, setFormat, vals }) {
  const [dragId, setDragId] = useState(null);       // segment being dragged
  const [overId, setOverId] = useState(null);       // segment currently under the pointer
  const [customSep, setCustomSep] = useState({});   // segments whose "joined by" shows the custom text box

  /** Merge a change into one segment's settings. */
  const updSeg = (id, patch) =>
    setFormat(f => ({ ...f, segs: { ...f.segs, [id]: { ...f.segs[id], ...patch } } }));

  /** Move a segment to a new position. Removing it first, then inserting at the
      target index, means dragging downward lands after the target and dragging
      upward lands before it; what people expect from a drag-to-reorder list. */
  const moveTo = (id, idx) => setFormat(f => {
    const order = f.order.filter(x => x !== id);
    order.splice(Math.max(0, Math.min(order.length, idx)), 0, id);
    return { ...f, order };
  });

  /** "Set every separator to" shortcut. */
  const setAllSeps = sep => {
    setCustomSep({});
    setFormat(f => ({ ...f, segs: Object.fromEntries(SEGMENT_IDS.map(id => [id, { ...f.segs[id], sep }])) }));
  };

  // The first switched-on segment never shows a separator in front of it.
  const firstOn = format.order.find(id => format.segs[id].on);
  // Stop the last remaining segment from being switched off (a code needs at least one).
  const onCount = format.order.filter(id => format.segs[id].on).length;

  return (
    <div className="fmt-grid">
      {/* Left: the ordered segment list with a "joined by" row between segments */}
      <div>
        <div className="field-label">Segments <span className="opt">(drag or use arrows to reorder, tick to include)</span></div>
        <div className="seg-list">
          {format.order.map((id, i) => {
            const s = format.segs[id], def = SEGMENTS[id];
            const showSep = s.on && id !== firstOn;
            // Show the custom text box if the user chose "Custom…" or the saved separator isn't a preset.
            const isCustom = customSep[id] || !SEPARATORS.some(p => p.value === s.sep);
            // Is this separator dropped from the final code by the current sepMode?
            const omitted = s.sep !== "" && (format.sepMode === "omit" || (format.sepMode === "custom" && !s.keep));
            const val = vals[id];
            return (
              <React.Fragment key={id}>
                {showSep && (
                  <div className={`sep-row${omitted ? " omitted" : ""}`}>
                    <span className="sep-lbl">joined by</span>
                    <div className="select-wrap sm">
                      <select className="glass-select sm" aria-label={`Separator before ${def.label}`}
                        value={isCustom ? CUSTOM : s.sep}
                        onChange={e => {
                          const v = e.target.value;
                          setCustomSep(c => ({ ...c, [id]: v === CUSTOM }));
                          if (v !== CUSTOM) updSeg(id, { sep: v });
                        }}>
                        {SEPARATORS.map(p => <option key={p.label} value={p.value}>{p.label}</option>)}
                        <option value={CUSTOM}>Custom…</option>
                      </select>
                    </div>
                    {isCustom && (
                      // Letters and digits aren't allowed as separators: they'd blur into the segment values.
                      <input className="glass-input sm sep-custom" maxLength={3} placeholder="e.g. ~"
                        aria-label={`Custom separator before ${def.label}`} value={s.sep}
                        onChange={e => updSeg(id, { sep: e.target.value.replace(/[A-Za-z0-9]/g, "") })} />
                    )}
                    {format.sepMode === "custom" && s.sep !== "" && (
                      <label className="check-label inline">
                        <input type="checkbox" checked={s.keep} onChange={e => updSeg(id, { keep: e.target.checked })} />
                        keep in final code
                      </label>
                    )}
                    {omitted && <span className="sep-note">omitted from final code</span>}
                  </div>
                )}
                {/* The segment row itself: drag handle, include checkbox, name, current value, ↑/↓ */}
                <div
                  className={`seg-row${s.on ? "" : " off"}${dragId === id ? " dragging" : ""}${overId === id && dragId && dragId !== id ? " drop-target" : ""}`}
                  draggable
                  onDragStart={e => { setDragId(id); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id); }}
                  onDragEnter={e => { e.preventDefault(); setOverId(id); }}
                  onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }}
                  onDrop={e => { e.preventDefault(); if (dragId && dragId !== id) moveTo(dragId, format.order.indexOf(id)); setDragId(null); setOverId(null); }}
                  onDragEnd={() => { setDragId(null); setOverId(null); }}
                >
                  <span className="drag-handle" aria-hidden="true">⠿</span>
                  <input type="checkbox" checked={s.on} aria-label={`Include ${def.label} in code`}
                    disabled={s.on && onCount === 1}
                    onChange={e => updSeg(id, { on: e.target.checked })} />
                  <span className="seg-dot" style={{ background: def.color }} />
                  <span className="seg-name">{def.label}</span>
                  <span className={`seg-val${s.on && val ? " has" : ""}`} style={{ "--c": def.color }}>
                    {!s.on ? "excluded" : (val || (def.required ? "required" : "optional"))}
                  </span>
                  {/* Arrow buttons: the keyboard- and touch-friendly alternative to dragging */}
                  <span className="seg-actions">
                    <button type="button" className="icon-btn" disabled={i === 0} aria-label={`Move ${def.label} earlier`}
                      onClick={() => moveTo(id, i - 1)}>↑</button>
                    <button type="button" className="icon-btn" disabled={i === format.order.length - 1} aria-label={`Move ${def.label} later`}
                      onClick={() => moveTo(id, i + 1)}>↓</button>
                  </span>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {/* Right: output options */}
      <div>
        <div className="opt-block">
          <div className="field-label">Separators in final code</div>
          <SegControl label="Separators in final code" value={format.sepMode}
            options={[["keep", "Keep all"], ["omit", "Omit all"], ["custom", "Choose which"]]}
            onChange={v => setFormat(f => ({ ...f, sepMode: v }))} />
          <div className="opt-hint">
            {format.sepMode === "keep" && "Every separator you've set appears in the generated code."}
            {format.sepMode === "omit" && "Segments are joined with no separators at all, e.g. MAN10120417SUPCA."}
            {format.sepMode === "custom" && "Untick “keep in final code” on any separator to the left to drop just that one."}
          </div>
        </div>

        <div className="opt-block">
          <div className="field-label">Spaces in final code</div>
          <SegControl label="Spaces in final code" value={format.spaceMode}
            options={[["keep", "Keep"], ["remove", "Remove"], ["underscore", "Replace with _"]]}
            onChange={v => setFormat(f => ({ ...f, spaceMode: v }))} />
          <div className="opt-hint">Applies to space separators and to any spaces inside custom codes.</div>
        </div>

        <div className="opt-block">
          <div className="field-label">Set every separator to</div>
          <div className="quick-seps">
            {SEPARATORS.map(p => (
              <button key={p.label} type="button" title={p.label} onClick={() => setAllSeps(p.value)}>
                {p.value === " " ? "space" : p.value === "" ? "none" : p.value}
              </button>
            ))}
          </div>
        </div>

        <div className="opt-block">
          <button type="button" className="btn btn-ghost" onClick={() => { setCustomSep({}); setFormat(DEFAULT_FORMAT); }}>
            ↺ Reset to standard format
          </button>
        </div>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────
   9. APP
   ──────────────────────────────────────────────────────────────────────────── */
function App() {
  /* ── State ──────────────────────────────────────────────────────────────── */
  const [theme, setTheme] = useState(() => document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  const [tab, setTab] = useState("builder");             // builder | catalog | reference
  const [format, setFormat] = useState(loadFormat);

  // Builder fields
  const [cType, setCType] = useState("");                // subject dropdown value (or CUSTOM)
  const [customType, setCustomType] = useState("");      // typed subject when cType === CUSTOM
  const [cNum, setCNum] = useState("");
  const [clientSearch, setClientSearch] = useState("");  // text typed into the customer search box
  const [showDrop, setShowDrop] = useState(false);       // customer dropdown open?
  const [selClient, setSelClient] = useState(null);      // chosen customer { name, code }
  const [manualClient, setManualClient] = useState(false);
  const [manualCode, setManualCode] = useState("");
  const [audience, setAudience] = useState("");
  const [customAud, setCustomAud] = useState("");
  const [selState, setSelState] = useState("");
  const [cName, setCName] = useState("");
  const [recodeId, setRecodeId] = useState(null);        // id of the catalog course open for re-coding

  // Catalog
  const [courses, setCourses] = useState(loadCourses);
  const [catSearch, setCatSearch] = useState("");
  const [sort, setSort] = useState({ key: "code", dir: 1 });
  const [renameId, setRenameId] = useState(null);        // row showing the inline rename box
  const [renameVal, setRenameVal] = useState("");
  const [renameErr, setRenameErr] = useState("");
  const [onlyFlagged, setOnlyFlagged] = useState(false);
  const [importPreview, setImportPreview] = useState(null);

  // Feedback
  const [copiedId, setCopiedId] = useState(null);        // which copy button shows "✓ Copied"
  const [toast, setToast] = useState(null);              // { kind, text } message, bottom-right

  const dropRef = useRef(null);
  const restoreRef = useRef(null);
  const csvRef = useRef(null);
  const toastTimer = useRef(null);
  const copyTimer = useRef(null);

  /* ── Effects ────────────────────────────────────────────────────────────── */
  // Persist courses and format whenever they change.
  useEffect(() => { saveCourses(courses); }, [courses]);
  useEffect(() => { saveFormat(format); }, [format]);

  // Apply and remember the theme. "theme-switching" disables CSS transitions
  // for a moment so the whole page swaps colours at once.
  useEffect(() => {
    const root = document.documentElement;
    root.classList.add("theme-switching");
    root.dataset.theme = theme;
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
    const t = setTimeout(() => root.classList.remove("theme-switching"), 50);
    return () => clearTimeout(t);
  }, [theme]);

  // Close the customer dropdown when clicking anywhere outside it.
  useEffect(() => {
    const fn = (e) => { if (dropRef.current && !dropRef.current.contains(e.target)) setShowDrop(false); };
    document.addEventListener("mousedown", fn);
    return () => document.removeEventListener("mousedown", fn);
  }, []);

  /** Show a toast. Successes disappear after 4 s; warnings and errors stay 10 s. */
  const flash = (kind, text) => {
    clearTimeout(toastTimer.current);
    setToast({ kind, text });
    toastTimer.current = setTimeout(() => setToast(null), kind === "ok" ? 4000 : 10000);
  };

  /** Copy text and briefly show "✓ Copied" on the button identified by `id`. */
  const doCopy = (text, id) => {
    copyText(text);
    clearTimeout(copyTimer.current);
    setCopiedId(id);
    copyTimer.current = setTimeout(() => setCopiedId(null), 2200);
  };

  /* ── Derived builder values (recomputed every render) ───────────────────── */
  const filteredClients = CLIENTS.filter(c =>
    c.name.toLowerCase().includes(clientSearch.toLowerCase()) || c.code.includes(clientSearch)
  );

  const typeCode   = cType === CUSTOM ? customType.trim() : cType;
  const audCode    = audience === CUSTOM ? customAud.trim() : audience;
  const numValid   = /^\d{1,3}$/.test(cNum) && parseInt(cNum, 10) > 0;
  const clientCode = manualClient ? manualCode : (selClient?.code || "");

  // The current value of every segment, as buildCode expects them.
  const vals = {
    type: typeCode,
    number: numValid ? padNum(cNum) : "",
    client: clientCode,
    audience: audCode,
    location: selState,
  };

  // While re-coding, duplicate checks must ignore the course being edited.
  const recoding = courses.find(c => c.id === recodeId) || null;
  const exceptId = recoding?.id;

  const build = buildCode(vals, format);
  const fullCode = build.code;
  const name = cleanName(cName);
  const fullLabel = fullCode && name ? `${fullCode}: ${name}` : "";   // "CODE: Name", as shown in the LMS
  const levelInfo = numValid ? getLevelInfo(cNum) : null;

  const codeConflict = fullCode ? findCodeConflict(courses, fullCode, build.used, exceptId, format) : null;
  const nameConflict = findNameConflict(courses, name, exceptId);
  const canSubmit = !!fullCode && !!name && !codeConflict && !nameConflict;

  /** Clear every builder field. */
  const resetBuilder = () => {
    setCType(""); setCustomType(""); setCNum("");
    setClientSearch(""); setSelClient(null); setManualClient(false); setManualCode("");
    setAudience(""); setCustomAud(""); setSelState(""); setCName("");
  };

  /** The course fields that come from the builder (shared by Add and Save). */
  const entryFields = () => ({
    parts: build.used,
    type: typeCode,
    number: numValid ? parseInt(cNum, 10) : null,
    client: manualClient ? clientNameFor(manualCode) : (selClient?.name || ""),
    clientCode,
    audience: audCode,
    location: selState,
  });

  /** "Add to Catalog" (or "Save changes" while re-coding). */
  const handleSubmit = () => {
    if (!fullCode || !name) return;
    // Re-check against the latest list (Enter can submit even while the button
    // is disabled): a duplicate code or name is never created.
    if (findCodeConflict(courses, fullCode, build.used, exceptId, format) || findNameConflict(courses, name, exceptId)) {
      flash("err", `Not ${recoding ? "saved" : "added"}: that course code or course name is already in use.`);
      return;
    }
    if (recoding) return saveRecode();
    const entry = { id: makeId(), code: fullCode, name, ...entryFields(), createdAt: new Date().toISOString() };
    setCourses(prev => sortByCode([...prev, entry]));
    flash("ok", `Added ${fullCode}: ${name}`);
    setCName("");   // keep the segments, so a series of related courses is quick to enter
  };

  /* ── Re-code: load a catalog course into the builder, then save over it ── */
  const startRecode = (c) => {
    const v = courseValues(c);
    // Pick the matching dropdown option, or switch to "custom" for unknown codes.
    const pick = (list, code, setSel, setCustom) => {
      if (!code) { setSel(""); setCustom(""); }
      else if (list.some(x => x.code === code)) { setSel(code); setCustom(""); }
      else { setSel(CUSTOM); setCustom(code); }
    };
    pick(COURSE_TYPES, v.type, setCType, setCustomType);
    pick(AUDIENCES, v.audience, setAudience, setCustomAud);
    setCNum(v.number || "");
    // Restore the customer from the list if we can tell which one it was; otherwise enter the code manually.
    const known = v.client && CLIENTS.find(x => x.code === v.client && (x.name === c.client || clientNameFor(v.client) === x.name));
    setClientSearch(""); setShowDrop(false);
    if (known) { setManualClient(false); setSelClient(known); setManualCode(""); }
    else if (v.client) { setManualClient(true); setSelClient(null); setManualCode(v.client); }
    else { setManualClient(false); setSelClient(null); setManualCode(""); }
    setSelState(STATE_CODES.has(v.location) ? v.location : "");
    setCName(c.name);
    setRenameId(null);
    setRecodeId(c.id);
    setTab("builder");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  const cancelRecode = () => { setRecodeId(null); resetBuilder(); };

  /** Save the builder's values over the course being re-coded. The old code is
      appended to `previousCodes` so the LMS record can still be traced. */
  const saveRecode = () => {
    const orig = recoding;
    const codeChanged = orig.code !== fullCode;
    if (!codeChanged && orig.name === name && partsKey(orig.parts) === partsKey(build.used)) {
      flash("info", "No changes to save.");
      return;
    }
    if (codeChanged && !window.confirm(`Change ${orig.code} to ${fullCode}?\n\nThe old code stays in the course's history. Remember to update it in the LMS too.`)) return;
    const { ackFor, freeform, ...rest } = orig;   // re-coding clears any "Mark OK" and freeform state
    const updated = {
      ...rest, ...entryFields(), code: fullCode, name,
      previousCodes: codeChanged ? [...(orig.previousCodes || []), orig.code] : orig.previousCodes,
      updatedAt: new Date().toISOString(),
    };
    setCourses(p => sortByCode(p.map(c => c.id === orig.id ? updated : c)));
    flash("ok", codeChanged ? `Re-coded ${orig.code} → ${fullCode}` : `Saved ${fullCode}: ${name}`);
    cancelRecode();
    setTab("catalog");
  };

  /* ── Format flags on existing courses ───────────────────────────────────── */
  const statuses = Object.fromEntries(courses.map(c => [c.id, formatStatus(c, format)]));
  const flaggedIds = courses.filter(c => statuses[c.id].state === "flagged").map(c => c.id);
  const flaggedFilter = onlyFlagged && flaggedIds.length > 0;   // "Show only flagged" turns itself off once nothing is flagged

  /** Mark OK: remember the outcome the course is OK with (see formatStatus). */
  const markOk = (ids) => setCourses(p => p.map(c => ids.includes(c.id) ? { ...c, ackFor: formatStatus(c, format).target } : c));
  /** Undo Mark OK. */
  const reflag = (id) => setCourses(p => p.map(c => {
    if (c.id !== id) return c;
    const { ackFor, ...rest } = c;
    return rest;
  }));

  /**
   * Rebuild the given courses' codes in the current format.
   * It runs in passes: if course A's new code is currently held by course B,
   * and B is also being regenerated, A succeeds on a later pass once B has
   * moved. Whatever still can't move (a real clash, or a missing segment) is
   * left flagged and reported.
   */
  const regenerate = (ids) => {
    let next = courses.slice();
    const pending = new Set(ids);
    const now = new Date().toISOString();
    let done = 0, progress = true;
    while (progress) {
      progress = false;
      for (const id of [...pending]) {
        const c = next.find(x => x.id === id);
        const st = c && formatStatus(c, format);
        if (!c || st.state === "ok") { pending.delete(id); continue; }
        if (!st.expected || findCodeConflict(next, st.expected, null, id, format)) continue;
        next = next.map(x => {
          if (x.id !== id) return x;
          const { ackFor, ...rest } = x;
          return {
            ...rest, code: st.expected, parts: st.used,
            location: isRegionCode(x.location) ? "" : x.location,
            previousCodes: [...(x.previousCodes || []), x.code], updatedAt: now,
          };
        });
        pending.delete(id); done++; progress = true;
      }
    }
    // Explain each course that couldn't be regenerated.
    const blocked = [...pending].map(id => {
      const c = next.find(x => x.id === id), st = formatStatus(c, format);
      if (c.freeform) return `${c.code} (no segments; use Re-code)`;
      if (!st.expected) return `${c.code} (missing ${st.missing.map(m => SEGMENTS[m].label).join(", ")})`;
      const clash = findCodeConflict(next, st.expected, null, id, format);
      return normCode(clash.code) === normCode(st.expected)
        ? `${c.code} (${st.expected} is already used by ${clash.code})`
        : `${c.code} (${clash.code} would also become ${st.expected})`;
    });
    setCourses(sortByCode(next));
    if (blocked.length) flash("warn", `Regenerated ${plural(done, "code", "codes")}. Not changed: ${blocked.join("; ")}.`);
    else flash("ok", `Regenerated ${plural(done, "code", "codes")} in the current format.`);
  };

  const regenOne = (c) => {
    const st = statuses[c.id];
    if (!window.confirm(`Change ${c.code} to ${st.expected}?\n\nThe old code stays in the course's history. Remember to update it in the LMS too.`)) return;
    regenerate([c.id]);
  };
  const regenAll = () => {
    if (!window.confirm(`Regenerate ${plural(flaggedIds.length, "flagged code", "flagged codes")} in the current format?\n\nOld codes stay in each course's history. Remember to update them in the LMS too.`)) return;
    regenerate(flaggedIds);
  };

  /* ── Catalog row actions ────────────────────────────────────────────────── */
  const doDelete = (c) => {
    if (!window.confirm(`Remove ${c.code}: ${c.name} from the catalog?`)) return;
    setCourses(p => p.filter(x => x.id !== c.id));
    if (c.id === recodeId) cancelRecode();
  };

  const startRename = (c) => { setRenameId(c.id); setRenameVal(c.name); setRenameErr(""); };
  /** Save an inline rename, refusing empty or duplicate names. */
  const saveRename = (id) => {
    const n = cleanName(renameVal);
    if (!n) { setRenameErr("Course name can't be empty."); return; }
    const dup = findNameConflict(courses, n, id);
    if (dup) { setRenameErr(`The name “${dup.name}” is already in use by ${dup.code}. Course names must be unique.`); return; }
    setCourses(p => p.map(c => c.id === id ? { ...c, name: n, updatedAt: new Date().toISOString() } : c));
    if (id === recodeId) setCName(n);   // keep the builder in sync if that course is open there
    setRenameId(null);
  };

  /* ── Import / export ────────────────────────────────────────────────────── */
  /** Spreadsheet-friendly export, including each course's format status and code history. */
  const exportCsv = () => {
    const head = ["Course Code", "Course Name", "Subject", "Number", "Level", "Customer", "Customer Code", "Audience", "State",
      "Format Status", "Code in Current Format", "Previous Codes", "Created"];
    const statusText = { ok: "Matches", flagged: "Flagged", acked: "Kept as-is" };
    const rows = sortByCode(courses).map(c => [
      c.code, c.name, c.type, c.number ? String(c.number).padStart(3, "0") : "",
      getLevelInfo(c.number)?.label || "", c.client, c.clientCode, c.audience, c.location,
      statusText[statuses[c.id].state], statuses[c.id].expected, (c.previousCodes || []).join(" > "), c.createdAt,
    ]);
    downloadFile(`course-catalog-${new Date().toISOString().slice(0, 10)}.csv`, toCsv([head, ...rows]), "text/csv;charset=utf-8");
  };

  const downloadTemplate = () => {
    downloadFile("course-import-template.csv", toCsv([TEMPLATE_HEAD, ...TEMPLATE_ROWS]), "text/csv;charset=utf-8");
    flash("info", "Template downloaded. One course per row: a Course Name plus either a Course Code or its segments " +
      "(Subject, Number and Audience; Customer Code and State are optional). Rows starting with “(Example)” are ignored.");
  };

  /** Read an uploaded CSV and open the import preview (nothing is added yet). */
  const readCsv = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const table = parseCsv(String(reader.result));
      const result = analyzeImport(table, courses, format);
      if (result.error) { flash("err", result.error); return; }
      if (!result.rows.length) { flash("warn", "No course rows found in that file."); return; }
      setImportPreview({ fileName: file.name, table, rows: result.rows });
    };
    reader.readAsText(file);
  };

  /** "Import N courses": re-check against the catalog as it is now, then add the ready rows. */
  const confirmImport = () => {
    const { rows = [] } = analyzeImport(importPreview.table, courses, format);
    const add = rows.filter(r => r.status === "ready").map(({ entry: { flagged, ...e } }) => e);
    const skipped = rows.filter(r => r.status === "error").length;
    setCourses(p => sortByCode([...p, ...add]));
    setImportPreview(null);
    flash(skipped ? "warn" : "ok",
      `Imported ${plural(add.length, "course", "courses")}` + (skipped ? `; skipped ${plural(skipped, "row", "rows")} with problems.` : "."));
  };

  /** Full backup (format + courses) as JSON, for moving between browsers. */
  const exportJson = () => {
    const data = { app: "lms-course-catalog", version: 1, exportedAt: new Date().toISOString(), format, courses };
    downloadFile(`course-catalog-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), "application/json");
  };

  /** Restore a JSON backup. Merges into the catalog and skips anything that
      would duplicate an existing code or name. */
  const importJson = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : data?.courses;
        if (!Array.isArray(list)) throw new Error("bad file");
        const next = [...courses];
        let added = 0, skipped = 0;
        list.forEach(raw => {
          const ok = raw && typeof raw.code === "string" && typeof raw.name === "string" && raw.code.trim() && cleanName(raw.name);
          if (!ok || findCodeConflict(next, raw.code, raw.parts, undefined, format) || findNameConflict(next, raw.name)) { skipped++; return; }
          next.push({ ...raw, id: makeId(), code: raw.code.trim(), name: cleanName(raw.name) });
          added++;
        });
        setCourses(sortByCode(next));
        flash(skipped ? "warn" : "ok",
          `Restored ${plural(added, "course", "courses")}` +
          (skipped ? `; skipped ${skipped} duplicate or invalid entr${skipped !== 1 ? "ies" : "y"}.` : "."));
      } catch {
        flash("err", "That file isn't a valid catalog backup.");
      }
    };
    reader.readAsText(file);
  };

  /* ── Catalog view: filter by search / flags, then sort ──────────────────── */
  const q = catSearch.trim().toLowerCase();
  const shown = courses
    .filter(c => !flaggedFilter || statuses[c.id].state === "flagged")
    .filter(c => !q || [c.code, c.name, c.client, c.clientCode, c.type, c.audience, c.location, (c.previousCodes || []).join(" ")]
      .some(v => String(v || "").toLowerCase().includes(q)))
    .sort((a, b) => {
      const av = String(a[sort.key] ?? ""), bv = String(b[sort.key] ?? "");
      return av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" }) * sort.dir;
    });

  /** A sortable column header: click once for ascending, again for descending. */
  const sortTh = (k, children) => (
    <th aria-sort={sort.key === k ? (sort.dir === 1 ? "ascending" : "descending") : "none"}>
      <button className={`th-sort${sort.key === k ? " on" : ""}`}
        onClick={() => setSort(s => ({ key: k, dir: s.key === k ? -s.dir : 1 }))}>
        {children} {sort.key === k ? (sort.dir === 1 ? "↑" : "↓") : ""}
      </button>
    </th>
  );

  // Small render helpers
  const dash = <span className="dash">–</span>;
  const segLabel = (id) => (
    <>
      <span className="seg-dot" style={{ background: SEGMENTS[id].color }} />
      {SEGMENTS[id].label}
    </>
  );
  const fieldClass = id => `field${format.segs[id].on ? "" : " excluded"}`;
  const excludedNote = id => !format.segs[id].on && <span className="opt">(excluded from code)</span>;

  // Reference tab: the current format drawn as a pattern, e.g. [SUBJ][NUM]-[CUST]-[AUD]-[STATE]
  const pattern = buildCode(Object.fromEntries(SEGMENT_IDS.map(id => [id, `[${SEGMENTS[id].short}]`])), format);

  // Counts for the import preview summary line
  const importCounts = importPreview && {
    ready: importPreview.rows.filter(r => r.status === "ready").length,
    flagged: importPreview.rows.filter(r => r.status === "ready" && r.entry.flagged).length,
    error: importPreview.rows.filter(r => r.status === "error").length,
    example: importPreview.rows.filter(r => r.status === "example").length,
  };

  /* ── Render ─────────────────────────────────────────────────────────────── */
  return (
    <div className="lms-root">

      {/* ═══ Header ═══ */}
      <div className="lms-header">
        <div className="lms-header-left">
          <div className="lms-title">LMS Course Catalog</div>
          <div className="lms-subtitle">Learning Management System · Course Code Registry</div>
        </div>
        <div className="lms-header-right">
          <div className="lms-counter">{plural(courses.length, "course", "courses")} registered</div>
          <button className="theme-toggle" aria-label={`Switch to ${theme === "light" ? "dark" : "light"} mode`}
            onClick={() => setTheme(t => t === "light" ? "dark" : "light")}>
            {theme === "light" ? "☾  Dark mode" : "☀  Light mode"}
          </button>
        </div>
      </div>

      {/* ═══ Tabs (the Catalog tab shows a ⚑ count when courses are flagged) ═══ */}
      <div className="lms-tabs" role="tablist">
        {[
          { id: "builder",   label: recoding ? "✎  Re-coding" : "✦  Course Builder" },
          { id: "catalog",   label: `≡  Catalog (${courses.length})${flaggedIds.length ? `  ⚑ ${flaggedIds.length}` : ""}` },
          { id: "reference", label: "◈  Reference" },
        ].map(t => (
          <button key={t.id} role="tab" aria-selected={tab === t.id}
            className={`lms-tab${tab === t.id ? " active" : ""}`} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      <div className="lms-body">

        {/* ═══════════════════════════ BUILDER TAB ═══════════════════════════ */}
        {tab === "builder" && (
          <div className="lms-panel">
            {recoding && (
              <div className="edit-banner">
                <div>
                  ✎ Re-coding <span className="mono">{recoding.code}</span>: {recoding.name}
                  <div className="sub">Change any segment or the name, then save. The old code is kept in the course's history.</div>
                </div>
                <button className="btn btn-sm" onClick={cancelRecode}>Cancel re-coding</button>
              </div>
            )}

            <div className="builder-grid">

              {/* ── Left column: subject, number, audience ── */}
              <div>
                <div className="section-head">Course Identity</div>

                <div className={fieldClass("type")}>
                  <div className="field-label">{segLabel("type")} <span className="req">*</span> {excludedNote("type")}</div>
                  <div className="stack">
                    <div className="select-wrap">
                      <select className="glass-select" value={cType} onChange={e => setCType(e.target.value)}>
                        <option value="">Select a subject...</option>
                        {COURSE_TYPES.map(t => <option key={t.code} value={t.code}>{t.code}: {t.label}</option>)}
                        <option value={CUSTOM}>✎ Other / custom code…</option>
                      </select>
                    </div>
                    {cType === CUSTOM && (
                      <input type="text" className="glass-input mono" placeholder="Subject code"
                        value={customType} maxLength={10}
                        onChange={e => setCustomType(sanitizeCode(e.target.value))} />
                    )}
                  </div>
                </div>

                <div className={fieldClass("number")}>
                  <div className="field-label">{segLabel("number")} <span className="req">*</span> {excludedNote("number")}</div>
                  {/* A text input (not type="number") so leading zeros like 099 survive; digits only, max 3. */}
                  <input type="text" inputMode="numeric" maxLength={3} className="glass-input mono"
                    placeholder="e.g. 101, 099, 501…" value={cNum}
                    onChange={e => setCNum(e.target.value.replace(/\D/g, "").slice(0, 3))}
                    onBlur={() => { if (numValid) setCNum(padNum(cNum)); }} />
                  {levelInfo && (
                    <div className="level-badge" style={{ "--c": levelInfo.color }}>
                      <span className="level-dot" />
                      {levelInfo.label}
                    </div>
                  )}
                  {cNum && !numValid && <div className="field-hint bad">Course numbers run from 001 to 999.</div>}
                </div>

                <div className={fieldClass("audience")}>
                  <div className="field-label">{segLabel("audience")} <span className="req">*</span> {excludedNote("audience")}</div>
                  <div className="stack">
                    <div className="select-wrap">
                      <select className="glass-select" value={audience} onChange={e => setAudience(e.target.value)}>
                        <option value="">Select an audience...</option>
                        {AUDIENCES.map(a => <option key={a.code} value={a.code}>{a.code}: {a.label}</option>)}
                        <option value={CUSTOM}>✎ Other / custom code…</option>
                      </select>
                    </div>
                    {audience === CUSTOM && (
                      <input type="text" className="glass-input mono" placeholder="Audience code"
                        value={customAud} maxLength={10}
                        onChange={e => setCustomAud(sanitizeCode(e.target.value))} />
                    )}
                  </div>
                </div>
              </div>

              {/* ── Right column: customer and state ── */}
              <div>
                <div className="section-head">Customer & State</div>

                <div className={fieldClass("client")}>
                  <div className="field-label">{segLabel("client")} <span className="opt">(optional)</span> {excludedNote("client")}</div>
                  {!manualClient ? (
                    // Searchable customer picker: type a name or code, pick from the list.
                    <div className="client-wrap" ref={dropRef}>
                      <div className="input-row">
                        <input type="text" className="glass-input"
                          placeholder="Search customer or code…"
                          value={selClient ? `${selClient.name}: ${selClient.code}` : clientSearch}
                          onChange={e => { setClientSearch(e.target.value); setSelClient(null); setShowDrop(true); }}
                          onFocus={() => { setShowDrop(true); if (selClient) setClientSearch(""); }}
                          onKeyDown={e => { if (e.key === "Escape") setShowDrop(false); }}
                          readOnly={!!selClient}
                        />
                        {selClient && (
                          <button className="btn-clear" aria-label="Clear customer"
                            onClick={() => { setSelClient(null); setClientSearch(""); }}>×</button>
                        )}
                      </div>
                      {showDrop && !selClient && (
                        <div className="client-dropdown">
                          <div className="client-item none-item"
                            onClick={() => { setSelClient(null); setClientSearch(""); setShowDrop(false); }}>
                            No customer (left out of the code)
                          </div>
                          {filteredClients.map((c, i) => (
                            <div key={i} className="client-item"
                              onClick={() => { setSelClient(c); setShowDrop(false); setClientSearch(""); }}>
                              <span>{c.name}</span>
                              <span className="ccode">{c.code}</span>
                            </div>
                          ))}
                          {filteredClients.length === 0 && <div className="client-item empty-item">No results</div>}
                        </div>
                      )}
                    </div>
                  ) : (
                    // Manual entry for customers not in the list: digits only, any length up to 10.
                    <input type="text" inputMode="numeric" className="glass-input mono" placeholder="Customer code, e.g. 20417"
                      value={manualCode} maxLength={10}
                      onChange={e => setManualCode(e.target.value.replace(/\D/g, "").slice(0, 10))} />
                  )}
                  <label className="check-label">
                    <input type="checkbox" checked={manualClient}
                      onChange={e => { setManualClient(e.target.checked); setSelClient(null); setManualCode(""); setClientSearch(""); }} />
                    Enter customer code manually
                  </label>
                </div>

                <div className={fieldClass("location")}>
                  <div className="field-label">{segLabel("location")} <span className="opt">(optional)</span> {excludedNote("location")}</div>
                  <div className="select-wrap">
                    <select className="glass-select" value={selState} onChange={e => setSelState(e.target.value)}>
                      <option value="">No specific state</option>
                      {STATES.map(s => <option key={s.code} value={s.code}>{s.name} ({s.code})</option>)}
                    </select>
                  </div>
                </div>
              </div>

              {/* ── Full width: Code Structure editor ── */}
              <div className="col-full">
                <div className="divider" style={{ marginTop: 0 }} />
                <div className="section-head">Code Structure</div>
                <FormatEditor format={format} setFormat={setFormat} vals={vals} />
                {flaggedIds.length > 0 && (
                  <div className="alert alert-warn">
                    <span>⚑</span>
                    <span>
                      {plural(flaggedIds.length, "existing course doesn't", "existing courses don't")} match this format.{" "}
                      <button className="btn-inline" onClick={() => { setOnlyFlagged(true); setTab("catalog"); }}>Review in Catalog →</button>
                    </span>
                  </div>
                )}
              </div>

              {/* ── Full width: course name, preview, messages, submit ── */}
              <div className="col-full">
                <div className="divider" style={{ marginTop: 0 }} />
                <div className="section-head">Course Name & Generated Code</div>

                <div className="field">
                  <div className="field-label">Course Name <span className="req">*</span> <span className="opt">(the title shown in the catalog; must be unique)</span></div>
                  <input type="text" className="glass-input" placeholder="e.g. Supervisor Essentials"
                    value={cName} maxLength={200} onChange={e => setCName(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") handleSubmit(); }} />
                </div>

                <div className="field-label" style={{ marginBottom: "8px" }}>Generated Course Code</div>
                <div className="code-preview">
                  {build.slots.length
                    ? <CodeStrip slots={build.slots} />
                    : <span className="code-placeholder">Complete the fields above to generate a code…</span>}
                  {fullCode && (
                    <button className={`btn btn-copy${copiedId === "code" ? " copied" : ""}`}
                      onClick={() => doCopy(fullCode, "code")}>
                      {copiedId === "code" ? "✓ Copied" : "⧉ Copy code"}
                    </button>
                  )}
                </div>
                <div className="code-final-row">
                  <span className="code-final-lbl">Catalog label</span>
                  <span className={`code-final${fullLabel ? "" : " dim"}`}>
                    {fullLabel || (fullCode ? `${fullCode}: (enter a course name)` : "–")}
                  </span>
                  {fullLabel && (
                    <button className={`btn btn-copy${copiedId === "label" ? " copied" : ""}`}
                      onClick={() => doCopy(fullLabel, "label")}>
                      {copiedId === "label" ? "✓ Copied" : "⧉ Copy label"}
                    </button>
                  )}
                </div>

                {/* Status messages, most informative first */}
                {recoding && fullCode && fullCode !== recoding.code && (
                  <div className="alert alert-info">
                    <span>ⓘ</span>
                    <span>Saving changes this course's code from <span className="mono">{recoding.code}</span> to <span className="mono">{fullCode}</span>.</span>
                  </div>
                )}
                {build.missing.length > 0 && (build.slots.length > build.missing.length || cName) && (
                  <div className="alert alert-info">
                    <span>ⓘ</span>
                    <span>Still needed: {build.missing.map(id => SEGMENTS[id].label).join(", ")}.</span>
                  </div>
                )}
                {codeConflict && (
                  <div className="alert alert-err" role="alert">
                    <span>⚠</span>
                    <span>
                      {/* A different explanation for each kind of conflict (see codeConflictReason) */}
                      {{
                        same: <>Course code <span className="mono">{fullCode}</span> is already in use
                          {codeConflict.code !== fullCode && <> (as <span className="mono">{codeConflict.code}</span>, which differs only in separators or capitals)</>}
                          {" "}by “{codeConflict.name}”.</>,
                        reordered: <>Course code <span className="mono">{fullCode}</span> uses the same segments as <span className="mono">{codeConflict.code}</span> (“{codeConflict.name}”) in a different order.</>,
                        pending: <>Course code <span className="mono">{fullCode}</span> is reserved: “{codeConflict.name}” (<span className="mono">{codeConflict.code}</span>) is flagged
                          and would become this code if regenerated in the current format. Mark that course OK in the Catalog to free the code.</>,
                      }[codeConflictReason(codeConflict, fullCode, build.used, format)]}
                      {" "}Change a segment, such as the course number, to create a new code.
                    </span>
                  </div>
                )}
                {nameConflict && (
                  <div className="alert alert-err" role="alert">
                    <span>⚠</span>
                    <span>
                      The course name “{nameConflict.name}” is already in use by <span className="mono">{nameConflict.code}</span>. Course names must be unique.
                    </span>
                  </div>
                )}

                <button className="btn btn-add" disabled={!canSubmit} onClick={handleSubmit}>
                  {recoding ? "✓ Save changes" : "+ Add to Catalog"}
                </button>
              </div>

            </div>
          </div>
        )}

        {/* ═══════════════════════════ CATALOG TAB ═══════════════════════════ */}
        {tab === "catalog" && (
          <div className="lms-panel">
            {/* Toolbar: search · CSV import/template/export · JSON backup/restore */}
            <div className="cat-toolbar">
              <input type="search" className="glass-input"
                placeholder="Search code, name, customer, audience…" aria-label="Search catalog"
                value={catSearch} onChange={e => setCatSearch(e.target.value)} />
              <div className="tool-group">
                <button className="btn btn-ghost" onClick={() => csvRef.current?.click()}>⤒ Import CSV</button>
                <button className="btn btn-ghost" onClick={downloadTemplate}>⤓ CSV template</button>
                <button className="btn btn-ghost" onClick={exportCsv} disabled={!courses.length}>⤓ Export CSV</button>
              </div>
              <span className="tool-sep" aria-hidden="true" />
              <div className="tool-group">
                <button className="btn btn-ghost" onClick={exportJson} disabled={!courses.length}>⤓ Backup</button>
                <button className="btn btn-ghost" onClick={() => restoreRef.current?.click()}>⤒ Restore</button>
              </div>
              {/* Hidden file pickers opened by the buttons above. Resetting value lets the same file be chosen twice. */}
              <input ref={csvRef} type="file" accept=".csv,text/csv" hidden
                onChange={e => { readCsv(e.target.files[0]); e.target.value = ""; }} />
              <input ref={restoreRef} type="file" accept="application/json,.json" hidden
                onChange={e => { importJson(e.target.files[0]); e.target.value = ""; }} />
              <span className="cat-count">{shown.length} of {plural(courses.length, "course", "courses")}</span>
            </div>

            {/* CSV import preview: one row per CSV line with its outcome */}
            {importPreview && (
              <div className="import-panel">
                <div className="import-head">
                  <div>
                    <div className="import-title">Import preview: {importPreview.fileName}</div>
                    <div className="import-sub">
                      {plural(importCounts.ready, "course", "courses")} ready to import
                      {importCounts.flagged > 0 && <> ({importCounts.flagged} will be flagged)</>}
                      {importCounts.error > 0 && <> · {plural(importCounts.error, "row", "rows")} with problems will be skipped</>}
                      {importCounts.example > 0 && <> · {plural(importCounts.example, "example row", "example rows")} ignored</>}
                    </div>
                  </div>
                  <div className="flag-actions">
                    <button className="btn btn-sm primary" disabled={!importCounts.ready} onClick={confirmImport}>
                      Import {plural(importCounts.ready, "course", "courses")}
                    </button>
                    <button className="btn btn-sm" onClick={() => setImportPreview(null)}>Cancel</button>
                  </div>
                </div>
                <div className="import-table-wrap">
                  <table className="cat-table import-table">
                    <thead><tr><th>Line</th><th>Course Code</th><th>Course Name</th><th>Result</th></tr></thead>
                    <tbody>
                      {importPreview.rows.map(r => {
                        const badge = r.status === "ready" ? (r.entry.flagged ? ["flag", "⚑ Ready"] : ["ready", "✓ Ready"])
                          : r.status === "error" ? ["error", "✕ Skipped"] : ["example", "Ignored"];
                        return (
                          <tr key={r.line} className={`imp-${r.status}`}>
                            <td className="idx-cell">{r.line}</td>
                            <td className="mono">{r.code || dash}</td>
                            <td className="name-cell">{r.name || dash}</td>
                            <td><span className={`imp-badge ${badge[0]}`}>{badge[1]}</span><span className="imp-note">{r.note}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Banner + bulk actions when any course doesn't match the current format */}
            {flaggedIds.length > 0 && (
              <div className="alert alert-warn flag-banner">
                <span>⚑</span>
                <div className="flag-banner-body">
                  <div>
                    {plural(flaggedIds.length, "course has a code", "courses have codes")} that {flaggedIds.length === 1 ? "doesn't" : "don't"} match
                    the current code format. Regenerate or re-code them, or mark them OK to keep them as they are.
                  </div>
                  <div className="flag-actions">
                    <button className="btn btn-sm" onClick={() => setOnlyFlagged(v => !v)}>
                      {flaggedFilter ? "Show all courses" : "Show only flagged"}
                    </button>
                    <button className="btn btn-sm primary" onClick={regenAll}>↻ Regenerate all flagged</button>
                    <button className="btn btn-sm" onClick={() => markOk(flaggedIds)}>✓ Mark all OK</button>
                  </div>
                </div>
              </div>
            )}

            {shown.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">◎</div>
                <div className="empty-title">{courses.length === 0 ? "No courses yet" : "No matching courses"}</div>
                <div className="empty-sub">
                  {courses.length === 0 ? "Create one in Course Builder, or import a list with the CSV template" : "Try adjusting your search"}
                </div>
              </div>
            ) : (
              <div className="table-scroll">
                <table className="cat-table">
                  <thead>
                    <tr>
                      <th>#</th>
                      {sortTh("code", "Course Code")}
                      {sortTh("name", "Course Name")}
                      <th>Subject</th><th>Level</th>
                      <th>Customer</th><th>Audience</th><th>State</th>
                      {sortTh("createdAt", "Added")}
                      <th><span className="sr-only">Actions</span></th>
                    </tr>
                  </thead>
                  <tbody>
                    {shown.map((c, i) => {
                      const lv = getLevelInfo(c.number);
                      const renaming = renameId === c.id;
                      const st = statuses[c.id];
                      return (
                        <tr key={c.id} className={[st.state === "flagged" && "flagged", c.id === recodeId && "row-editing"].filter(Boolean).join(" ")}>
                          <td className="idx-cell">{i + 1}</td>

                          {/* Code cell: click to copy "CODE: Name"; flag details, Mark-OK state and history underneath */}
                          <td>
                            <button className="code-cell" onClick={() => doCopy(`${c.code}: ${c.name}`, c.id)} title="Copy full label (code: name)">
                              {c.code}
                              <span className={`ci${copiedId === c.id ? " done" : ""}`}>{copiedId === c.id ? "✓" : "⧉"}</span>
                            </button>
                            {st.state === "flagged" && (
                              <div className="fmt-flag">
                                <div className="fmt-flag-msg">
                                  ⚑ {c.freeform
                                    ? <>Doesn't follow the segment structure. Re-code it to assign segments, or mark it OK.</>
                                    : st.expected
                                      ? <>Current format: <span className="mono">{st.expected}</span>{isRegionCode(c.parts?.location ?? c.location) && " (region codes are retired)"}</>
                                      : <>Can't rebuild in the current format: missing {st.missing.map(m => SEGMENTS[m].label).join(", ")}</>}
                                </div>
                                <div className="flag-actions">
                                  {st.expected && <button className="btn btn-sm primary" onClick={() => regenOne(c)}>↻ Regenerate</button>}
                                  <button className="btn btn-sm" onClick={() => markOk([c.id])}>✓ Mark OK</button>
                                </div>
                              </div>
                            )}
                            {st.state === "acked" && (
                              <div className="fmt-acked">
                                ✓ Kept as-is{st.expected && <> (format gives <span className="mono">{st.expected}</span>)</>}
                                {" "}<button className="btn-inline" onClick={() => reflag(c.id)}>Flag again</button>
                              </div>
                            )}
                            {c.previousCodes?.length > 0 && (
                              <div className="prev-codes" title={`Code history: ${[...c.previousCodes, c.code].join(" → ")}`}>
                                was {c.previousCodes[c.previousCodes.length - 1]}
                              </div>
                            )}
                          </td>

                          {/* Name cell: plain text, or the inline rename editor */}
                          <td className="name-cell">
                            {renaming ? (
                              <div className="name-edit">
                                <div className="name-edit-row">
                                  <input className="glass-input sm" value={renameVal} autoFocus maxLength={200}
                                    aria-label={`New name for ${c.code}`}
                                    onChange={e => { setRenameVal(e.target.value); setRenameErr(""); }}
                                    onKeyDown={e => { if (e.key === "Enter") saveRename(c.id); if (e.key === "Escape") setRenameId(null); }} />
                                  <button className="btn btn-sm primary" onClick={() => saveRename(c.id)}>Save</button>
                                  <button className="btn btn-sm" onClick={() => setRenameId(null)}>Cancel</button>
                                </div>
                                {renameErr && <div className="name-edit-err" role="alert">⚠ {renameErr}</div>}
                              </div>
                            ) : c.name}
                          </td>

                          <td>{c.type ? <span className="pill">{c.type}</span> : dash}</td>
                          <td>
                            {lv ? (
                              <span className="lvl-pill" style={{ "--c": lv.color }} title={lv.label}>
                                {String(c.number).padStart(3, "0")}
                              </span>
                            ) : dash}
                          </td>
                          <td className="muted-cell">
                            {c.client || c.clientCode
                              ? <>{c.client}{c.client && c.clientCode ? " · " : ""}{c.clientCode}</>
                              : dash}
                          </td>
                          <td>{c.audience ? <span className="pill">{c.audience}</span> : dash}</td>
                          <td className="muted-cell">{c.location || dash}</td>
                          <td className="muted-cell">{c.createdAt ? new Date(c.createdAt).toLocaleDateString() : "–"}</td>
                          <td>
                            {!renaming && (
                              <div className="row-actions">
                                <button className="btn btn-sm" onClick={() => startRename(c)}>Rename</button>
                                <button className="btn btn-sm" onClick={() => startRecode(c)}>Re-code</button>
                                <button className="btn btn-del" onClick={() => doDelete(c)}>Remove</button>
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* ══════════════════════════ REFERENCE TAB ══════════════════════════ */}
        {tab === "reference" && (
          <div className="lms-panel">
            <div className="ref-grid">

              {/* The current format, its segments, and the examples rendered in it */}
              <div className="ref-wide">
                <div className="ref-section-title">Current Code Format</div>
                <div className="fmt-box">
                  <div className="fmt-pattern">{pattern.slots.map(s => s.sep + s.value).join("")}</div>
                  {pattern.slots.map(s => (
                    <div key={s.id} className="fmt-desc-row">
                      <span className="k" style={{ color: SEGMENTS[s.id].color }}>[{SEGMENTS[s.id].short}]</span>
                      <span className="v">{SEGMENTS[s.id].desc}</span>
                    </div>
                  ))}
                  <div className="fmt-examples">
                    <div className="ref-section-title">Examples in this format</div>
                    {EXAMPLES.map(ex => {
                      const code = buildCode(ex.vals, format).code;
                      return code ? <div key={ex.name} className="fmt-ex">{code}: {ex.name}</div> : null;
                    })}
                  </div>
                </div>
              </div>

              <div>
                <div className="ref-section-title">Subject / Course Types</div>
                <div className="ref-list">
                  {COURSE_TYPES.map(t => (
                    <div key={t.code} className="ref-row">
                      <span className="ref-code" style={{ color: SEGMENTS.type.color }}>{t.code}</span>
                      <span className="ref-name">{t.label}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="ref-section-title">Audience Codes</div>
                <div className="ref-list ref-scrollable">
                  {AUDIENCES.map(a => (
                    <div key={a.code} className="ref-row">
                      <span className="ref-code" style={{ color: SEGMENTS.audience.color }}>{a.code}</span>
                      <span className="ref-name">{a.label}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="ref-section-title">Course Level Guide</div>
                <div className="ref-list">
                  {LEVELS.map(lv => (
                    <div key={lv.range} className="ref-row">
                      <span className="ref-code" style={{ color: lv.color, minWidth: "60px" }}>{lv.range}</span>
                      <span className="ref-name">{lv.label}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <div className="ref-section-title">Customer Codes</div>
                <div className="ref-list ref-scrollable">
                  {CLIENTS.map((c, i) => (
                    <div key={i} className="ref-row">
                      <span className="ref-code" style={{ color: SEGMENTS.client.color, minWidth: "54px" }}>{c.code}</span>
                      <span className="ref-name">{c.name}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="ref-wide">
                <div className="ref-section-title">State Codes</div>
                <div className="state-grid">
                  {STATES.map(s => (
                    <div key={s.code} className="ref-row">
                      <span className="ref-code" style={{ color: SEGMENTS.location.color, minWidth: "28px" }}>{s.code}</span>
                      <span className="ref-name">{s.name}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>
        )}

      </div>

      {/* ═══ Footer credit ═══ */}
      <Credit />

      {/* ═══ Toast (bottom-right status message) ═══ */}
      {toast && (
        <div className={`alert alert-${toast.kind} toast`} role="status">
          <span>{{ ok: "✓", info: "ⓘ" }[toast.kind] || "⚠"}</span>
          <span>{toast.text}</span>
        </div>
      )}
    </div>
  );
}

// Mount the app into <div id="root">.
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
