<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════════
   LMS COURSE CATALOG
   © 2026 Joe VanWagner · https://jvanwagner.neocities.org/
  ════════════════════════════════════════════════════════════════════════════

   WHAT IT IS
   A single-file web tool for naming courses in a learning management system
   (LMS) with a consistent course-code convention, giving each course a real
   name, and keeping a searchable catalog of everything that's been created.

   A course code is assembled from up to five segments, for example:

        MAN101-20417-SUP-CA
        └┬┘└┬┘ └─┬─┘ └┬┘ └┬┘
       SUBJ NUM  CUST AUD STATE

     SUBJ   subject / course type      (MAN = Management)
     NUM    3-digit course number      (101; the hundreds digit sets the level)
     CUST   customer code, optional    (20417 = a customer the course is built for)
     AUD    audience                   (SUP = Supervisors)
     STATE  2-letter state, optional   (CA)

   MAIN FEATURES
   • Course Builder: pick segment values, see a colour-coded preview of the
     code, name the course, and add it to the catalog.
   • Code Structure editor: turn segments on/off, reorder them (drag or
     arrows), choose the separator in front of each one, drop some or all
     separators from the final code, and keep/remove/underscore spaces.
   • Duplicate protection: a course code or course name that is already in
     use can't be created; the reason is explained on screen.
   • Format flags: when the format changes, existing courses whose codes no
     longer match are flagged. Each can be regenerated in the new format,
     re-coded by hand, or marked OK (kept as-is).
   • Catalog: search, sort, rename, re-code, remove, export to CSV, and
     back up / restore everything as JSON.
   • CSV import: download a template, fill it in (in Excel or similar),
     upload it, review a per-row preview, then import in bulk.
   • Light and dark themes (light by default), remembered between visits.

   HOW IT'S BUILT
   • One HTML file: CSS in the <style> block, the app in the
     <script type="text/babel"> block at the bottom.
   • React 18 renders the interface. Babel Standalone compiles the JSX in
     the browser, so the source below stays readable with no build step.
     (Both load from the cdnjs CDN; fonts load from Google Fonts.)
   • All data lives in the visitor's own browser (localStorage). Nothing is
     sent anywhere.

   PORTFOLIO NOTE
   Every company name, customer code and course in this file is fictional.
   On a visitor's first visit the catalog is seeded with a few sample
   courses (one deliberately in an outdated format, to show the flagging).
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Joe VanWagner" />
  <meta name="description" content="LMS Course Catalog: build consistent course codes, name courses, and keep a searchable catalog." />
  <title>LMS Course Catalog</title>
  <!-- Favicon: the same 16×16 pixel head used in the footer credit, embedded so the file needs no image files. -->

  <script>
    /*
     * Apply the saved colour theme BEFORE anything paints. If this ran later
     * (inside React), a visitor who chose dark mode would see a flash of the
     * light theme on every page load. Light is the default.
     * The try/catch covers browsers that block localStorage (private modes,
     * strict iframe sandboxes); the page just falls back to light.
     */
    try { document.documentElement.dataset.theme = localStorage.getItem("ccat_theme") === "dark" ? "dark" : "light"; } catch (e) {}
  </script>

  <!-- React + ReactDOM (UI rendering) and Babel Standalone (compiles the JSX below in the browser). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Fonts: Courier Prime (typewriter header), IBM Plex Sans (interface), IBM Plex Mono (course codes). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ══════════════════════════════════════════════════════════════════════
       THEME TOKENS
       Every colour in the app is a CSS custom property ("token"). The light
       palette sits on :root; the dark palette overrides the same names when
       <html data-theme="dark">. Components only ever reference tokens, so
       switching theme is a single attribute change.
       ══════════════════════════════════════════════════════════════════════ */

    /* Light (default): paper and oatmeal neutrals, charcoal ink, ledger-navy accent */
    :root {
      color-scheme: light;                 /* native form controls & scrollbars follow the theme */
      --font-ui:   'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', Consolas, monospace;
      --font-head: 'Courier Prime', 'Courier New', Courier, monospace;

      /* Surfaces */
      --bg: #ebe7de;                       /* the "desk" behind everything */
      --header-bg: #f7f5f0;
      --panel: #f9f7f2;                    /* the "paper" each tab sits on */
      --panel-border: #d5cfc2;
      --tab-bg: #e3ded3;                   /* inactive tabs */
      --tab-active-bg: #f9f7f2;
      --tab-active-line: #d5cfc2;
      --field: #fffefb;                    /* inputs, small buttons */
      --field-border: #cdc6b8;
      --field-focus-bg: #fffefb;
      --soft: #f2eee6;                     /* subtle fills: rows, chips */
      --soft-2: #e8e3d8;                   /* slightly stronger fill / hover */
      --line: #e2ddd1;                     /* hairline dividers */
      --line-2: #d2cbbd;                   /* stronger borders */
      --well: #f2eee5;                     /* recessed areas like the code preview */
      --menu: #fffefb;                     /* dropdowns, toasts */
      --shadow: 0 8px 24px rgba(43,45,48,0.12);

      /* Text, darkest to faintest */
      --text: #2b2d30;
      --text-2: #3b3e42;
      --text-3: #5c5f63;
      --text-4: #808286;
      --text-5: #a5a49f;

      /* Accent (links, active states, primary buttons) */
      --accent: #2f4a62;
      --accent-2: #3c5a75;
      --accent-soft: rgba(47,74,98,0.08);
      --accent-line: rgba(47,74,98,0.35);
      --add-grad: linear-gradient(#2f4a62, #2f4a62);   /* solid; kept as a gradient so dark mode can swap it */

      /* Status colours: text / background / border */
      --warn: #765614; --warn-bg: #f5eed8; --warn-line: #dfcfa0;   /* mustard */
      --err: #8b3a2e;  --err-bg: #f5e6e1;  --err-line: #dcbbb1;    /* brick */
      --ok: #3e5f46;   --ok-bg: #e6eee5;   --ok-line: #bccfbd;     /* sage */
      --info: #34516a; --info-bg: #e5ecf1; --info-line: #c0cfda;   /* steel */
      --flag-row: rgba(184,146,58,0.08);                            /* tint behind flagged catalog rows */

      /* One colour per code segment (used in the preview, field labels, reference lists) */
      --seg-type: #5d4b7c; --seg-number: #8a4646; --seg-client: #4b6a53; --seg-audience: #34577a; --seg-location: #87672a;

      /* Course level colours, 001–099 through 600–999 */
      --lv0: #6c6f73; --lv1: #3e6285; --lv2: #4b6a53; --lv3: #87672a; --lv4: #985832; --lv5: #5d4b7c; --lv6: #8b3a2e;
    }

    /* Dark: "after hours" charcoal and slate with the same muted hues */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1e21;
      --header-bg: #232528;
      --panel: #25272b;
      --panel-border: #393c41;
      --tab-bg: #202225;
      --tab-active-bg: #25272b;
      --tab-active-line: #393c41;
      --field: #2b2e32;
      --field-border: #43464c;
      --field-focus-bg: #2e3136;
      --soft: #2a2c30;
      --soft-2: #323539;
      --line: #33363a;
      --line-2: #3f4247;
      --well: #212326;
      --menu: #2b2e32;
      --shadow: 0 8px 28px rgba(0,0,0,0.45);
      --text: #e3e0d8;
      --text-2: #d0cdc5;
      --text-3: #aaa7a0;
      --text-4: #85837e;
      --text-5: #64635f;
      --accent: #a3b9cc;
      --accent-2: #7f9bb3;
      --accent-soft: rgba(163,185,204,0.12);
      --accent-line: rgba(163,185,204,0.38);
      --add-grad: linear-gradient(#3c5a75, #3c5a75);
      --warn: #d6bd7c; --warn-bg: rgba(214,189,124,0.1);  --warn-line: rgba(214,189,124,0.3);
      --err: #d89a8c;  --err-bg: rgba(216,154,140,0.1);   --err-line: rgba(216,154,140,0.32);
      --ok: #9dbf9f;   --ok-bg: rgba(157,191,159,0.1);    --ok-line: rgba(157,191,159,0.3);
      --info: #a3b9cc; --info-bg: rgba(163,185,204,0.09); --info-line: rgba(163,185,204,0.26);
      --flag-row: rgba(214,189,124,0.05);
      --seg-type: #b4a5cf; --seg-number: #cf9b9b; --seg-client: #9dbf9f; --seg-audience: #a3b9cc; --seg-location: #d3b678;
      --lv0: #9a9c9f; --lv1: #a3b9cc; --lv2: #9dbf9f; --lv3: #d3b678; --lv4: #d49b74; --lv5: #b4a5cf; --lv6: #d89a8c;
    }

    /* While the theme is switching, suppress transitions so every control
       changes colour at once instead of fading individually. (The app adds
       this class for one frame around each switch.) */
    .theme-switching *, .theme-switching *::before, .theme-switching *::after { transition: none !important; }

    /* ══════════════════════════════════════════════════════════════════════
       BASE & PAGE LAYOUT
       ══════════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body { overflow-x: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
    .lms-root { min-height: 100vh; background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Header bar: typewriter face, sticks to the top while scrolling */
    .lms-header {
      padding: 22px 32px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--panel-border);
      position: sticky; top: 0; z-index: 50;
    }
    .lms-header, .lms-header button { font-family: var(--font-head); }
    .lms-header-left { display: flex; flex-direction: column; gap: 3px; }
    .lms-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .lms-title { font-size: 24px; font-weight: 700; color: var(--text); }
    .lms-subtitle { font-size: 10px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-4); }
    .lms-counter {
      font-size: 13px; color: var(--text-4); padding: 6px 14px;
      background: var(--soft); border: 1px solid var(--line-2); border-radius: 8px;
    }
    .theme-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
      background: var(--soft); border: 1px solid var(--line-2); color: var(--text-3);
      font-size: 13px; font-weight: 700; transition: all 0.18s;
    }
    .theme-toggle:hover { border-color: var(--accent-line); color: var(--accent); }

    /* Tabs look like file-folder tabs sitting on top of the panel */
    .lms-tabs { display: flex; gap: 3px; padding: 20px 32px 0; overflow-x: auto; }
    .lms-tab {
      padding: 9px 22px; border-radius: 6px 6px 0 0;
      border: 1px solid var(--line); border-bottom: none;
      background: var(--tab-bg); color: var(--text-4);
      font-family: var(--font-ui); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
    }
    .lms-tab:hover { background: var(--soft-2); color: var(--text-2); }
    .lms-tab.active, .lms-tab.active:hover { background: var(--tab-active-bg); border-color: var(--tab-active-line); color: var(--accent); }

    .lms-body { padding: 0 32px 24px; }
    .lms-panel {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 0 8px 8px 8px; padding: 28px 28px 32px;
    }

    /* Builder: two columns on wide screens, one on phones */
    .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px; }
    .fmt-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 32px; }
    @media (max-width: 680px) {
      .builder-grid, .fmt-grid { grid-template-columns: 1fr; }
      .lms-header { padding: 16px; }
      .lms-tabs { padding: 16px 16px 0; }
      .lms-body { padding: 0 16px 20px; }
      .lms-panel { padding: 20px 16px 24px; }
      .lms-tab { padding: 9px 14px; }
    }
    .col-full { grid-column: 1 / -1; }
    .divider { height: 1px; background: var(--line); margin: 20px 0; }

    .section-head {
      font-size: 9.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-4); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    /* ══════════════════════════════════════════════════════════════════════
       FORM FIELDS
       ══════════════════════════════════════════════════════════════════════ */
    .field { display: flex; flex-direction: column; margin-bottom: 16px; transition: opacity 0.2s; }
    .field:last-child { margin-bottom: 0; }
    .field.excluded { opacity: 0.5; }          /* the field's segment is switched off in Code Structure */
    .field-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: var(--text-3); margin-bottom: 7px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .field-label .req { color: var(--accent); }
    .field-label .opt { color: var(--text-5); font-weight: 400; }
    .seg-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }   /* segment colour swatch */
    .field-hint { font-size: 11px; color: var(--text-4); margin-top: 6px; line-height: 1.4; }
    .field-hint.bad { color: var(--warn); }

    .glass-input, .glass-select {
      background: var(--field); border: 1px solid var(--field-border); border-radius: 6px; color: var(--text);
      font-family: var(--font-ui); font-size: 13.5px; padding: 10px 13px; outline: none; transition: all 0.18s; width: 100%;
      -webkit-appearance: none; appearance: none;
    }
    .glass-input:focus, .glass-select:focus {
      border-color: var(--accent-line); background: var(--field-focus-bg); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .glass-input::placeholder { color: var(--text-5); font-style: italic; font-size: 13px; }
    .glass-input[readonly] { cursor: default; }
    .glass-select option { background: var(--menu); color: var(--text); }
    .glass-input.mono { font-family: var(--font-mono); letter-spacing: 0.5px; }
    .glass-input.sm, .glass-select.sm { font-size: 12px; padding: 6px 10px; border-radius: 6px; }
    .glass-select.sm { padding-right: 26px; }

    /* Custom ▾ arrow for selects (the native one is hidden by appearance: none) */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%); color: var(--text-4); pointer-events: none; font-size: 12px;
    }
    .select-wrap.sm::after { right: 9px; font-size: 11px; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    .input-row .glass-input { flex: 1; }
    input[type="checkbox"] { accent-color: var(--accent-2); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
    .check-label { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-4); cursor: pointer; margin-top: 7px; }
    .check-label.inline { margin-top: 0; }

    /* Level badge under the course number. --c is set inline to the level's colour;
       color-mix() derives a faint tint of it for the background. */
    .level-badge {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-top: 7px;
      font-family: var(--font-mono); color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent);
    }
    .level-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--c); }

    /* Customer search dropdown */
    .client-wrap { position: relative; }
    .client-dropdown {
      position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 200;
      background: var(--menu); border: 1px solid var(--accent-line); border-radius: 6px;
      max-height: 210px; overflow-y: auto; box-shadow: var(--shadow);
    }
    .client-item {
      padding: 9px 13px; cursor: pointer; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      transition: background 0.12s; border-bottom: 1px solid var(--line);
    }
    .client-item:last-child { border-bottom: none; }
    .client-item:hover { background: var(--accent-soft); }
    .client-item .ccode { font-family: var(--font-mono); font-size: 11px; color: var(--text-4); flex-shrink: 0; }
    .client-item.none-item, .client-item.empty-item { color: var(--text-4); font-style: italic; }
    .client-item.empty-item { cursor: default; }
    .client-item.empty-item:hover { background: none; }

    /* Banner shown at the top of the builder while re-coding an existing course */
    .edit-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; margin-bottom: 22px; border-radius: 6px;
      background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
      font-size: 12.5px; font-weight: 700;
    }
    .edit-banner .sub { font-weight: 500; color: var(--text-3); font-size: 11.5px; margin-top: 3px; }

    /* ══════════════════════════════════════════════════════════════════════
       CODE STRUCTURE EDITOR (segment list + separator rows + output options)
       ══════════════════════════════════════════════════════════════════════ */
    .seg-list { display: flex; flex-direction: column; }
    .seg-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 8px; border-radius: 6px;
      background: var(--soft); border: 1px solid var(--line-2);
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .seg-row.off { opacity: 0.45; }                                           /* segment excluded */
    .seg-row.off .seg-name { text-decoration: line-through; text-decoration-color: var(--text-4); }
    .seg-row.dragging { opacity: 0.35; }                                      /* the row being dragged */
    .seg-row.drop-target { border-color: var(--accent-line); background: var(--accent-soft); }
    .seg-list > .seg-row + .seg-row { margin-top: 6px; }
    .drag-handle { cursor: grab; color: var(--text-5); font-size: 15px; line-height: 1; padding: 2px; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .seg-name { font-size: 12.5px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
    .seg-val {
      font-family: var(--font-mono); font-size: 11.5px; color: var(--text-4);
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right;
    }
    .seg-val.has { color: var(--c); }                                         /* shows the current value in the segment's colour */
    .seg-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .icon-btn {
      width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--line-2);
      background: var(--field); color: var(--text-3); cursor: pointer;
      font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .icon-btn:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
    .icon-btn:disabled { opacity: 0.3; cursor: default; }

    /* The "joined by [separator]" row drawn between two segments, with a connector line */
    .sep-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0 6px 30px; position: relative; }
    .sep-row::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
    .sep-lbl { font-size: 10.5px; color: var(--text-4); font-weight: 600; letter-spacing: 0.3px; }
    .sep-row .select-wrap { width: 150px; }
    .sep-custom { width: 70px !important; font-family: var(--font-mono); text-align: center; }
    .sep-note { font-size: 10px; font-family: var(--font-mono); color: var(--warn); }
    .sep-row.omitted .select-wrap { opacity: 0.5; }

    .opt-block { margin-bottom: 18px; }
    .opt-block:last-child { margin-bottom: 0; }
    .opt-hint { font-size: 11px; color: var(--text-4); margin-top: 7px; line-height: 1.45; }
    /* Segmented control (a row of mutually exclusive buttons) */
    .seg-ctl { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 6px; background: var(--soft-2); border: 1px solid var(--line); }
    .seg-ctl button {
      padding: 6px 12px; border-radius: 5px; border: 1px solid transparent; background: none;
      color: var(--text-3); font-family: var(--font-ui); font-size: 11.5px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .seg-ctl button:hover { color: var(--text); }
    .seg-ctl button.active { background: var(--panel); border-color: var(--accent-line); color: var(--accent); }
    :root[data-theme="dark"] .seg-ctl button.active { background: var(--accent-soft); }
    .quick-seps { display: flex; flex-wrap: wrap; gap: 5px; }
    .quick-seps button {
      min-width: 34px; padding: 5px 9px; border-radius: 5px; border: 1px solid var(--line-2);
      background: var(--field); color: var(--text-3); font-family: var(--font-mono); font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .quick-seps button:hover { border-color: var(--accent-line); color: var(--accent); }

    /* ══════════════════════════════════════════════════════════════════════
       CODE PREVIEW; each segment is drawn with a bracket and a label under
       it, like annotating a code on a whiteboard. --c = the segment colour.
       ══════════════════════════════════════════════════════════════════════ */
    .code-preview {
      background: var(--well); border: 1px solid var(--accent-line); border-radius: 8px; padding: 18px 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; min-height: 68px;
    }
    .code-placeholder { font-family: var(--font-mono); font-size: 12px; color: var(--text-5); font-style: italic; }
    .code-strip { display: flex; flex-wrap: wrap; align-items: flex-start; row-gap: 10px; flex: 1; min-width: 0; }
    .code-part { display: inline-flex; flex-direction: column; align-items: stretch; padding: 0 2px; }
    .code-part-val, .code-sep { font-family: var(--font-mono); font-size: 20px; font-weight: 500; line-height: 1.3; letter-spacing: 0.6px; white-space: pre; }
    .code-part-val { color: var(--c); text-align: center; padding: 0 1px; }
    .code-part.missing .code-part-val { opacity: 0.4; font-style: italic; }     /* required segment not filled yet */
    .code-part-brk { height: 7px; margin: 3px 1px 0; border: 2px solid var(--c); border-top: none; border-radius: 0 0 3px 3px; opacity: 0.7; }
    .code-part.missing .code-part-brk { border-style: dashed; opacity: 0.4; }
    .code-part-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c); opacity: 0.8; text-align: center; margin-top: 4px; white-space: nowrap; }
    .code-sep { color: var(--text-4); }
    .code-final-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .code-final-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-4); min-width: 92px; }
    .code-final { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); flex: 1; min-width: 0; word-break: break-all; }
    .code-final.dim { color: var(--text-5); font-style: italic; }

    /* ══════════════════════════════════════════════════════════════════════
       BUTTONS
       ══════════════════════════════════════════════════════════════════════ */
    .btn {
      padding: 9px 18px; border-radius: 6px; border: none; font-family: var(--font-ui); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 0.18s; letter-spacing: 0.4px; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-copy { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); padding: 6px 12px; font-size: 11px; }
    .btn-copy:hover { filter: brightness(1.08); }
    .btn-copy.copied { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
    .btn-add { background: var(--add-grad); color: #fff; width: 100%; padding: 13px 24px; font-size: 13.5px; border-radius: 6px; margin-top: 14px; }
    .btn-add:hover:not(:disabled) { filter: brightness(1.12); }
    .btn-add:disabled { opacity: 0.3; }
    .btn-ghost { background: var(--field); border: 1px solid var(--line-2); color: var(--text-3); padding: 7px 13px; font-size: 11.5px; }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
    .btn-del { background: var(--err-bg); border: 1px solid var(--err-line); color: var(--err); padding: 5px 10px; font-size: 11px; border-radius: 6px; }
    .btn-del:hover { filter: brightness(0.97) saturate(1.2); }
    .btn-sm { background: var(--field); border: 1px solid var(--line-2); color: var(--text-3); padding: 5px 10px; font-size: 11px; border-radius: 6px; }
    .btn-sm:hover:not(:disabled) { border-color: var(--accent-line); color: var(--accent); }
    .btn-sm.primary { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
    .btn-clear { background: none; border: none; color: var(--text-4); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; transition: color 0.15s; }
    .btn-clear:hover { color: var(--err); }
    .btn-inline { background: none; border: none; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 700; }
    .btn-inline:hover { filter: brightness(1.2); }

    /* ══════════════════════════════════════════════════════════════════════
       ALERTS & TOASTS
       ══════════════════════════════════════════════════════════════════════ */
    .alert {
      display: flex; align-items: flex-start; gap: 9px; padding: 11px 14px; border-radius: 6px;
      font-size: 12px; font-weight: 600; line-height: 1.45; margin-top: 12px; border: 1px solid transparent;
    }
    .alert-warn { background-color: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
    .alert-err  { background-color: var(--err-bg);  border-color: var(--err-line);  color: var(--err); }
    .alert-ok   { background-color: var(--ok-bg);   border-color: var(--ok-line);   color: var(--ok); }
    .alert-info { background-color: var(--info-bg); border-color: var(--info-line); color: var(--info); }
    /* Toasts float bottom-right. Status backgrounds are translucent in dark mode,
       so each toast layers its tint (background-image) over a solid base colour. */
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 300; max-width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow); margin: 0; background-color: var(--menu) !important; }
    .toast.alert-ok   { background-image: linear-gradient(var(--ok-bg), var(--ok-bg)); }
    .toast.alert-warn { background-image: linear-gradient(var(--warn-bg), var(--warn-bg)); }
    .toast.alert-err  { background-image: linear-gradient(var(--err-bg), var(--err-bg)); }
    .toast.alert-info { background-image: linear-gradient(var(--info-bg), var(--info-bg)); }

    /* ══════════════════════════════════════════════════════════════════════
       CATALOG TABLE
       ══════════════════════════════════════════════════════════════════════ */
    .cat-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .cat-toolbar .glass-input { max-width: 300px; }
    .tool-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tool-sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
    .cat-count { font-size: 12px; font-family: var(--font-mono); color: var(--text-4); margin-left: auto; }

    /* position: relative keeps absolutely positioned cell content (like the
       screen-reader-only "Actions" heading) inside this horizontal scroller,
       so a wide table never makes the whole page scroll sideways on phones. */
    .table-scroll { overflow-x: auto; position: relative; }
    .cat-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .cat-table th {
      text-align: left; padding: 9px 14px; white-space: nowrap; font-size: 9.5px; font-weight: 700;
      letter-spacing: 1.8px; text-transform: uppercase; color: var(--text-4); border-bottom: 1px solid var(--line-2);
    }
    .th-sort { background: none; border: none; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; padding: 0; }
    .th-sort:hover, .th-sort.on { color: var(--accent); }
    .cat-table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .cat-table tr:last-child td { border-bottom: none; }
    .cat-table tbody tr:hover td { background: var(--soft); }
    .cat-table tr.flagged td { background: var(--flag-row); }
    .row-editing td { background: var(--accent-soft) !important; }           /* the course open in the builder */
    .idx-cell { font-family: var(--font-mono); font-size: 11px; color: var(--text-5); }
    .name-cell { color: var(--text-2); font-weight: 500; }
    .muted-cell { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
    .dash { opacity: 0.35; }
    .mono { font-family: var(--font-mono); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--soft-2); color: var(--text-3); }
    .lvl-pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }

    /* Course code cell: click to copy; the ⧉ icon appears on hover */
    .code-cell { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; white-space: nowrap; }
    .ci { opacity: 0; transition: opacity 0.12s; font-size: 10px; color: var(--text-4); }
    .code-cell:hover .ci, .code-cell:focus-visible .ci { opacity: 1; }
    .ci.done { opacity: 1 !important; color: var(--ok); }

    /* Format flag details under a flagged code, plus "Kept as-is" and code history notes */
    .fmt-flag { margin-top: 7px; display: flex; flex-direction: column; gap: 6px; }
    .fmt-flag-msg { font-size: 11px; font-weight: 600; color: var(--warn); line-height: 1.4; word-break: break-word; }
    .flag-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .fmt-acked { margin-top: 6px; font-size: 10.5px; color: var(--ok); line-height: 1.4; word-break: break-word; }
    .prev-codes { margin-top: 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-4); cursor: help; }
    .flag-banner { margin: 0 0 18px; }
    .flag-banner-body { display: flex; flex-direction: column; gap: 9px; flex: 1; }

    /* Inline rename editor inside a table row */
    .name-edit { display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
    .name-edit-row { display: flex; gap: 6px; align-items: center; }
    .name-edit-err { font-size: 11px; color: var(--err); font-weight: 600; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* CSV import preview panel */
    .import-panel { border: 1px solid var(--accent-line); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .import-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--accent-soft); }
    .import-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .import-sub { font-size: 11.5px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }
    .import-table-wrap { max-height: 340px; overflow: auto; position: relative; }
    .import-table td { vertical-align: top; }
    .imp-badge { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 700; margin-right: 6px; white-space: nowrap; }
    .imp-badge.ready   { background: var(--ok-bg);   color: var(--ok);   border: 1px solid var(--ok-line); }
    .imp-badge.flag    { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
    .imp-badge.error   { background: var(--err-bg);  color: var(--err);  border: 1px solid var(--err-line); }
    .imp-badge.example { background: var(--soft-2);  color: var(--text-4); }
    .imp-note { font-size: 11.5px; color: var(--text-3); }
    tr.imp-error td, tr.imp-example td { opacity: 0.75; }

    .empty-state { text-align: center; padding: 70px 20px; color: var(--text-5); }
    .empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.4; }
    .empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--text-4); }
    .empty-sub { font-size: 12px; color: var(--text-4); }

    /* ══════════════════════════════════════════════════════════════════════
       REFERENCE TAB
       ══════════════════════════════════════════════════════════════════════ */
    .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    @media (max-width: 640px) { .ref-grid { grid-template-columns: 1fr; } }
    .ref-wide { grid-column: 1 / -1; }
    .ref-section-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-4); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .ref-list { display: flex; flex-direction: column; gap: 5px; }
    .ref-row { display: flex; align-items: center; gap: 10px; padding: 8px 11px; background: var(--soft); border-radius: 6px; border: 1px solid var(--line); }
    .ref-code { font-family: var(--font-mono); font-size: 12px; font-weight: 500; min-width: 42px; flex-shrink: 0; }
    .ref-name { font-size: 12.5px; color: var(--text-3); }
    .ref-scrollable { max-height: 340px; overflow-y: auto; padding-right: 4px; }
    .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 5px; }
    .fmt-box { background: var(--well); border: 1px solid var(--accent-line); border-radius: 8px; padding: 20px 24px; }
    .fmt-pattern { font-family: var(--font-mono); font-size: 15px; color: var(--accent); letter-spacing: 0.5px; margin-bottom: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .fmt-desc-row { display: flex; gap: 16px; align-items: baseline; padding: 3px 0; }
    .fmt-desc-row .k { font-family: var(--font-mono); font-size: 12px; min-width: 100px; flex-shrink: 0; }
    .fmt-desc-row .v { font-size: 12px; color: var(--text-3); }
    .fmt-examples { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
    .fmt-examples .ref-section-title { border: none; padding: 0; margin-bottom: 10px; }
    .fmt-ex { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); padding: 4px 0; border-bottom: 1px solid var(--line); word-break: break-all; }

    /* ══════════════════════════════════════════════════════════════════════
       FOOTER CREDIT; "© 2026 Joe VanWagner" with the pixel-head icon
       ══════════════════════════════════════════════════════════════════════ */
    .jv-credit { display: flex; justify-content: center; padding: 4px 16px 28px; font-family: var(--font-head); font-size: 13px; color: var(--text-4); }
    .jv-credit a { display: inline-flex; align-items: center; gap: 7px; color: var(--accent); text-decoration: none; }
    .jv-credit a:hover span { text-decoration: underline; }
    /* The icon is a 16×16 image drawn at 24px: "pixelated" keeps its edges crisp instead of blurry. */
    .jv-icon { width: 24px; height: 24px; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; }

    /* ══════════════════════════════════════════════════════════════════════
       ACCESSIBILITY HELPERS
       ══════════════════════════════════════════════════════════════════════ */
    :focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }   /* visible keyboard focus */
    .glass-input:focus-visible, .glass-select:focus-visible { outline: none; }       /* inputs use their own focus ring */
    /* Visually hidden but still read by screen readers */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This tool needs JavaScript enabled.</p></noscript>

<script type="text/babel">
/* ════════════════════════════════════════════════════════════════════════════
   APP SCRIPT
   Sections:
     1. Reference data     ; subjects, audiences, customers, states, levels
     2. Code format model  ; segments, separators, the default format
     3. Sample & template  ; demo courses, CSV template, examples
     4. Helpers            ; building, parsing and comparing codes
     5. Storage            ; saving to / loading from localStorage
     6. CSV import         ; parsing a CSV and checking each row
     7. Small components   ; segmented control, code preview, credit footer
     8. Format editor      ; the Code Structure panel
     9. App                ; state, actions, and the three tabs
   ════════════════════════════════════════════════════════════════════════════ */
const { useState, useEffect, useRef } = React;

/* ────────────────────────────────────────────────────────────────────────────
   1. REFERENCE DATA (all fictional)
   Each list feeds a dropdown in the builder and a table on the Reference tab.
   ──────────────────────────────────────────────────────────────────────────── */

// Subject / course-type codes (first segment of a course code)
const COURSE_TYPES = [
  { code: "COM", label: "Compliance" },

// Audience codes. MAN is both a subject and an audience, which the code
// parser has to cope with (see parseCode).
const AUDIENCES = [

// Customers a course can be built for. Codes vary in length on purpose, and
// the three Harbor & Pine brands share one parent code (30017) to show that

// US states + D.C., sorted by name for the dropdown
const STATES = [
  { code: "AL", name: "Alabama" }, { code: "AK", name: "Alaska" }, { code: "AZ", name: "Arizona" },

const STATE_CODES = new Set(STATES.map(s => s.code));   // fast "is this a real state code?" lookups

// Older codes used region codes (R1–R5) in the last segment. They're retired:
// a course that still has one is flagged, and regenerating it drops the region.
const isRegionCode = v => /^R[1-5]$/i.test(String(v || "").trim());

// Course levels by number range. Colours are theme tokens, so they adapt to dark mode.
const LEVELS = [
  { range: "001–099", label: "Remedial / Pre-Entry", color: "var(--lv0)" },
  { range: "100–199", label: "Entry Level",          color: "var(--lv1)" },
  { range: "200–299", label: "Intermediate",         color: "var(--lv2)" },

/* ────────────────────────────────────────────────────────────────────────────
   2. CODE FORMAT MODEL
   ──────────────────────────────────────────────────────────────────────────── */

// The five segments a code can contain. Keys are stable ids used everywhere
// (stored formats, stored course parts), so they never change even when a
// label does (e.g. "location" is now labelled "State").
//   required: the code can't be built until this segment has a value
//             (unless the segment is switched off in Code Structure).
//   short:    the tag drawn under the segment's bracket in the preview.
const SEGMENTS = {
  type:     { label: "Subject",  short: "SUBJ",  color: "var(--seg-type)",     required: true,  desc: "Subject / course type code (e.g. MAN)" },
  number:   { label: "Number",   short: "NUM",   color: "var(--seg-number)",   required: true,  desc: "3-digit course number (e.g. 101, 099)" },
  client:   { label: "Customer", short: "CUST",  color: "var(--seg-client)",   required: false, desc: "Customer code; skipped when no customer is chosen" },
  audience: { label: "Audience", short: "AUD",   color: "var(--seg-audience)", required: true,  desc: "Audience code (e.g. SUP)" },
  location: { label: "State",    short: "STATE", color: "var(--seg-location)", required: false, desc: "2-letter state code (e.g. CA); skipped when no state is chosen" },
};
const SEGMENT_IDS = Object.keys(SEGMENTS);

// Separator choices offered in each "joined by" dropdown. "" means the two
// segments are written right next to each other (e.g. MAN + 101 → MAN101).
const SEPARATORS = [
  { value: "-", label: "Hyphen  ( - )" },
  { value: "_", label: "Underscore  ( _ )" },
  { value: ".", label: "Period  ( . )" },
  { value: "/", label: "Slash  ( / )" },
  { value: " ", label: "Space" },
  { value: "",  label: "None (joined)" },
];
const CUSTOM = "__custom";   // sentinel <option> value meaning "let me type my own"

// The standard format, e.g. MAN101-20417-SUP-CA.
// Each segment stores:
//   on   – included in the code at all
//   sep  – the separator written BEFORE this segment (ignored for the first one)
//   keep – when sepMode is "custom", whether this separator survives into the final code
// sepMode:   keep (all separators) | omit (none) | custom (per-separator "keep")
// spaceMode: keep | remove | underscore; what happens to spaces in the final code
const DEFAULT_FORMAT = {
  order: ["type", "number", "client", "audience", "location"],
  segs: {
    type:     { on: true, sep: "-", keep: true },
    number:   { on: true, sep: "",  keep: true },
    client:   { on: true, sep: "-", keep: true },
    audience: { on: true, sep: "-", keep: true },
    location: { on: true, sep: "-", keep: true },
  },
  sepMode: "keep",
  spaceMode: "keep",
};

// after lower-casing and stripping everything but letters, so "Course Name",

  name:     ["coursename", "name", "coursetitle", "title"],
  code:     ["coursecode", "code"],
  type:     ["subject", "subjectcode", "coursetype", "type"],
  number:   ["number", "coursenumber", "num"],

/* ────────────────────────────────────────────────────────────────────────────
   4. HELPERS
   ──────────────────────────────────────────────────────────────────────────── */

/** Level (label + colour) for a course number, or null if it isn't a valid number. */
function getLevelInfo(num) {
  const n = parseInt(num, 10);
  if (isNaN(n) || n <= 0) return null;
  if (n < 100) return LEVELS[0];
  if (n < 200) return LEVELS[1];
  if (n < 300) return LEVELS[2];
  if (n < 400) return LEVELS[3];
  if (n < 500) return LEVELS[4];
  if (n < 600) return LEVELS[5];
  return LEVELS[6];
}

/** "7" → "007", "99" → "099". Course numbers are always three digits in a code. */
const padNum = val => String(parseInt(val, 10)).padStart(3, "0");

/** Custom subject/audience codes: upper-case letters, digits and spaces only, max 10. */
const sanitizeCode = s => s.toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 10);

/** Trim and collapse runs of whitespace: "  Safety   Basics " → "Safety Basics". */
const cleanName = s => String(s || "").trim().replace(/\s+/g, " ");

/** Name identity for duplicate checks: case- and spacing-insensitive. */
const normName = s => cleanName(s).toLowerCase();

/** Code identity for duplicate checks: ignores case and every separator,
    so "MAN101-20417" and "man101_20417" count as the same code. */
const normCode = s => (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

/** Order-insensitive identity of a code's segment values, used to catch the
    same segments written in a different order (101-MAN-… vs MAN101-…). */
const partsKey = p => p ? SEGMENT_IDS.map(id => `${id}=${normCode(p[id])}`).join("|") : null;

/** Escape a string for literal use inside a RegExp. */
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\\/-]/g, "\\$&");

/** "1 course" / "3 courses" */
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/** Customer name for a code; but only when exactly one customer uses that code
    (30017 belongs to three Harbor & Pine brands, so it returns ""). */
const clientNameFor = code => {
  const hits = CLIENTS.filter(x => x.code === code);
  return hits.length === 1 ? hits[0].name : "";
};

/** Apply the "Spaces in final code" setting to a piece of the code. */
function applySpaces(str, mode) {
  if (mode === "remove") return str.replace(/\s/g, "");
  if (mode === "underscore") return str.replace(/\s/g, "_");
  return str;
}

/**
 * THE CORE FUNCTION: assemble a course code from segment values and a format.
 *
 * Walks the segments in the format's order and, for each one that's switched on:
 *   • skips it if it's optional and empty (no customer → no customer segment)
 *   • records it as "missing" if it's required and empty
 *   • otherwise writes its separator (unless it's the first piece, or the
 *     separator is omitted by sepMode) followed by its value
 *
 * Returns:
 *   slots   – every visible piece, including placeholders for missing ones
 *             (the preview draws these as faded SUBJ / NUM / … tags)
 *   missing – ids of required segments still empty
 *   code    – the finished code string, or "" while anything is missing
 *   used    – the values that actually went into the code (stored as `parts`)
 */
function buildCode(vals, fmt) {
  const slots = [], missing = [], used = {};
  fmt.order.forEach(id => {
    const s = fmt.segs[id];
    if (!s.on) return;
    const raw = String(vals[id] || "").trim();
    if (!raw && !SEGMENTS[id].required) return;
    const dropSep = fmt.sepMode === "omit" || (fmt.sepMode === "custom" && !s.keep);
    const sep = slots.length && !dropSep ? applySpaces(s.sep, fmt.spaceMode) : "";
    if (!raw) { missing.push(id); slots.push({ id, sep, value: "", missing: true }); return; }
    used[id] = raw;
    slots.push({ id, sep, value: applySpaces(raw, fmt.spaceMode), missing: false });
  });
  const code = slots.length && !missing.length ? slots.map(s => s.sep + s.value).join("") : "";
  return { slots, missing, code, used };
}

/**
 * The reverse of buildCode: read segment values back out of a code that was
 * written in `fmt`. Used by the CSV importer so an uploaded code can be
 * understood (and later flagged or regenerated like any other course).
 *
 * How it works: the optional segments (customer, state) may or may not be
 * present, so it tries every combination of them, fullest first. For each
 * combination it builds a code from placeholder values, which yields the exact
 * separators that combination would use, then turns that into a regular
 * expression with one named group per segment and tests the real code.
 *
 * Known subject/audience codes are listed before the generic [A-Z]{1,10}
 * fallback so that, when separators are omitted, "SUPCA" splits into SUP + CA
 * rather than being read as one long audience code.
 */
const SEG_RE = {
  type:     `${COURSE_TYPES.map(t => t.code).join("|")}|[A-Z]{1,10}`,
  number:   `\\d{3}`,
  client:   `\\d{1,10}`,
  audience: `${AUDIENCES.map(a => a.code).join("|")}|[A-Z]{1,10}`,
  location: [...STATE_CODES].join("|"),
};
function parseCode(code, fmt) {
  const opt = SEGMENT_IDS.filter(id => !SEGMENTS[id].required && fmt.segs[id].on);
  // mask's bits say which optional segments are present; count down so the
  // fullest combination is tried first.
  for (let mask = (1 << opt.length) - 1; mask >= 0; mask--) {
    const vals = {};
    SEGMENT_IDS.forEach(id => {
      const i = opt.indexOf(id);
      if (SEGMENTS[id].required || (i >= 0 && (mask >> i) & 1)) vals[id] = `@${id}@`;
    });
    const b = buildCode(vals, fmt);
    if (!b.code) continue;
    const src = b.slots.map(s => escapeRe(s.sep) + `(?<${s.id}>${SEG_RE[s.id]})`).join("");
    const m = new RegExp(`^(?:${src})$`, "i").exec(code.trim());
    if (m) return Object.fromEntries(b.slots.map(s => [s.id, m.groups[s.id].toUpperCase()]));
  }
  return null;
}

/**
 * The segment values a catalog course's code was built from.
 * Newer courses store them as `parts`; older ones are reconstructed from the
 * individual fields. Retired region codes are dropped either way.
 */
function courseValues(c) {
  const v = c.parts ? { ...c.parts } : {
    type: c.type || "",
    number: c.number ? padNum(c.number) : "",
    client: c.clientCode ||
      CLIENTS.find(x => x.name === c.client)?.code ||
      (/^\d+$/.test(c.client || "") ? c.client : ""),
    audience: c.audience || "",
    location: c.location || "",
  };
  if (isRegionCode(v.location)) delete v.location;
  return v;
}

/**
 * How an existing course's code compares with the current format.
 *   state "ok"      – the format would produce exactly this code
 *   state "flagged" – it wouldn't; shown with Regenerate / Mark OK
 *   state "acked"   – it wouldn't, but someone clicked Mark OK for this exact
 *                     outcome. `target` records that outcome, so if the format
 *                     changes again (and would produce something else) the
 *                     course is flagged again.
 *   expected        – the code the current format would give it ("" if a
 *                     required segment is missing, so it can't be rebuilt)
 */
function formatStatus(c, fmt) {
  const b = buildCode(courseValues(c), fmt);
  if (b.code === c.code) return { state: "ok", expected: b.code };
  const target = b.code || "!" + b.missing.join(",");
  return { state: c.ackFor === target ? "acked" : "flagged", expected: b.code, missing: b.missing, used: b.used, target };
}

/**
 * Why `code` would clash with existing course `c` (or null if it doesn't):
 *   "same"      – identical ignoring case and separators
 *   "reordered" – the same segment values in a different order
 *   "pending"   – `c` is flagged and would BECOME this code if regenerated,
 *                 so the code is effectively reserved for it. (Courses marked
 *                 OK keep their own code and don't reserve anything.)
 */
function codeConflictReason(c, code, parts, fmt) {
  const ck = normCode(code), pk = partsKey(parts);
  if (normCode(c.code) === ck) return "same";
  if (pk && c.parts && partsKey(c.parts) === pk) return "reordered";
  if (fmt) {
    const st = formatStatus(c, fmt);
    if (st.state === "flagged" && normCode(st.expected) === ck) return "pending";
  }
  return null;
}
/** First course whose code conflicts (exceptId skips the course being edited). */
function findCodeConflict(list, code, parts, exceptId, fmt) {
  return list.find(c => c.id !== exceptId && codeConflictReason(c, code, parts, fmt));
}
/** First course already using this name (case- and spacing-insensitive). */
function findNameConflict(list, name, exceptId) {
  const nk = normName(name);
  return nk ? list.find(c => c.id !== exceptId && normName(c.name) === nk) : undefined;
}

/** Natural sort by code, so SAF99 comes before SAF100. */
const sortByCode = list => [...list].sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
/** Short unique id for new courses. */
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/** Copy to the clipboard, falling back to the old execCommand trick where the
    Clipboard API is unavailable (non-HTTPS pages, some embedded frames). */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    document.body.removeChild(ta);
  }
}

/** Trigger a file download of generated text (CSV, JSON) without a server. */
function downloadFile(filename, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/** Quote one CSV cell. Values starting with = + - @ get a leading apostrophe so
    spreadsheet apps show them as text instead of running them as formulas. */
function csvCell(v) {
  let s = String(v ?? "");
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return `"${s.replace(/"/g, '""')}"`;
}
/** Rows → CSV text. The leading ﻿ (byte-order mark) makes Excel read it as UTF-8. */
const toCsv = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");

/* ────────────────────────────────────────────────────────────────────────────
   5. STORAGE
   Everything is kept in the visitor's own browser. Every read/write is wrapped
   in try/catch because storage can be blocked or full; the app keeps working
   for the session either way.
   ──────────────────────────────────────────────────────────────────────────── */
const STORAGE_KEY = "ccat_courses_v1";
const FORMAT_KEY  = "ccat_format_v1";
const THEME_KEY   = "ccat_theme";   // also read by the inline script in <head>

/** Saved courses; on a first visit (nothing saved yet) the sample courses. */
function loadCourses() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) return SAMPLE_COURSES;
    const list = JSON.parse(raw);
    return Array.isArray(list) ? list.filter(c => c && typeof c.code === "string") : [];
  } catch { return SAMPLE_COURSES; }
}
function saveCourses(courses) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(courses)); } catch {}
}

/** Saved format, validated field by field so a damaged or older saved value
    can never break the app (anything unrecognised falls back to the default). */
function loadFormat() {
  try {
    const f = JSON.parse(localStorage.getItem(FORMAT_KEY));
    if (!f || typeof f !== "object") return DEFAULT_FORMAT;
    const order = Array.isArray(f.order) && f.order.length === SEGMENT_IDS.length && SEGMENT_IDS.every(id => f.order.includes(id))
      ? f.order : DEFAULT_FORMAT.order;
    const segs = {};
    SEGMENT_IDS.forEach(id => { segs[id] = { ...DEFAULT_FORMAT.segs[id], ...(f.segs?.[id] || {}) }; });
    return {
      order, segs,
      sepMode:   ["keep", "omit", "custom"].includes(f.sepMode) ? f.sepMode : DEFAULT_FORMAT.sepMode,
      spaceMode: ["keep", "remove", "underscore"].includes(f.spaceMode) ? f.spaceMode : DEFAULT_FORMAT.spaceMode,
    };
  } catch { return DEFAULT_FORMAT; }
}
function saveFormat(fmt) {
  try { localStorage.setItem(FORMAT_KEY, JSON.stringify(fmt)); } catch {}
}

/* ────────────────────────────────────────────────────────────────────────────
   6. CSV IMPORT
   ──────────────────────────────────────────────────────────────────────────── */

/**
 * Parse CSV text into rows of trimmed cells.
 * • Detects the delimiter (comma, semicolon or tab) from the header line;
 *   Excel in many European locales saves "CSV" with semicolons.
 * • Handles quoted cells, "" escaped quotes, and line breaks inside quotes.
 * • Strips the apostrophe our own exporter adds in front of formula-like values.
 */
function parseCsv(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;   // treat \r\n as one line break
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim().replace(/^'(?=[=+\-@])/, "")));
}

/**
 * Check every row of an uploaded CSV against the catalog (and against earlier
 * rows in the same file, so a file can't contain its own duplicates).
 *
 * A row needs a Course Name plus either:
 *   • a Course Code; imported exactly as written; if its segments can be read
 *     from it (parseCode) they're stored, otherwise the course is marked
 *     `freeform` and will be flagged until someone re-codes it; or
 *   • its segments; the code is generated in the current format.
 *
 * Returns { error } when the file itself is unusable, otherwise { rows } where
 * each row is "ready" (with the course entry to add), "error" (with the
 * reason), or "example" (a template sample row, ignored).
 */
function analyzeImport(table, courses, fmt) {
  if (!table.length) return { error: "The file is empty." };
  // Map each field to its column index using the header aliases.
  const head = table[0].map(h => h.toLowerCase().replace(/[^a-z]/g, ""));
  const col = {};
  Object.entries(CSV_FIELDS).forEach(([field, aliases]) => {
    const alias = aliases.find(a => head.includes(a));
    if (alias) col[field] = head.indexOf(alias);
  });
  if (col.name === undefined) return { error: "Couldn't find a “Course Name” column. Start from the CSV template." };

  const accepted = [...courses];   // grows as rows are accepted, for in-file duplicate checks
  const rows = [];
  table.slice(1).forEach((cells, i) => {
    const line = i + 2;                               // spreadsheet line number (header is line 1)
    if (cells.every(c => !c)) return;                 // blank line: ignore silently
    const get = f => (col[f] === undefined ? "" : cells[col[f]] || "");
    const name = cleanName(get("name"));
    let code = get("code").trim();
    const out = (status, note, entry) => rows.push({ line, code, name, status, note, entry });

    if (name.toLowerCase().startsWith(EXAMPLE_PREFIX)) return out("example", "Example row; ignored.");
    if (!name) return out("error", "Missing course name.");

    // Read and validate the segment columns.
    const vals = {
      type: sanitizeCode(get("type")).trim(),
      number: get("number").replace(/\s/g, ""),
      client: get("client"),
      audience: sanitizeCode(get("audience")).trim(),
      location: get("location").toUpperCase(),
    };
    if (vals.number) {
      // Spreadsheets turn "099" into 99; padNum puts the zero back.
      if (!/^\d{1,3}$/.test(vals.number) || parseInt(vals.number, 10) === 0) return out("error", `Number “${vals.number}” must be 001–999.`);
      vals.number = padNum(vals.number);
    }
    let clientName = "";
    if (vals.client && !/^\d{1,10}$/.test(vals.client)) {
      // Not digits, so it may be a customer name: look up its code.
      const hit = CLIENTS.find(x => x.name.toLowerCase() === vals.client.toLowerCase());
      if (!hit) return out("error", `Unknown customer “${vals.client}”. Use its customer code.`);
      clientName = hit.name; vals.client = hit.code;
    } else if (vals.client) clientName = clientNameFor(vals.client);
    if (vals.location && isRegionCode(vals.location)) return out("error", `Region codes like “${vals.location}” are no longer used. Use a state code or leave it blank.`);
    if (vals.location && !STATE_CODES.has(vals.location)) return out("error", `Unknown state code “${vals.location}”.`);
    const given = Object.fromEntries(Object.entries(vals).filter(([, v]) => v));
    const hasSegs = Object.keys(given).length > 0;

    // Work out the code and its segment values.
    let parts = null, note = "";
    if (code) {
      if (hasSegs) parts = given;
      else {
        // Try the current format first, then the standard one.
        parts = parseCode(code, fmt) || parseCode(code, DEFAULT_FORMAT);
        if (parts && isRegionCode(parts.location)) delete parts.location;
        note = parts ? "Segments read from the code." : "Code doesn't follow the segment structure.";
      }
    } else {
      if (!hasSegs) return out("error", "Needs a course code, or its segments (Subject, Number, Audience…).");
      const b = buildCode(vals, fmt);
      if (!b.code) return out("error", `Can't build a code: missing ${b.missing.map(m => SEGMENTS[m].label).join(", ")}.`);
      code = b.code; parts = b.used; note = "Code generated from the segments.";
    }

    // Duplicate checks, against the catalog plus rows accepted so far.
    const clash = findCodeConflict(accepted, code, parts, undefined, fmt);
    if (clash) return out("error", `Code is already in use by ${clash.code} (“${clash.name}”).`);
    const dupName = findNameConflict(accepted, name);
    if (dupName) return out("error", `Name is already in use by ${dupName.code}.`);

    const p = parts || {};
    const entry = {
      id: makeId(), code, name,
      ...(parts ? { parts } : { freeform: true }),
      type: p.type || "",
      number: p.number ? parseInt(p.number, 10) : null,
      client: p.client ? (clientName || clientNameFor(p.client)) : "",
      clientCode: p.client || "",
      audience: p.audience || "",
      location: p.location || "",
      createdAt: new Date().toISOString(),
    };
    accepted.push(entry);
    const flagged = formatStatus(entry, fmt).state !== "ok";
    out("ready", [note, flagged && "It will be flagged: it doesn't match the current format."].filter(Boolean).join(" "), { ...entry, flagged });
  });
  return { rows };
}

// The year the project was made. The credit reads "2026" during 2026 and
// "2026-<this year>" afterwards.
const COPYRIGHT_START = 2026;

/**
 * Keeps track of today's date and re-renders when the calendar year rolls
 * over, so the credit updates even if the page is left open over New Year.
 * A timer is set for just after the next 1 January. Browsers can't wait
 * longer than about 24.8 days in one setTimeout (2^31−1 ms), so the delay is
 * capped and the hook simply re-checks whenever it wakes early.
 */
function useCurrentYear() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const nextYear = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 1);
    const t = setTimeout(() => setNow(new Date()), Math.min(nextYear - now, 2147483647));
    return () => clearTimeout(t);
  }, [now]);
  return now.getFullYear();
}
