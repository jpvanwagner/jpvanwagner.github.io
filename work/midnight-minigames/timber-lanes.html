<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COOL JUSTIN'S TIMBER LANES</title>
    <style>
        body { 
            margin: 0; background: #000000; color: #AAAAAA; 
            font-family: 'Courier New', monospace; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; user-select: none; 
        }
        #carpet-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        #header-banner {
            background: #000000; border-bottom: 4px solid #555555;
            padding: 15px 20px 10px 20px; position: relative;
            text-align: center; box-shadow: 0 4px 15px rgba(255, 85, 255, 0.4);
            animation: ambient-flicker 5s infinite; height: 60px; z-index: 10;
        }
        .cursive-neon {
            position: absolute; top: 8px; left: 50%; transform: translateX(-160px) rotate(-8deg);
            font-family: 'Brush Script MT', 'Pacifico', cursive; font-size: 28px;
            color: #FF55FF; text-shadow: 0 0 5px #FF55FF, 0 0 10px #AA00AA; z-index: 10;
        }
        .retro-neon {
            font-family: 'Arial Black', 'Impact', sans-serif; font-size: 42px;
            letter-spacing: -2px; color: #55FFFF; 
            text-shadow: 0 0 8px #55FFFF, 0 0 15px #00AAAA;
            margin-top: 5px; white-space: nowrap; word-spacing: -8px;
        }
        @keyframes ambient-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.93; } }
        .flicker-fast { animation: letter-flicker-1 6s infinite; will-change: opacity; }
        @keyframes letter-flicker-1 { 0%, 95%, 98%, 100% { opacity: 1; } 96%, 97% { opacity: 0.1; } }
        #header-banner { will-change: opacity; }
        #game-container { 
            display: flex; flex: 1; width: 100vw; position: relative; justify-content: center;
            min-height: 0; 
        }
        #sidebar { 
            width: 340px; background: #000000; border-left: 4px solid #AA0000; border-right: 4px solid #AA0000;
            padding: 15px; box-sizing: border-box; flex-shrink: 0; 
            display: flex; flex-direction: column; overflow-y: auto; z-index: 10;
        }
        #canvas-wrapper { 
            width: 700px; display: flex; justify-content: center; align-items: flex-start; 
            background: #000000; position: relative; overflow: hidden;
            border-left: 6px solid #555555; border-right: 6px solid #555555;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            min-height: 0; 
        }
        canvas { 
            background: #000000; cursor: crosshair; transform-origin: top center;
            max-width: 100%; max-height: 100%; aspect-ratio: 7/9; object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            will-change: transform;
            backface-visibility: hidden;
        }
        #crt-tv {
            position: absolute; top: 25%; left: 50%;
            transform: translateX(-50%) scale(0);
            width: 380px; height: 220px;
            background: repeating-linear-gradient(45deg, #0000AA, #0000AA 10px, #5555FF 10px, #5555FF 20px);
            border: 16px solid #555555; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,1), inset 0 0 20px #000000;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #crt-tv.active { transform: translateX(-50%) scale(1); }
        #crt-text {
            font-family: 'Arial Black', Impact, sans-serif; font-size: 60px;
            color: #FFFF55; text-shadow: 6px 6px #AA0000;
            font-style: italic; animation: pulse 0.3s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        .clipboard-header { color: #FFFFFF; text-align: center; border-bottom: 2px solid #555555; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; font-size: 16px; }
        .mode-row { display: flex; gap: 5px; margin-bottom: 10px; }
        button { background: #000000; color: #AAAAAA; border: 2px solid #555555; padding: 8px; width: 100%; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; transition: 0.2s;}
        button:hover { background: #555555; color: #FFFFFF; }
        #turnIndicator { font-size: 18px; margin: 10px 0; text-align: center; color: #55FFFF; font-weight: bold; background: #002222; padding: 5px; border: 2px solid #00AAAA; }
        #scorecard { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .player-row { display: flex; border: 2px solid #555555; background: #000000; }
        .name-box { width: 45px; background: #220000; color: #FF5555; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; border-right: 2px solid #555555;}
        .frames-container { display: grid; grid-template-columns: repeat(10, 1fr); flex: 1; }
        .frame { border-right: 2px solid #555555; position: relative; height: 36px; }
        .frame:last-child { border-right: none; }
        .frame-num { position: absolute; top: 1px; left: 2px; font-size: 9px; color: #AAAAAA; }
        .rolls { position: absolute; top: 0; right: 0; display: flex; border-bottom: 1px solid #555555; border-left: 1px solid #555555; }
        .roll-box { width: 11px; height: 11px; border-left: 1px solid #555555; text-align: center; font-size: 10px; font-weight: bold; color: #FFFF55; line-height: 11px; }
        .roll-box:first-child { border-left: none; }
        .frame-score { position: absolute; bottom: 2px; width: 100%; text-align: center; font-size: 12px; color: #FFFFFF; font-weight: bold; }
        .total-box { width: 40px; background: #002200; color: #55FF55; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; border-left: 2px solid #555555;}
        .control-help { background: #000000; border: 2px solid #555555; padding: 10px; font-size: 11px; line-height: 1.5; color: #AAAAAA; margin-bottom: 15px; }
        .highlight { color: #FFFF55; font-weight: bold; }
        .stat-panel { border: 2px solid #55FFFF; padding: 10px; background: #002222; margin-top: auto;}
        .stat-panel h4 { margin: 0 0 10px 0; color: #55FFFF; text-align: center; font-size: 14px;}
        .slider-row { margin-bottom: 10px; }
        .slider-row label { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #FFFFFF;}
        input[type=range] { width: 100%; margin-top: 5px; accent-color: #FF55FF; }
        #canvas-wrapper { width: auto; flex: 0 1 auto; }
        #canvas-wrapper canvas { height: 100%; width: auto; max-width: none; }
        #header-banner { display: flex; align-items: center; justify-content: center; gap: 14px; }
        .cursive-neon { position: static; transform: rotate(-8deg); margin-top: -6px; }
        .retro-neon { margin-top: 0; }
        @media (max-width: 900px) { #sidebar { width: 280px; padding: 10px; font-size: 13px; } .control-help { font-size: 10px; } .roll-box { width: 9px; font-size: 9px; } .frame-num { font-size: 8px; } }
        @media (max-width: 760px) { #sidebar { width: 220px; } .retro-neon { font-size: 30px; } .cursive-neon { font-size: 20px; } }
        @media (max-height: 640px) { #header-banner { height: 44px; padding-top: 8px; padding-bottom: 8px; } .retro-neon { font-size: 32px; } .cursive-neon { font-size: 22px; } .control-help { display: none; } }
        #web-setup { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.78); }
        #web-setup.on { display: flex; }
        #web-setup .box { background: #000; border: 4px solid #FF55FF; box-shadow: 0 0 24px #AA00AA; padding: 18px 22px; min-width: 300px; color: #AAAAAA; }
        #web-setup h3 { margin: 0 0 12px; color: #55FFFF; text-align: center; letter-spacing: 2px; }
        #web-setup .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
        #web-setup label { width: 34px; color: #FFFF55; font-weight: bold; }
        #web-setup input, #web-setup select { flex: 1; background: #000; color: #FFF; border: 2px solid #555; padding: 6px; font: bold 14px 'Courier New', monospace; text-transform: uppercase; }
        #web-setup .btns { display: flex; gap: 8px; margin-top: 14px; }
    </style>

<body>

<div id="carpet-layer"></div>

<div id="header-banner">
    <div class="cursive-neon">Cool Justin's</div>
    <div class="retro-neon">
        <span>TIMBER</span><span class="flicker-fast">LANES</span>
    </div>
</div>

<div id="web-setup"><div class="box"><h3 id="ws-title">NEW GAME</h3>
    <div class="row" id="ws-r1"><label>P1</label><input id="ws-n1" maxlength="3" value="P1"><select id="ws-c1"><option>BLUE</option><option>RED</option><option>GREEN</option><option>PURPLE</option></select></div>
    <div class="row" id="ws-r2"><label>P2</label><input id="ws-n2" maxlength="3" value="P2"><select id="ws-c2"><option>RED</option><option>BLUE</option><option>GREEN</option><option>PURPLE</option></select></div>
    <div class="btns"><button id="ws-go">BOWL!</button><button id="ws-x">CANCEL</button></div></div></div>
<div id="game-container">
    <div id="canvas-wrapper">
        <canvas id="game"></canvas>
        <div id="crt-tv"><div id="crt-text">STRIKE!</div></div>
    </div>
    
    <div id="sidebar">
        <div class="clipboard-header">
            LANE 7 · LEAGUE NIGHT<br>
            <span style="font-size: 12px; color: #555555;">MIDNIGHT AT THE MULTIPLEX</span>
        </div>
        
        <button id="mode1">1P PRACTICE</button>
        <div class="mode-row">
            <button id="mode2">2P HOTSEAT</button>
            <button id="mode3">1P VS AI</button>
        </div>
        <button id="bumperBtn" style="margin-bottom: 15px;">BUMPERS: OFF</button>
        
        <div id="turnIndicator">TURN: P1</div>
        <div id="scorecard"></div>
        
        <div class="control-help">
            <span class="highlight">A/D</span> Move Ball<br>
            <span class="highlight">MOUSE X</span> Aim Angle<br>
            <span class="highlight">SCROLL</span> Set Spin Arc<br>
            <span class="highlight">CLICK & HOLD</span> Power<br>
            <span class="highlight">RELEASE</span> Throw
        </div>

        <div class="stat-panel">
            <h4>[ BOWLER STATS ]</h4>
            <div class="slider-row">
                <label>BRAWN (Power) <span id="brawnVal" style="color:#FFFF55">5</span></label>
                <input type="range" id="brawnSlider" min="1" max="10" value="5">
            </div>
            <div class="slider-row">
                <label>REFLEXES (Spin Hook) <span id="finVal" style="color:#FFFF55">5</span></label>
                <input type="range" id="finSlider" min="1" max="10" value="5">
            </div>
        </div>
    </div>
</div>
