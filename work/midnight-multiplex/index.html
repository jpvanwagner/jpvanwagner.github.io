  MIDNIGHT AT THE MULTIPLEX — HOST PAGE
  ──────────────────────────────────────────────────────────────────────────
  Location: midmulti/midmulti.html

  This is the single host page for the whole project. It contains TWO scenes:

    1) The TITLE  — a pixel-art canvas rendered by core/title.js. Visible
                    while body.terminal-active is NOT set. The player picks
                    a menu item (1-6) via number keys.

    2) The TERMINAL — a DOS-style monospace terminal with a #display pre and
                      an input prompt, hosted by core/game.js. Shown when
                      body.terminal-active is set. The terminal handles:
                        - chargen (core/chargen.js)
                        - settings (core/settings.js)
                        - credits (core/credits.js)
                        - in-game placeholder screens (core/game.js)

  ── HOW THE MENU IS WIRED ──
  core/title.js's GameTitle.init(opts) callback is opts.onMenuSelect(n).
  We map the 6 slots like this:
     1 NEW GAME   → start a fresh chargen flow             show('INTRO')
     2 LOAD GAME  → resume the most recent save            resumeSavedGame()
     3 SETTINGS   → open settings screen                    show('SETTINGS')
     4 CREDITS    → open credits screen                     show('CREDITS')
     5 HELP       → open help_mechanics                     show('HELP_MECHANICS')
     6 QUIT       → the "lights come up" goodbye screen     show('QUIT')

  When the player exits any terminal screen back to title (by typing "back"
  with no history, or by certain menu actions), MultiplexGame.hide() is
  called — that removes body.terminal-active, which re-shows the canvas.

  ── HOW THE CANVAS / TERMINAL SWAP WORKS ──
  Both DOM trees co-exist. CSS rules under "TERMINAL/CANVAS VISIBILITY"
  control which one is visible based on body.terminal-active.

  ── ADDING TO THE MENU ──
  To add a new top-level menu item: edit core/title.js (the menu rendering
  block — search for "MAIN MENU") AND the switch below.

/*
═══════════════════════════════════════════════════════════════════════════
  MIDNIGHT AT THE MULTIPLEX — HOST STYLESHEET
═══════════════════════════════════════════════════════════════════════════
  Organization:
   1. THEME VARIABLES        — colors, font stack
   2. BASE LAYOUT            — body, terminal
   3. CANVAS / TERMINAL SWAP — toggle .terminal-active on body
   4. TERMINAL DETAILS       — display pre, prompt, input
   5. FULLSCREEN             — F11 sizing/centering
   6. SCROLL INDICATORS      — top/bottom "more above/below"
   7. COLOR PALETTE (16-COLOR) — the only color mode we ship
   8. DISPLAY MODES          — standard (capped) / widescreen (full-width)
   9. CRT EFFECTS            — scanlines, vignette, glow
  10. HOTKEY BAR             — fixed bottom strip
  11. RESPONSIVE             — mobile shrink

  TO CHANGE COLORS: scroll to "COLOR PALETTE" — every text class is mapped
  to a specific color. Change the hex value or add a new class.
  TO CHANGE THE FONT: edit --font in THEME VARIABLES.
  TO RESIZE TERMINAL: change --content-max-w (used by display-standard).
  TO RESIZE CANVAS: edit #stage's width/height in section 3.
═══════════════════════════════════════════════════════════════════════════
*/

/* ─────── 1. THEME VARIABLES ─────── */
/* ─────── 1. THEME VARIABLES ─────── */
:root {
  --bg: #050505;
  --fg: #d8d8d8;
  --dim: #888;
  --bright: #ffffff;
  --content-max-w: 120ch;          /* used by display-standard */
  --font: 'GrandeTerm', 'Cascadia Mono', 'Berkeley Mono', 'JetBrains Mono', 'IBM Plex Mono',
          'Consolas', 'Courier New', ui-monospace, monospace;

  /* ── UI SCALING ─────────────────────────────────────────────────────────
     --ui-scale         scale factor (integer for fit/manual, fractional for
                        fill). Set by core/display.js (DisplayManager.apply()).
                        Drives both the title canvas display size and the
                        terminal font size below.
     --term-font-size   Pixel value derived from --ui-scale by JS.
     --ui-maxwidth      Max width of the terminal column. '1400px' in fit/manual
                        modes, '96vw' in fill mode (uses the whole screen).
     ─────────────────────────────────────────────────────────────────────── */
  --ui-scale: 2;
  --term-font-size: 14px;
  --ui-maxwidth: 1760px;
}

* { box-sizing: border-box; }

/* When a specific resolution is selected in windowed mode, present the game
   at exactly that size, centered, with letterbox bars around it. */
body.fixed-resolution {
  width: var(--ui-fixed-w);
  height: var(--ui-fixed-h);
  margin: 0 auto;
  overflow: hidden;
  box-shadow: 0 0 0 100vmax #000;   /* letterbox the surrounding area */
}

/* ─────── 2. BASE LAYOUT ─────── */
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: var(--term-font-size);
  line-height: 1.2;
  min-height: 100vh;
  overflow-x: auto;
}

/* ─────── 2. BASE LAYOUT ─────── */
/* The body holds BOTH the canvas (#stage) and the terminal (#terminal).
   Section 3's rules show one and hide the other based on .terminal-active. */
#terminal {
  padding: 8px 24px calc(var(--term-font-size) * 3.8 + 22px);   /* bottom room scales with font to hug the fixed bottom stack (#7/#13) — no fixed dead gap (#2) */
  /* Center the terminal column horizontally in the browser window at every
     scale (not just fullscreen). Cap the column width so very wide monitors
     don't stretch the text to silly proportions; the terminal renders at a
     fixed character count, so giving it room past ~1400px just adds blank
     space.  Both margins set to auto plus a max-width = centered. */
  margin: 0 auto;
  max-width: var(--ui-maxwidth);
  width: 100%;
  box-sizing: border-box;
}

/* ─── FULLSCREEN MODE ───────────────────────────────────────────────────
   When the browser enters fullscreen (F11 or system request), the document
   element itself is the fullscreen root. We center the terminal inside
   that, give it breathing room, and scale font size up on roomy monitors.

   The terminal output is rendered at a fixed character width (108-120 cols
   depending on screen). On wide displays we want it CENTERED horizontally
   so the text doesn't crowd the left edge.

   Browser-side, html:fullscreen and body:fullscreen are both addressable
   via the :fullscreen pseudo-class. We use :fullscreen on body for the
   layout flip and on html for the centering wrapper.
*/
html:fullscreen,
body:fullscreen {
  background: var(--bg);
  width: 100vw;
  height: 100vh;
}
:fullscreen #terminal {
  /* center horizontally; #1 — honor --ui-maxwidth (now 1760px) instead of a
     hard 1280 cap, so chargen and other screens actually fill the screen. */
  margin: 0 auto;
  max-width: var(--ui-maxwidth);
  padding: 24px 32px 60px;
}
/* Scale font up incrementally in fullscreen via the same --term-font-size
   variable JS already sets. The variable's value comes from
   applyDisplayScale() which re-runs on every window resize (and fullscreen
   transitions trigger a resize event), so we don't need an override here.

   This used to be a CSS clamp() that ignored the user's chosen display
   scale, which created a conflict in fullscreen mode. Removed. */
/* Scroll indicators look better in fullscreen with more padding */
:fullscreen .scroll-indicator {
  padding: 6px 0;
  font-size: 0.9em;
}

#display {
  margin: 0;
  white-space: pre;
  font-family: inherit;
  font-size: inherit;
  /* line-height MUST be 1.0 here: the UI frame is drawn with box-drawing
     glyphs (│ ─ ├ ┤ …). At the inherited 1.2 the vertical │ glyphs only fill
     ~1.0 of the row, leaving a gap between rows so every vertical frame line
     looked broken/“misaligned”. 1.0 makes the segments meet end-to-end. */
  line-height: 1.0;
}

#prompt-line {
  margin: 0;
  padding: 6px 16px;
  display: flex;
  align-items: baseline;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  background: rgba(0,0,0,0.9);
  /* #8: border-top removed — it floated as a line over the map's bottom */
}
#prompt { color: var(--bright); margin-right: 4px; user-select: none; font-weight: bold; }
/* #5: when the prompt is closed, dim it and show a hint so the player knows to
   press Enter to type. Movement keys flow to the game while it's closed. */
#prompt-line.prompt-closed { opacity: 0.5; }
#prompt-line.prompt-closed #prompt::after {
  content: " [Enter to type]";
  font-weight: normal;
  font-size: 0.85em;
  opacity: 0.7;
}
#input {
  /* #10: width tracks content (synced in JS) so the block cursor sits right
     after the typed text rather than at the far edge of the row. */
  width: 1ch;
  max-width: 100%;
  background: transparent;
  color: var(--fg);
  border: none;
  outline: none;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  caret-color: transparent;
  padding: 0;
  min-width: 0;
  font-weight: bold;
}
/* #3/#10: a solid block cursor like a retro terminal — it occupies the full
   character CELL at the insertion point (where the next typed character will
   land), not a sliver after the text. Full 1ch wide, line-height tall, no
   margin so it lands on the monospace grid. Blinks fast. */
#cursor-block {
  display: inline-block;
  width: 1ch;
  height: 1.1em;
  background: var(--fg);
  margin: 0;
  vertical-align: text-bottom;
  animation: cursor-blink 0.5s steps(1) infinite;
}
#prompt-line.prompt-closed #cursor-block { display: none; }
@keyframes cursor-blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
::selection { background: var(--fg); color: var(--bg); }

/* ─────── 3. CANVAS / TERMINAL SWAP ─────── */
/* The title canvas. Internal pixel resolution is FIXED at 384×288 — that's
   the resolution title.js paints into. Display size is multiplied by
   --ui-scale (set by applyDisplayScale() in core/game.js).
     --ui-scale = 2  →  768 × 576   (default; fits 800×600 viewport)
     --ui-scale = 3  →  1152 × 864  (1280×720+ viewports)
     --ui-scale = 4  →  1536 × 1152 (1920×1080+ viewports)
   image-rendering: pixelated keeps the upscale crisp at integer scales. */
#stage {
  width:  calc(384px * var(--ui-scale));
  height: calc(288px * var(--ui-scale));
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  margin: 24px auto;
}

/* Default (title visible): canvas shown, terminal hidden. */
body:not(.terminal-active) #stage     { display: block; }
body:not(.terminal-active) #terminal,
body:not(.terminal-active) #hotkey-bar,
body:not(.terminal-active) #prompt-line,
body:not(.terminal-active) #controls-bar,
body:not(.terminal-active) .scroll-indicator { display: none; }

/* When the terminal is up: canvas hidden, terminal + chrome shown. */
body.terminal-active #stage     { display: none; }
body.terminal-active #terminal  { display: block; }
body.terminal-active #hotkey-bar{ display: block; }

/* When the title canvas is shown, lay the body out as a centered column so
   the canvas sits in the middle of the viewport. */
body:not(.terminal-active) {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ─────── 4. TERMINAL DETAILS ─────── */
.scroll-indicator {
  position: fixed;
  left: 0; right: 0;
  text-align: center;
  font-family: inherit;
  font-size: 1.15em;
  font-weight: bold;
  letter-spacing: 6px;
  color: #000;
  background: var(--bright);
  padding: 6px 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 0 14px rgba(120,255,160,0.6);
}
#scroll-up   { top:    0; }
/* #5: sit the "more below" banner ABOVE the fixed bottom stack (prompt +
   controls + F-keys), whose combined height is ~120px, so it isn't hidden. */
#scroll-down { bottom: 124px; }
.scroll-indicator.visible { opacity: 1; animation: scroll-pulse 0.9s ease-in-out infinite; }
@keyframes scroll-pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

/* ─────── 5. FULLSCREEN ─────── */
/* Already covered inside the section-2 CSS block via :fullscreen rules.    */

/* ─────── 7. COLOR PALETTE (16-COLOR) ─────── */
/* This is the ONLY color mode we ship. The body has the .color-16 class
   permanently. To add a new colored region: pick a class name, wrap text
   via span('myclass', 'text'), and add a rule here.                       */
body { color: var(--fg); }

/* 16-color: full DOS palette with bright variants */
body.color-16 .bulb         { color: #ffff55; }
body.color-16 .bulb-dim     { color: #aaaa00; }
body.color-16 .marquee-frame{ color: #ff5555; }
body.color-16 .title-text   { color: #ffffff; }
body.color-16 .title-art    { color: #ffff55; }
body.color-16 .menu-title   { color: #ffff55; }
body.color-16 .menu-item    { color: #ffffff; }
body.color-16 .menu-number  { color: #55ff55; }
body.color-16 .popcorn-glass{ color: #aaaaaa; }
body.color-16 .popcorn      { color: #ffaa00; }
body.color-16 .popcorn-kernel{color: #ffff55; }
body.color-16 .icee-glass   { color: #aaaaaa; }
body.color-16 .icee         { color: #55ffff; }
body.color-16 .icee-blue    { color: #5555ff; }
body.color-16 .icee-red     { color: #ff5555; }
body.color-16 .register     { color: #aaaaaa; }
body.color-16 .counter      { color: #aa5500; }
  .tut-coach{color:#5fd6e6;}   /* WAKE_UP tutorial/coaching voice — stands out vs world text */
body.color-16 .accent       { color: #ffff55; }
body.color-16 .npc-shirt    { color: #ffffff; }
body.color-16 .npc-bowtie   { color: #555555; }   /* black bowtie reads dark grey on dark bg */
body.color-16 .npc-vest     { color: #aa0000; }   /* burgundy */
body.color-16 .frame        { color: #aaaaaa; }
body.color-16 .stat-name    { color: #aaaaaa; }
/* #14: the time log uses slightly smaller text so more history fits and long
   entries wrap word-by-word without crowding. Color tracks stat-name. */
.log-text { font-size: 0.86em; color: #aaaaaa; }
body.color-16 .log-text { color: #999999; }
body.color-16 .stat-value   { color: #ffff55; }
body.color-16 .ok           { color: #55ff55; }
body.color-16 .warn         { color: #ff5555; }
body.color-16 .speech       { color: #ffffff; }
body.color-16 .wall         { color: #555555; }   /* dim grey wall fill */
body.color-16 .floor        { color: #aa5500; }   /* warm brown floor (carpet hint) */
body.color-16 .cab-shadow   { color: #555555; }   /* dim grey shadow edge */
body.color-16 .greyed-out   { color: #666666; text-decoration: line-through; }

/* ─────── 8. DISPLAY MODES ─────── */
body.display-standard #terminal { max-width: var(--content-max-w); margin: 0 auto; }
body.display-widescreen #terminal { max-width: none; margin: 0 auto; }

/* ─────── 9. CRT EFFECTS ─────── */
body.crt {
  text-shadow: 0 0 1px currentColor, 0 0 4px rgba(255,255,255,0.10);
}
body.crt::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,0.20) 3px, rgba(0,0,0,0) 4px);
  z-index: 100;
}
body.crt::after {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center,
    rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  z-index: 101;
}

/* ─────── 10. HOTKEY BAR ─────── */
/* #7/#13: the fixed bottom stack holds the prompt, the controls bar, and the
   F-key hotkey bar, pinned to the viewport bottom in that order. */
/* #12: live map canvas layer. Positioned by JS (mountMapCanvas) over the
   MID-upper region of the in-game frame; hidden unless a map screen is active. */
#game-container {
  position: absolute;
  display: none;
  overflow: hidden;
  z-index: 5;            /* above the <pre> text background, below bottom-stack(50) */
  background: #0a0a1a;
  pointer-events: auto;
}
body.map-screen #game-container { display: block; }
#game-container canvas { display: block; width: 100% !important; height: 100% !important; }
/* #9: keep engine dialog/modal panels INSIDE the map subwindow and scroll their
   body instead of stretching past the frame. #game-container is position:absolute
   + overflow:hidden, so these %/calc sizes are relative to IT. Panels become a
   flex column: the win95 title bar stays pinned and .dlg-body scrolls long text. */
#game-container > #eavesdrop-ui,
#game-container > #usher-ui,
#game-container > #shop-ui,
#game-container > #pickup-ui,
#game-container > #gap-ui,
#game-container > #dialogue {
  box-sizing: border-box;
  max-width: calc(100% - 20px) !important;
  max-height: calc(100% - 20px) !important;
  display: flex;
  flex-direction: column;
}
#game-container > #eavesdrop-ui .dlg-title,
#game-container > #usher-ui .dlg-title,
#game-container > #dialogue .dlg-title { flex: 0 0 auto; }
#game-container > #eavesdrop-ui .dlg-body,
#game-container > #usher-ui .dlg-body,
#game-container > #dialogue .dlg-body { overflow-y: auto; min-height: 0; }

#bottom-stack {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
}
/* #13: controls bar (move/interact hints) — shown only on playable map screens
   via body.map-screen; sits between the prompt (above) and the F-key bar. */
#controls-bar {
  display: none;
  padding: 6px 16px;
  background: rgba(0,0,0,0.88);
  font-family: var(--font);
  font-size: clamp(9px, 1.15vw, 14px);   /* shrinks in narrow windows/embeds instead of clipping */
  color: #9fb6c9;
  white-space: nowrap;
  overflow-x: auto;
}
body.map-screen #controls-bar { display: block; }
#controls-bar .ck-key { color: var(--bright); font-weight: bold; padding: 0 2px; }
#controls-bar .ck { color: var(--fg); }
#controls-bar .ck-sep { color: #444; margin: 0 9px; }
/* #3: COMMAND TICKER — a bottom frame listing the words you can TYPE right now
   (basic verbs, toggleable in Settings, + any scene-specific actions). If the
   line is wider than the screen it scrolls like a TV ticker (the .tk-track is
   duplicated and translated -50% so the loop is seamless). Words are clickable —
   a click runs that command. HOW TO MODIFY: edit updateCommandTicker() in
   core/game.js (basics list, scene words via window.__sceneWords, speed). */
#command-ticker {
  display: none;
  padding: 4px 16px;
  background: rgba(0,0,0,0.82);
  font-family: var(--font);
  font-size: var(--term-font-size);   /* PORTFOLIO EDIT: same size as the rest of the text (was 9 to 12px) */
  color: #8aa0b2;
  white-space: nowrap;
  overflow: hidden;            /* the ticker scrolls inside; no scrollbar */
}
body.map-screen #command-ticker { display: block; }
#command-ticker .tk-track { display: inline-block; white-space: nowrap; will-change: transform; }
#command-ticker .tk-track.scrolling { animation: tkScroll linear infinite; }
#command-ticker:hover .tk-track.scrolling { animation-play-state: paused; }  /* pause to read/click */
#command-ticker .tk-label { color: #556; margin-right: 8px; text-transform: uppercase; letter-spacing: 1px; }
#command-ticker .tk-word { color: var(--bright); font-weight: bold; cursor: pointer; }
#command-ticker .tk-word:hover { text-decoration: underline; }
#command-ticker .tk-scene { color: #ffd23f; }   /* scene-specific actions stand out */
#command-ticker .tk-sep { color: #3a3a3a; margin: 0 10px; }
@keyframes tkScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
#hotkey-bar {
  /* no longer self-fixed — it lives inside #bottom-stack now */
  padding: 8px 16px;
  background: rgba(0,0,0,0.85);
  font-family: var(--font);
  font-size: clamp(10px, 1.25vw, 15px);  /* shrinks in narrow windows/embeds instead of clipping */
  font-weight: 500;
  color: #aaa;
  white-space: nowrap;
  overflow-x: auto;
}
#hotkey-bar .hk { color: var(--fg); }
#hotkey-bar .hk-key {
  color: var(--bright);
  font-weight: bold;
  /* Tiny breathing room around each keycap label */
  padding: 0 3px;
}
#hotkey-bar .hk-sep { color: #444; margin: 0 10px; }

/* ─────── 10b. MINIGAME OVERLAY ─────────────────────────────────────────
   When a minigame is launched in-game (openMinigame()), it loads in an
   iframe overlay that covers the whole viewport. The top bar gives the
   player a clear "Return" button to come back to the in-game screen.
   See `openMinigame()` and `closeMinigame()` in core/game.js. */
#minigame-overlay {
  display: none;                /* shown by JS when active */
  position: fixed;
  inset: 0;
  z-index: 1000;
  flex-direction: column;
  align-items: center;          /* center the capped frame in the letterbox */
  background: #000;
}
/* The bar spans the centered game-area width, matching the frame below it. */
#minigame-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: rgba(0, 0, 0, 0.9);
  border-bottom: 1px solid rgba(170, 170, 170, 0.4);
  color: #ddd;
  font-family: var(--font);
  font-size: 14px;
  flex: 0 0 auto;
  width: 100%;
  max-width: var(--ui-maxwidth);
  box-sizing: border-box;
}
#minigame-title {
  font-weight: bold;
  letter-spacing: 1px;
  color: #fff;
}
#minigame-return-btn {
  background: #222;
  color: #fff;
  border: 1px solid rgba(170, 170, 170, 0.5);
  padding: 6px 14px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 2px;
}
#minigame-return-btn:hover { background: #333; border-color: #fff; }
#minigame-frame {
  flex: 1 1 auto;
  border: 0;
  width: 100%;
  max-width: var(--ui-maxwidth);   /* #2: same game-area box as the terminal */
  background: #000;
}
/* Hide the terminal-side UI while a minigame is active. */
body.minigame-active #hotkey-bar,
body.minigame-active .scroll-indicator { display: none; }

/* Also disable the CRT compositing layers while a minigame is running.
   The scanline pattern and vignette are full-viewport, fixed-position,
   high-z-index overlays — they sit above the iframe and have to be
   re-composited every paint. That was knocking ~10–30% off the bowling
   minigame's framerate vs. running it as a standalone file.  When the
   minigame closes, body.minigame-active is removed and the CRT effect
   returns automatically. */
body.minigame-active.crt::before,
body.minigame-active.crt::after { display: none; }

/* PERFORMANCE: when a minigame is playing inside the iframe overlay, we
   hide the parent-page CRT effects (scanlines, vignette). Those are full-
   viewport pseudo-elements that the browser has to composite over every
   frame the iframe paints — at 60fps that means re-blitting a huge
   scanline pattern + radial gradient continuously on top of the canvas
   below, which costs framerate. Bowling went from buttery to choppy
   solely because of this. The minigame still gets its own look. */
body.minigame-active.crt::before,
body.minigame-active.crt::after { display: none; }
body.minigame-active.crt { text-shadow: none; }

/* ─────── 10c. INTRO CRAWL ─────────────────────────────────────────────
   Authentic Star-Wars-style 3D perspective scroll for the New Game intro.
   The viewport establishes a 3D perspective; the crawl plane is laid back
   on the X axis (rotateX) so text genuinely recedes into the distance as
   it scrolls up — close & large at the bottom, small & vanishing at the
   top. Retro console font preserved.

   To change the text: edit CRAWL_PARAGRAPHS in core/chargen.js.
   To change scroll speed: edit the `intro-crawl` animation duration below.
   The pulse-prompt delay (.intro-pulse) is kept in sync with that duration. */
.intro-crawl-viewport {
  position: relative;
  display: block;
  /* #2: taller stage (in viewport height) so the crawl has real room to fly
     away and the text reads large, independent of the terminal font size. */
  height: 70vh;
  min-height: 30em;
  margin: 0.5em 0;
  overflow: hidden;
  /* The perspective makes child transforms (rotateX, translateZ) render
     with real depth foreshortening. Smaller = more dramatic recession. */
  perspective: 340px;
  perspective-origin: 50% 0%;       /* vanishing point near the top */
  /* Fade to background near the top so receding text dissolves into the
     distance rather than hard-clipping at the edge. */
  mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 100%);
}
.intro-crawl {
  position: absolute;
  left: 0; right: 0;
  top: 100%;                        /* start fully below the viewport */
  margin: 0 auto;
  width: 100%;                      /* #10: full width so lines run long */
  font-family: var(--font);         /* keep the pixel/console look */
  color: #fde36a;                   /* warm amber, like the films */
  text-align: center;
  white-space: normal;              /* override <pre>'s pre-formatting */
  transform-origin: 50% 100%;
  /* #2: a gentler lay-back so the text reads large and wide rather than
     squished into a thin receding ribbon. */
  transform: rotateX(38deg);
  /* ========================================================================
     TITLE / INTRO CRAWL SPEED  (fine-tune here)
     -----------------------------------------------------------------------
     The single number below is the crawl DURATION: bigger = SLOWER. To make
     the crawl X% slower, multiply it by (1 + X/100) — e.g. 20% slower:
     170 * 1.2 = 204. IMPORTANT: the end-of-crawl "pulse" timings further down
     (search: intro-pulse) are DELAYS keyed to this duration (~90% of it), so
     if you change this, scale those two delays by the same factor.
     ======================================================================== */
  animation: intro-crawl 170s linear forwards;   /* #2: ~20% slower again (142 -> 170; was 118) */
}
/* TITLE BLOCK at the top of the crawl content (scrolls up first).
   #2: sized in viewport-width units so it's big on any screen. */
.intro-title-block {
  font-size: clamp(3.4rem, 9.5vw, 7.5rem);
  font-weight: bold;
  color: #fff2b0;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 0.7em;
  line-height: 1.05;
}
.intro-title-line { padding: 0; }
/* #6c: "AT THE" is rendered noticeably smaller than the rest of the title. */
.intro-title-small { font-size: 0.5em; letter-spacing: 2px; vertical-align: baseline; }
.intro-title-spacer { height: 1.2em; }

/* BODY CRAWL TEXT — #6a/#6d: a smaller font so each line carries far more text,
   LEFT-ALIGNED for readability, but the whole text column is a fixed width
   centered horizontally under the title (so it reads like film-crawl prose, not
   a centered ragged blob). */
.intro-body {
  width: 92%;
  max-width: 84em;        /* wider column so each line carries ~2x the words */
  margin: 0 auto;          /* center the block */
  text-align: left;        /* #6d: left-align the lines within the block */
}
.intro-line  { font-size: clamp(1.35rem, 2.3vw, 2.25rem); line-height: 1.5; margin-bottom: 0.22em; }   /* batch: larger for readability (still wide lines) */
.intro-blank { height: 0.7em; }

@keyframes intro-crawl {
  /* translateZ recedes the plane into the distance while translateY scrolls
     it up. Combined with the parent perspective + rotateX, this is the
     classic opening-crawl trajectory. Larger Z = flies further away. */
  from { transform: rotateX(38deg) translateY(0)      translateZ(0); }
  to   { transform: rotateX(38deg) translateY(-320%)  translateZ(-520px); }
}

/* Pulsing "type a command" prompt. Appears as the crawl is finishing its
   recession. Delay is tuned to the 95s crawl above — it begins fading in a
   few seconds BEFORE the crawl fully ends so there's no dead gap where the
   screen is empty and the player is left wondering what to do. */
.intro-pulse {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font);
  color: var(--bright);
  opacity: 0;
  pointer-events: none;
  animation: intro-pulse-show 1.2s ease-out 153s forwards,
             intro-pulse-throb 2.0s ease-in-out 154s infinite;   /* #2: pulse DELAYS — keep at ~90% of the crawl duration above (170s -> ~153s). Scale these if you change the crawl speed. */
}
.intro-pulse-line  { font-size: 1.2em; letter-spacing: 2px; }
.intro-pulse-line b { color: #fbbf24; }
.intro-pulse-sub   { font-size: 0.85em; opacity: 0.75; margin-top: 0.6em; letter-spacing: 1px; }
.intro-pulse-sub i { font-style: normal; color: #fbbf24; }
@keyframes intro-pulse-show {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes intro-pulse-throb {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1;    }
}

/* ─────── 11. RESPONSIVE FALLBACK ─────── */
/* Below 720 px wide we hard-cap things — the JS-driven --ui-scale already
   picks scale 2 as the minimum auto value, but on a 360 px-wide phone
   that's 768 px wide title canvas in a 360 px window. This rule lets the
   canvas shrink to viewport width as a last-resort fallback (with pixel
   art it'll be slightly soft, but the alternative is horizontal scroll). */
@media (max-width: 720px) {
  html, body { font-size: 11px; }
  #stage { width: 100vw; height: auto; max-width: 768px; }
  #terminal { padding: 10px 10px 50px; }
  #hotkey-bar { font-size: 10px; padding: 5px 8px; }
}

  /* ── RETRO PIXEL-ART IN-GAME CURSORS (chunky arrow + pointer hand) ──────────
     Applied while the game is active (body.terminal-active): a blocky white arrow
     replaces the OS pointer, and a pixel pointer-hand shows on clickable things.
     HOW TO MODIFY:
       • Restyle the art: edit + run tools/gen_cursors.py, then paste the new
         base64 over the data URIs below (source PNGs in assets/cursors/).
       • Scope to ONLY the 3D gameplay view: swap `body.terminal-active` for
         `body.map-screen` on both rules.
       • The numbers after url(...) are the HOTSPOT (x y) — arrow tip is 0 0;
         the hand's fingertip is ~10 0. The trailing keyword (auto / pointer) is
         the fallback if the image can't load. */
  body.terminal-active,
  body.terminal-active #game-container,
  body.terminal-active #game-container canvas {

    cursor: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABoAAAAgCAYAAAAMq2gFAAAAk0lEQVR4nO1VQQrAIAyrY0/wDf3/e/oG/7CdclhRFKxhiDlWJaSxaRKHnPPjayIipZRUq4/imnkcQmRmYmbriaJxiA4Rn+gevdhKDKCXHP9RNJoOqvpR7BXyFfU86AHKVbV6TlOUvJKoxIYyeMX3KHL31LBfBPE8wq/AZK/yar/W8edotVf7tY6X3q2D2f0E0NP7BUVgM3uX+wsvAAAAAElFTkSuQmCC') 6 0, pointer;

  /* ── WIN95-CLEAN IN-GAME MODALS/POPUPS (#9 batch) ──────────────────────────
     Shared clean Windows-95 styling for on-map popups/modals. Use .win95-win for
     the panel, .win95-title for the title bar, .win95-body for content, .win95-btn
     for buttons, and .win95-banner for a one-line toast (e.g. the #msg banner).
     HOW TO MODIFY: tweak the bevel (border light=#dfdfdf / dark=#404040) or the
     title gradient (#000080 -> #1084d0) here and every modal updates. */
  .win95-win{background:#c0c0c0;color:#000;border:2px solid #dfdfdf;border-right-color:#404040;border-bottom-color:#404040;box-shadow:1px 1px 0 #000,2px 2px 7px rgba(0,0,0,0.45);font:27px/1.5 "GrandeRetro","MS Sans Serif",Tahoma,Geneva,sans-serif;}   /* batch: larger dialogue/modal text */
  .win95-title{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 7px;font-size:21px;letter-spacing:.3px;}
  .win95-body{padding:12px 14px;}
  .win95-btn{background:#c0c0c0;color:#000;border:2px solid #dfdfdf;border-right-color:#404040;border-bottom-color:#404040;padding:4px 14px;min-width:66px;cursor:pointer;font:bold 21px "GrandeRetro","MS Sans Serif",Tahoma,sans-serif;}
  .win95-btn:active{border-color:#404040;border-right-color:#dfdfdf;border-bottom-color:#dfdfdf;}
  .win95-btn:focus{outline:1px dotted #000;outline-offset:-4px;}
  .win95-banner{display:inline-block;background:#c0c0c0;color:#000;border:2px solid #dfdfdf;border-right-color:#404040;border-bottom-color:#404040;box-shadow:1px 1px 0 #000;font:bold 24px "GrandeRetro","MS Sans Serif",Tahoma,sans-serif;padding:8px 16px;letter-spacing:.3px;}
</style>
</head>

<!-- body has .color-16 (the single color palette we ship) and .crt (CRT glow
     effect). Adding .terminal-active flips us from title canvas to terminal. -->
<body class="color-16 display-widescreen crt">

  <!-- ─── TITLE SCREEN (canvas) ─────────────────────────────────────────── -->
  <!-- 384x288 internal pixel resolution. DON'T change without also editing
       the W/H constants inside core/title.js. -->
  <canvas id="stage" width="384" height="288"></canvas>

  <!-- ─── TERMINAL (everything in-game) ─────────────────────────────────── -->
  <!-- Hidden by default. Made visible by adding .terminal-active to body
       (MultiplexGame.show() handles this). -->
  <div id="scroll-up"   class="scroll-indicator">▲▲▲  more above  ▲▲▲</div>
  <div id="scroll-down" class="scroll-indicator">▼▼▼  more below  ▼▼▼</div>

  <div id="terminal">
    <pre id="display"></pre>
  </div>

  <!-- #7/#13: the command prompt, the (map-screen) controls bar, and the F-key
       hotkey bar are stacked in a single FIXED container pinned to the bottom of
       the viewport, so the prompt is always reachable. Order top→bottom:
       command prompt → controls bar → F-key bar. -->
  <div id="bottom-stack">
    <div id="prompt-line">
      <span id="prompt">&gt;</span>
      <span id="input-wrap" style="position:relative; flex:1; min-width:0; display:inline-flex; align-items:center;">
        <input id="input" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" aria-label="Command prompt">
        <span id="cursor-block"></span>
      </span>
    </div>
    <div id="command-ticker"><div class="tk-track"></div></div>
    <div id="controls-bar"></div>
    <div id="hotkey-bar"></div>
  </div>

  <!-- #12: the live 3D map canvas mounts here, positioned over the MID-upper
       region of the in-game ASCII frame when a map screen is active. Hidden
       otherwise. The engine appends its <canvas> into this element and sizes to
       it (see engine.js getViewSize). -->
  <div id="game-container"></div>

  <!-- ─── SCRIPT LOAD ORDER (matters!) ──────────────────────────────────── -->
  <!-- 1) game.js     — defines State, sfx, Screens, helpers; exposes MultiplexGame
       2) settings.js — defines Screens.SETTINGS (uses State, render, etc)
       3) credits.js  — defines Screens.CREDITS  (uses span, center, header)
       4) chargen.js  — defines all chargen Screens + data tables
       5) title.js    — the canvas title; LAST so GameTitle.init() is the
                        last thing to fire on page load. -->
  <script src="stats/names.js"></script>
  <script src="core/gameData.js"></script>
  <script src="core/progression.js"></script>
  <script src="core/items.js"></script>
  <script src="core/tokens.js"></script>
  <script src="core/display.js"></script>
  <script src="music/crawlMusic.js"></script>
  <script src="music/titleMusic.js"></script>
  <script src="core/game.js"></script>
  <script src="core/debugroom.js"></script>
  <script src="core/tutorial.js"></script>
  <script src="core/settings.js"></script>
  <script src="core/credits.js"></script>
  <script src="core/chargen.js"></script>
  <script src="core/title.js"></script>
  <!-- Per-location screen modules. Loaded after core/game.js so they can use
       its helpers (renderGameplayUI, goto, advanceTime, etc).
       To add a new location, drop a file in core/locations/ and add it here.
       See core/locations/_README.js for the pattern. -->
  <script src="core/locations/_helpers.js"></script>
  <script src="core/locations/multiplex.js"></script>

  <!-- #12: 3D ENGINE + dependencies for the embedded in-UI map view. Mirrors
       the load order a Mapster export uses. THREE r128 from CDN; the engine
       modules expose initEngine() + window.engine* hooks. These are inert until
       a map screen mounts the canvas (mountMapCanvas in game.js). -->
  <script src="lib/three.min.js"></script>
  <script src="Mapster/core/helpManager.js"></script>
  <script src="core/cameraControls.js"></script>
  <script src="vfx/skyboxManager.js"></script>
  <script src="vfx/lightingManager.js"></script>
  <script src="vfx/fogManager.js"></script>
  <script src="vfx/weatherManager.js"></script>
  <script src="vfx/rain.js"></script>
  <script src="vfx/snow.js"></script>
  <script src="textures/floor.js"></script>
  <script src="textures/wall.js"></script>
  <script src="core/windowPainter.js"></script>
  <script src="core/dialogueRuntime.js"></script>
  <script src="core/engine.js"></script>
  <!-- #12: preloaded map data globals (window.__MAPDATA_*) so the in-UI map view
       works under file:// without fetch/CORS. -->
  <script src="Mapster/maps/tutorial/parking_lot.data.js"></script>   <!-- #7: parking-lot tutorial map preload -->
  <script src="Mapster/maps/tutorial/sunrise.data.js"></script>   <!-- #5: Sunrise multiplex map preload -->
  <script src="core/demo.js"></script>   <!-- web-demo layer: click-to-play gate + END OF DEMO (demo build only) -->

  <script>
    // ─────────────────────────────────────────────────────────────────────
    // WIRE THE TITLE MENU TO THE TERMINAL
    // ─────────────────────────────────────────────────────────────────────
    // title.js calls onMenuSelect(n) when the player presses 1-6 on the menu.
    // We gate by body.terminal-active because title.js's number-key listener
    // is window-level and would otherwise fire while the player is typing
    // numbers into a chargen input.
    //
    // Each number maps to a MultiplexGame entry:
    //   1 NEW GAME  → start a brand-new chargen flow (clears character first)
    //   2 LOAD GAME → resume the most recent save (no save => flash and stay)
    //   3 SETTINGS  → settings screen
    //   4 CREDITS   → credits screen
    //   5 HELP      → help_mechanics screen
    //   6 QUIT      → "lights come up" goodbye screen

    // #7: a brief "BRICKROAD PRESENTS" splash plays on the title canvas before
    // the main title scene. Goosebumps-esque horror vibe (dark, sickly green, a
    // red flicker + scanlines). Click / any key skips it. HOW TO MODIFY: tune the
    // DUR_* timings or the colors below; calls done() when finished.
    function playBrickroadSplash(canvas, done) {
      if (!canvas || !canvas.getContext) { done && done(); return; }
      // #2: kick off the spooky-pop title theme RIGHT HERE, so it plays with the
      // Brickroad splash and carries through the title menu (no long delay). If the
      // browser is still blocking autoplay, TitleMusic arms itself to start on the
      // first key/click (e.g. the "skip splash" key) — see music/titleMusic.js.
      try { if (window.TitleMusic) window.TitleMusic.start(); } catch (e) {}
      const g = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const DUR_IN = 700, DUR_HOLD = 1500, DUR_OUT = 650;
      const TOTAL = DUR_IN + DUR_HOLD + DUR_OUT;
      const t0 = performance.now();
      let raf = 0, finished = false;
      const cleanup = () => {
        if (finished) return; finished = true;
        cancelAnimationFrame(raf);
        window.removeEventListener('keydown', skip, true);
        canvas.removeEventListener('pointerdown', skip, true);
        done && done();
      };
      const skip = (e) => { if (e) { e.preventDefault && e.preventDefault(); } cleanup(); };
      window.addEventListener('keydown', skip, true);
      canvas.addEventListener('pointerdown', skip, true);
      const frame = (now) => {
        const t = now - t0;
        if (t >= TOTAL) { cleanup(); return; }
        // opacity envelope: fade in, hold, fade out
        let a = 1;
        if (t < DUR_IN) a = t / DUR_IN;
        else if (t > DUR_IN + DUR_HOLD) a = 1 - (t - DUR_IN - DUR_HOLD) / DUR_OUT;
        a = Math.max(0, Math.min(1, a));
        // a slow, uneasy flicker on the title
        const flick = 0.82 + 0.18 * Math.sin(t * 0.013) * Math.sin(t * 0.047);
        g.fillStyle = '#05060a'; g.fillRect(0, 0, W, H);
        // faint vignette
        const vg = g.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, W * 0.7);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
        g.fillStyle = vg; g.fillRect(0, 0, W, H);
        g.save();
        g.globalAlpha = a;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        // "BRICKROAD" — sickly green with a red ghost behind it
        g.globalAlpha = a * 0.45 * flick;
        g.fillStyle = '#7a1020';
        g.font = 'bold 34px Georgia, "Times New Roman", serif';
        g.fillText('BRICKROAD', W / 2 + 2, H / 2 + 4);
        g.globalAlpha = a * flick;
        g.fillStyle = '#9fd17a';
        g.fillText('BRICKROAD', W / 2, H / 2);
        // a thin marquee rule under it
        g.globalAlpha = a * 0.5;
        g.strokeStyle = '#3a4a33'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(W / 2 - 90, H / 2 + 26); g.lineTo(W / 2 + 90, H / 2 + 26); g.stroke();
        g.globalAlpha = a * 0.55;
        g.fillStyle = '#54624c'; g.font = '10px "Courier New", monospace';
        drawSpaced(g, 'P R E S E N T S', W / 2, H / 2 + 36, 10);
        g.restore();
        // scanlines
        g.globalAlpha = 0.10; g.fillStyle = '#000';
        for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
        g.globalAlpha = 1;
        raf = requestAnimationFrame(frame);
      };
      function drawSpaced(g, text, cx, cy, size) { g.fillText(text, cx, cy); }
      raf = requestAnimationFrame(frame);
    }

    function __launchTitle() {
    // Safety net: the spooky-pop title theme was already kicked off with the
    // Brickroad splash; this call is a no-op if it's already playing, and just
    // ensures it's running if the splash was somehow skipped before it armed.
    try { if (window.TitleMusic) TitleMusic.start(); } catch (e) {}
    GameTitle.init(document.getElementById('stage'), {
      onMenuSelect(n) {
        // Ignore if the terminal is already open (user typing numbers).
        if (document.body.classList.contains('terminal-active')) return;
        // Ignore if MultiplexGame hasn't loaded for any reason.
        if (!window.MultiplexGame) {
          console.error('MultiplexGame not loaded — check script tags.');
          return;
        }
        // leaving the title for a menu choice — silence the theme. EXCEPT for
        // CREDITS (#24, case 4 below): we let the SAME title-theme instance keep
        // playing straight into the credits roll instead of stopping it and
        // starting a fresh one (which restarted the music from the top).
        try { if (window.TitleMusic && n !== 4) TitleMusic.stop(); } catch (e) {}
        // this menu-select is a genuine user gesture — the reliable moment to
        // enter fullscreen (browsers reject it outside a gesture). Honor the
        // windowMode setting if it wants fullscreen and we're not already in it.
        try {
          const S = MultiplexGame.State;
          if (S && S.settings && S.settings.windowMode === 'fullscreen' &&
              !(document.fullscreenElement || document.webkitFullscreenElement)) {
            const el = document.documentElement;
            const p = (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
            if (p && typeof p.catch === 'function') p.catch(() => {});   // refused (no gesture / iframe) — stay windowed quietly
          }
        } catch (e) {}

        switch (n) {
          case 1: // NEW GAME
            // Fresh character slate, start the intro crawl.
            resetRunState();   // no leftovers from a previous run (live map, tutorial, wake-up)
            MultiplexGame.State.character = blankCharacter();
            MultiplexGame.show('INTRO');
            break;

          case 2: // LOAD GAME  →  "Continue" — resume the latest save
            // Per design: this menu item resumes the saved character if there
            // is one. If there isn't, show the LOAD screen so the player sees
            // the "no saves on file" message.
            if (!MultiplexGame.resumeSavedGame()) {
              MultiplexGame.show('LOAD');
            }
            break;

          case 3: // SETTINGS
            MultiplexGame.show('SETTINGS');
            break;

          case 4: // CREDITS
            MultiplexGame.show('CREDITS');
            break;

          case 5: // HELP
            // HELP_MECHANICS is the existing in-game help screen. When the
            // player backs out, helpReturn is null so game.js will call
            // MultiplexGame.hide(), returning to the title canvas.
            MultiplexGame.State.buffers.helpReturn = null;
            MultiplexGame.show('HELP_MECHANICS');
            break;

          case 6: // QUIT
            MultiplexGame.show('QUIT');
            break;
        }
      }
    });
    }
    // #7: show the Brickroad splash first, then the title scene.
    MMDemo.gate(() => playBrickroadSplash(document.getElementById('stage'), __launchTitle));   // demo: click-to-play first (focus + audio)
  </script>

</body>
</html>
