/* -- celebration / bad-choice effects (confetti, fireworks, big check/X) -- */
var FX_COLORS=['#f43f5e','#fb923c','#facc15','#4ade80','#38bdf8','#a78bfa','#f472b6'];

function typeOf(id){ var d=(DATA.variables||[]).filter(function(x){return x.id===id;})[0]; return d?d.type:'number'; }

function replaceAll(s, find, val){ return s.split(find).join(val); }

  s = replaceAll(s, '{time}', now.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}));
  s = replaceAll(s, '{date}', now.toLocaleDateString());
  s = replaceAll(s, '{weekday}', now.toLocaleDateString(undefined,{weekday:'long'}));
  s = replaceAll(s, '{month}', now.toLocaleDateString(undefined,{month:'long'}));
  s = replaceAll(s, '{day}', String(now.getDate()));
  var out='', i=0;
  while(i < s.length){
    var open = s.indexOf('{{', i);
    if(open < 0){ out += s.slice(i); break; }
    out += s.slice(i, open);
    var close = s.indexOf('}}', open+2);
    if(close < 0){ out += s.slice(open); break; }
    var nm = s.slice(open+2, close).trim();
    var d=(DATA.variables||[]).filter(function(x){ return x.name===nm || x.id===nm; })[0];
    out += d ? String(vars[d.id]!=null?vars[d.id]:'') : '';

/* -- sounds (no bundled file; same synthesis approach as typesound.js/cursorsound.js) -- */

  if(!OPT.cursorSound || _muted) return;
  var a=ac(); if(!a) return;
  if(a.state==='suspended'&&a.resume){ try{ a.resume(); }catch(e){} }
  try{
    var t=a.currentTime, dur=0.07, g=a.createGain(); g.connect(a.destination);

  var now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  if(now-_lastTypeBlip<33) return; _lastTypeBlip=now;
  var a=ac(); if(!a) return;
  if(a.state==='suspended'&&a.resume){ try{ a.resume(); }catch(e){} }
  try{
    var t=a.currentTime, dur=0.045, g=a.createGain(); g.connect(a.destination);

/* -- mute (showMuteBtn) - a runtime, player-facing override on top of

}

/* -- typewriter reveal (per-line, click/tap to skip or advance) -- */
function delayFor(s){ var n=(s!=null)?Number(s):5; return Math.max(6, Math.round(130 - n*12)); }
var typeTimer=null, typeActive=false, typeDone=null, typeEl=null, typeFull=null;
function typeText(el, text, onDone){
  if(!OPT.animations){ el.textContent=text; onDone&&onDone(); return; }

    i++; el.textContent=units.slice(0,i).join('');

var root, audioEl, stageEl;
function applyMusic(scene){

  if(!scene.musicUrl) return;

  var p = audioEl.play(); if(p && p.catch) p.catch(function(){});
}

function moveTo(id){ state.s = id; state.li = 0; render(true); }
function rollDice(c, after){

  for(i=0;i<d.count;i++) sum += 1+Math.floor(Math.random()*d.sides);
  var mod = d.modVar ? Number(vars[d.modVar]||0) : 0;

  if(!out) out = outcomes[0];
  var box=document.createElement('div'); box.className='lv-end';
  box.textContent = 'Rolled ' + d.count + 'd' + d.sides + (mod?(mod>0?' +':' ')+mod:'') + ' = ' + total + ' vs target ' + d.target + ': ' + (success?'Success!':'Failure.');
  var btn=document.createElement('button'); btn.className='lv-choice'; btn.textContent='Continue \u25b8'; wireCursorSound(btn);
  btn.onclick=function(){ if(out && out.targetNode) moveTo(out.targetNode); else render(false); };
  after.appendChild(box); after.appendChild(btn);
}
function askInputThen(c, cb){
  var vDef=(DATA.variables||[]).filter(function(x){return x.id===c.askInput.var;})[0];
  var wrap=document.createElement('div');
  var input=document.createElement('input'); input.className='lv-input';
  input.placeholder = subst(c.askInput.label||'');
  if(vDef){ input.value = vars[vDef.id]!=null ? vars[vDef.id] : ''; if(vDef.type==='number') input.type='number'; }
  var btn=document.createElement('button'); btn.className='lv-choice'; btn.textContent='OK'; wireCursorSound(btn);
  var submit=function(){
    if(vDef){ vars[vDef.id] = vDef.type==='number' ? (parseFloat(input.value)||0) : vDef.type==='bool' ? truthy(input.value) : String(input.value); }
    cb();
  };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  btn.onclick=submit;
  wrap.appendChild(input); wrap.appendChild(btn);
  var choicesEl=document.getElementById('lv-choices'); choicesEl.innerHTML=''; choicesEl.appendChild(wrap);
}
function chooseChoice(c){
  if(c.askInput && c.askInput.var){ askInputThen(c, function(){ finishChoice(c); }); return; }
  finishChoice(c);
}
function finishChoice(c){
  logChoicePicked(c);
  if(c.pickFx) fireLiteFx(c.pickFx.effect, c.pickFx.intensity);
  applyEffects(c.effects);
  if(c.dice){ var choicesEl=document.getElementById('lv-choices'); choicesEl.innerHTML=''; rollDice(c, choicesEl); return; }
  var rt = routeTarget(c); if(rt){ moveTo(rt); return; }
  var outcomes=c.outcomes||[], o=outcomes[0];
  if(o && o.targetNode){ moveTo(o.targetNode); return; }
  render(false);
}
function buildLineNode(l){
  var frag=document.createDocumentFragment();
  if(l.speaker && !l.unattributed){ var sp=document.createElement('div'); sp.className='lv-speaker'; sp.textContent=subst(l.speaker); if(l.speakerColor) sp.style.color=l.speakerColor; frag.appendChild(sp); }
  var tx=document.createElement('p'); tx.className='lv-text'+(l.unattributed?' lv-narrator':''); tx.textContent=subst(l.text); frag.appendChild(tx);
  return frag;
}
function buildChoicesInto(scene, choicesEl){
  choicesEl.innerHTML='';
  var visible = (scene.choices||[]).map(function(c){ return {c:c, v:evalCondition(c)}; }).filter(function(x){ return x.v.show; });
  if(!visible.length){ var end2=document.createElement('div'); end2.className='lv-end'; end2.textContent='The End'; choicesEl.appendChild(end2); addRestart(choicesEl); if(DATA.titleScreen && DATA.titleScreen.returnOnEnd) addReturnToTitle(choicesEl); return; }
  visible.forEach(function(x){
    var btn=document.createElement('button'); btn.className='lv-choice';
    btn.textContent = x.c.isContinue ? (subst(x.c.text)||'Continue \u25b8') : subst(x.c.text);
    if(x.v.locked) btn.disabled=true;
    btn.onclick=function(){ chooseChoice(x.c); };
    wireCursorSound(btn);
    choicesEl.appendChild(btn);
  });
}
function showChoices(scene){
  var choicesEl=document.getElementById('lv-choices');
  buildChoicesInto(scene, choicesEl);
  notifyHeight();
}
function renderLineInstant(scene){
  var lineEl=document.getElementById('lv-line'); lineEl.innerHTML='';
  (scene.lines||[]).forEach(function(l){ lineEl.appendChild(buildLineNode(l)); logLine(l); });
  showChoices(scene);
}
function renderLineAnimated(scene){
  var lineEl=document.getElementById('lv-line'); lineEl.innerHTML='';
  var lines=scene.lines||[]; var l=lines[state.li];
  if(!l){ showChoices(scene); return; }
  logLine(l);
  if(l.speaker && !l.unattributed){ var sp=document.createElement('div'); sp.className='lv-speaker'; sp.textContent=subst(l.speaker); if(l.speakerColor) sp.style.color=l.speakerColor; lineEl.appendChild(sp); }
  var tx=document.createElement('p'); tx.className='lv-text'+(l.unattributed?' lv-narrator':''); lineEl.appendChild(tx);
  var hint=document.createElement('div'); hint.className='lv-hint'; hint.textContent='\u25b8 click to skip'; lineEl.appendChild(hint);
  var advance=function(e){
    if(e && e.target && e.target.closest && e.target.closest('button,input')) return;
    if(typeActive){ finishType(); return; }
    lineEl.removeEventListener('click', advance);
    state.li++; renderLineAnimated(scene);
  };
  lineEl.addEventListener('click', advance);
  typeText(tx, subst(l.text), function(){
    if(state.li>=lines.length-1){ lineEl.removeEventListener('click', advance); if(hint.parentNode) hint.parentNode.removeChild(hint); showChoices(scene); }
    else { hint.textContent='\u25b8 click to continue'; notifyHeight(); }
  });
}
function render(animateIn){
  var lineEl=document.getElementById('lv-line'), choicesEl=document.getElementById('lv-choices');
  finishType(); choicesEl.innerHTML='';
  var scene = DATA.scenes[state.s];
  if(_prevSceneForFx!==state.s){ fireSceneCues(DATA.scenes[_prevSceneForFx], 'end'); fireSceneCues(scene, 'start'); _prevSceneForFx=state.s; }
  var doRender=function(){
    if(!scene){ lineEl.innerHTML=''; var end=document.createElement('div'); end.className='lv-end'; end.textContent='The End'; lineEl.appendChild(end); addRestart(choicesEl); if(DATA.titleScreen && DATA.titleScreen.returnOnEnd) addReturnToTitle(choicesEl); if(OPT.animations) fadeIn(); notifyHeight(); return; }
    applyMusic(scene);
    if(OPT.animations) renderLineAnimated(scene); else renderLineInstant(scene);
    if(OPT.animations) fadeIn();
  };
  if(OPT.animations && animateIn && root){
    root.classList.add('lv-fade','lv-out');
    setTimeout(doRender, 180);
  } else doRender();
}
function fadeIn(){ if(!root) return; root.classList.add('lv-fade'); requestAnimationFrame(function(){ root.classList.remove('lv-out'); }); }
function resetVars(){ (DATA.variables||[]).forEach(function(d){ vars[d.id] = d.type==='bool' ? !!d.initial : d.type==='text' ? String(d.initial||'') : (Number(d.initial)||0); }); }
function addRestart(container){
  var btn=document.createElement('button'); btn.className='lv-choice'; btn.style.marginTop='8px'; btn.textContent='\u21ba Restart'; wireCursorSound(btn);
  btn.onclick=function(){ resetVars(); state.s=DATA.start; state.li=0; render(true); };
  container.appendChild(btn);
}
function addReturnToTitle(container){
  var btn=document.createElement('button'); btn.className='lv-choice'; btn.style.marginTop='8px'; btn.textContent='\u21A9 Return to title'; wireCursorSound(btn);
  btn.onclick=function(){ resetVars(); state.s=DATA.start; state.li=0; if(stageEl) stageEl.style.display='none'; showTitleScreen(); };
  container.appendChild(btn);
}
function notifyHeight(){
  try{ if(window.parent && window.parent!==window) window.parent.postMessage({ source:'scenemaker-embed', height: document.documentElement.scrollHeight }, '*'); }catch(e){}
}

function computeStageMinHeight(){
  try{
    var rect = root.getBoundingClientRect();
    if(!rect.width) return 0;
    var probeRoot=document.createElement('div'); probeRoot.className='lv-root';
    probeRoot.style.cssText='position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0;box-sizing:border-box;width:'+rect.width+'px;';
    var probeStage=document.createElement('div'); probeStage.className='lv-stage';
    var probeLine=document.createElement('div'), probeChoices=document.createElement('div'); probeChoices.className='lv-choices';
    probeStage.appendChild(probeLine); probeStage.appendChild(probeChoices); probeRoot.appendChild(probeStage);
    document.body.appendChild(probeRoot);
    var maxH=0;
    Object.keys(DATA.scenes||{}).forEach(function(sid){
      var scene=DATA.scenes[sid], lines=scene.lines||[];
      if(OPT.animations){
        if(!lines.length){ probeLine.innerHTML=''; buildChoicesInto(scene, probeChoices); maxH=Math.max(maxH, probeStage.scrollHeight); return; }
        lines.forEach(function(l, idx){
          probeLine.innerHTML=''; probeChoices.innerHTML='';
          probeLine.appendChild(buildLineNode(l));
          var hint=document.createElement('div'); hint.className='lv-hint'; hint.textContent='\u25b8 click to continue'; probeLine.appendChild(hint);
          maxH=Math.max(maxH, probeStage.scrollHeight);
          if(idx===lines.length-1){
            probeLine.innerHTML=''; probeLine.appendChild(buildLineNode(l));
            buildChoicesInto(scene, probeChoices);
            maxH=Math.max(maxH, probeStage.scrollHeight);
          }
        });
      } else {
        probeLine.innerHTML=''; probeChoices.innerHTML='';
        lines.forEach(function(l){ probeLine.appendChild(buildLineNode(l)); });
        buildChoicesInto(scene, probeChoices);
        maxH=Math.max(maxH, probeStage.scrollHeight);
      }
    });
    document.body.removeChild(probeRoot);
    return maxH;
  }catch(e){ return 0; }
}
function applyStageMinHeight(){
  if(!stageEl) return;
  stageEl.style.minHeight='0';
  var minH=computeStageMinHeight();
  if(minH>0) stageEl.style.minHeight=minH+'px';
}

function showTitleScreen(){
  var t=DATA.titleScreen; if(!t) return;
  var h=document.getElementById('lv-title-h'); if(h) h.textContent=subst(t.heading||DATA.title||'');
  var sub=document.getElementById('lv-title-sub'); if(sub){ var sv=subst(t.subheading||''); sub.textContent=sv; sub.style.display=sv?'':'none'; }
  var titleEl=document.getElementById('lv-title'); if(titleEl) titleEl.style.display='';
  var btn=document.getElementById('lv-title-start');
  if(btn){ btn.textContent=subst(t.startLabel||'Start'); wireCursorSound(btn); btn.onclick=beginStory; }
  notifyHeight();
}
function beginStory(){
  var titleEl=document.getElementById('lv-title'); if(titleEl) titleEl.style.display='none';
  if(stageEl) stageEl.style.display='';
  render(false);
  notifyHeight();
}

function boot(){
  root=document.getElementById('lv-root'); audioEl=document.getElementById('lv-audio'); stageEl=document.getElementById('lv-stage');
  var logBtn=document.getElementById('lv-log-btn'); if(logBtn){ logBtn.onclick=openLog; wireCursorSound(logBtn); }
  var logClose=document.getElementById('lv-log-close'); if(logClose) logClose.onclick=closeLog;
  var logOv=document.getElementById('lv-log-overlay'); if(logOv) logOv.addEventListener('click', function(e){ if(e.target===logOv) closeLog(); });
  var muteBtn=document.getElementById('lv-mute-btn'); if(muteBtn){ muteBtn.onclick=toggleMute; wireCursorSound(muteBtn); }
  applyStageMinHeight();
  if(DATA.titleScreen) showTitleScreen(); else render(false);
  notifyHeight();
  if(typeof ResizeObserver!=='undefined'){ try{ new ResizeObserver(notifyHeight).observe(document.body); }catch(e){} }
  var resizeTimer=null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){ applyStageMinHeight(); notifyHeight(); }, 200);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();</script><script>/* Portfolio: scale the 1000 x 640 stage to fit the window (see #pf-fit) */
(function(){var r=document.getElementById('lv-root');if(!r)return;function fit(){r.style.setProperty('--pf-fit',Math.min(innerWidth/1000,innerHeight/640))}
fit();addEventListener('resize',fit);})();</script>
