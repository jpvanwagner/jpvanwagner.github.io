<meta charset="UTF-8">

<title>The Group Chat</title>

<style>
/* Scenemaker player; fixed 1000x640 design stage scaled to fit any window. */
:root{
  --box-bg:rgba(9,12,20,.86); --ink:#f1f5f9; --accent:#e879f9; --btn:#1e293b; --btn-h:#334155;
  --frame:transparent; --frame-w:0px; --frame-r:0px; --font:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
/* #59: opt-in lockdown (Settings > Screen & frame), body.vn-lockdown added at boot.
   Inputs/textareas stay selectable so the "ask for input" prompt still works. */
body.vn-lockdown{-webkit-user-select:none;user-select:none}
body.vn-lockdown input,body.vn-lockdown textarea{-webkit-user-select:text;user-select:text}
#vn-fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#vn-stage{position:relative;width:1000px;height:640px;transform-origin:center center;
  color:var(--ink);font-family:var(--font);overflow:hidden;background:#0b1120}
#vn-frame{position:absolute;inset:0;overflow:hidden;border:var(--frame-w) solid var(--frame);border-radius:var(--frame-r)}

#vn-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#0b1120}
#vn-bg video{width:100%;height:100%;object-fit:cover}
#vn-portraits{position:absolute;left:0;right:0;top:0;bottom:180px;pointer-events:none;z-index:2}

.pfx-glitch{animation:pfxGlitch .5s steps(2) infinite}
@keyframes pfxGlitch{0%,100%{transform:translateX(-50%)}30%{transform:translate(calc(-50% - 3px),0);filter:hue-rotate(20deg)}32%{transform:translate(calc(-50% + 3px),0)}34%{transform:translateX(-50%)}}
.pfx-bow{border-radius:14px}
.pfx-crt{animation:pfxCrtFlicker 6s infinite}
@keyframes pfxCrtFlicker{0%,100%{opacity:1}48%{opacity:.9}50%{opacity:1}}
.vn-face{position:absolute;bottom:0;transform:translateX(-50%);
  transition:left .35s ease, transform .35s ease, opacity .25s ease, filter .25s ease;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.vn-face.dim{opacity:.6;transform:translateX(-50%) scale(.95);filter:brightness(.58) drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.vn-face.leaving{opacity:0}
/* #NEW: a subtle grow-and-glow while a character is the one talking (opt-in,
   Characters panel's own Intensity/Speed sliders set the custom properties
   below) - keeps the SAME base translateX(-50%) centering .vn-face already
   relies on in both keyframe stops, same as .dim above already has to. */
@keyframes vnSpeakPulse{
  0%,100%{ transform:translateX(-50%) scale(1); filter:drop-shadow(0 8px 20px rgba(0,0,0,.55)); }
  50%{ transform:translateX(-50%) scale(var(--vn-pulse-scale,1.06)); filter:drop-shadow(0 8px 20px rgba(0,0,0,.55)) drop-shadow(0 0 var(--vn-pulse-glow,10px) var(--vn-pulse-color,#e879f9)); }
}
.vn-face.vn-speak-pulse{animation:vnSpeakPulse var(--vn-pulse-dur,.6s) ease-in-out infinite}
.vn-face.size-square{width:150px;height:150px;object-fit:cover;bottom:9%;border-radius:8px}
.vn-face.size-tall{height:62%;width:auto;object-fit:contain}
.vn-face.size-full{height:84%;width:auto;object-fit:contain}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxLeft{from{opacity:0;transform:translateX(-50%) translateX(-90px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fxRight{from{opacity:0;transform:translateX(-50%) translateX(90px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fxBottom{from{opacity:0;transform:translateX(-50%) translateY(70px)}to{opacity:1;transform:translateX(-50%)}}
.enter-fade{animation:fxFade .4s ease both}
.enter-fromLeft{animation:fxLeft .42s ease both}
.enter-fromRight{animation:fxRight .42s ease both}
.enter-fromBottom{animation:fxBottom .42s ease both}
.enter-none{}
.pb-none{}.pb-round{border-radius:14px;border:3px solid rgba(255,255,255,.85)}
.pb-square{border:3px solid rgba(255,255,255,.85)}.pb-soft{border-radius:20px;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.pb-glow{border-radius:12px;box-shadow:0 0 18px 3px var(--accent);border:2px solid var(--accent)}
.pb-gold{border-radius:10px;border:3px solid #d4af37;box-shadow:0 0 10px rgba(212,175,55,.5)}



.vn-hint{margin-top:6px}

.vn-face.exit-fade{animation:vnExitFade .34s ease forwards}
.vn-face.exit-toLeft{animation:vnExitLeft .34s ease forwards}
.vn-face.exit-toRight{animation:vnExitRight .34s ease forwards}
.vn-face.exit-toBottom{animation:vnExitDown .34s ease forwards}
.vn-face.exit-pop{animation:vnExitPop .3s ease forwards}
@keyframes vnExitFade{to{opacity:0}}
@keyframes vnExitLeft{to{opacity:0;transform:translateX(calc(-50% - 60px))}}
@keyframes vnExitRight{to{opacity:0;transform:translateX(calc(-50% + 60px))}}
@keyframes vnExitDown{to{opacity:0;transform:translate(-50%,60px)}}
@keyframes vnExitPop{to{opacity:0;transform:translateX(-50%) scale(.6)}}
.vn-cont-pulse{animation:vnContPulse 1.3s ease-in-out infinite}
@keyframes vnContPulse{0%,100%{opacity:.5}50%{opacity:1}}
.vn-cont-blinkArrow .vn-cont-arrow{animation:vnContBlink 1s steps(1) infinite}
.vn-cont-cursor{animation:vnContBlink 1s steps(1) infinite}
@keyframes vnContBlink{0%,100%{opacity:1}50%{opacity:0}}
.vn-cont-icon{height:1em;width:auto;vertical-align:middle}
.vn-cont-icon-blink{animation:vnContBlink 1s steps(1) infinite}
/* #98: the credits screen's own optional "auto-scrolling roll" style (Credits
   screen editor); the static (default) credits panel needs no keyframe of its
   own, still built entirely inline in runtime.js like before. */
@keyframes vnCrScroll{from{transform:translateY(0)}to{transform:translateY(-100%)}}
/* #83: scene transitions (a fade/slide on the WHOLE #vn-frame as one scene
   hands off to another) - kept separate from the character-portrait
   enter/exit keyframes above and layout.js's own box/portrait entrance
   ones, since those assume their own element's base transform/centering.
   Defined here (always loaded) rather than inside layout.js's own CSS
   injector, which only ever runs for a project that has a custom Canvas
   layout - transitions work with or without one. */
@keyframes vnSceneFadeOut{from{opacity:1}to{opacity:0}}
@keyframes vnSceneFadeIn{from{opacity:0}to{opacity:1}}
@keyframes vnSceneSlideOutUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
@keyframes vnSceneSlideInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes vnSceneSlideOutDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(40px)}}
@keyframes vnSceneSlideInDown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
@keyframes vnSceneSlideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-60px)}}
@keyframes vnSceneSlideInLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes vnSceneSlideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}
@keyframes vnSceneSlideInRight{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
/* #118: four more transition families, same "out then in" pairing as fade/slide above.
   Wipe: a hard clip-path edge sweeps across (no translation, unlike slide), same
   direction convention as slide (the boundary keeps moving the same way across
   both halves: out erases toward that edge, in then grows in from that edge). */
@keyframes vnSceneWipeOutUp{from{clip-path:inset(0 0 0% 0)}to{clip-path:inset(0 0 100% 0)}}
@keyframes vnSceneWipeInUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutDown{from{clip-path:inset(0% 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
@keyframes vnSceneWipeInDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutLeft{from{clip-path:inset(0 0% 0 0)}to{clip-path:inset(0 100% 0 0)}}
@keyframes vnSceneWipeInLeft{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutRight{from{clip-path:inset(0 0 0 0%)}to{clip-path:inset(0 0 0 100%)}}
@keyframes vnSceneWipeInRight{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneZoomOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.15)}}
@keyframes vnSceneZoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes vnSceneIrisOut{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
@keyframes vnSceneIrisIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes vnSceneFlipOut{from{opacity:1;transform:perspective(900px) rotateY(0deg)}to{opacity:0;transform:perspective(900px) rotateY(90deg)}}
@keyframes vnSceneFlipIn{from{opacity:0;transform:perspective(900px) rotateY(-90deg)}to{opacity:1;transform:perspective(900px) rotateY(0deg)}}
.vn-cont-icon-pulse{animation:vnContPulse 1.3s ease-in-out infinite}
.vn-box2{position:absolute;background:var(--box-bg);border-bottom:2px solid var(--accent);padding:16px 22px;display:none;flex-direction:column;gap:6px;z-index:3;backdrop-filter:blur(3px);overflow-y:auto;overflow-x:hidden;transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}
.vn-speaker2{position:absolute;top:-22px;left:20px;background:var(--accent);color:#1a032b;font-weight:800;padding:2px 12px;border-radius:6px 6px 0 0;font-size:14px}
.vn-text2{font-size:19px;line-height:1.5;white-space:pre-wrap;flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
/* #92: a `transition` shorthand always replaces, never merges, with another
   rule's on the same element - so this needs the SAME left/top/width/height
   entries #vn-box/.vn-box2 declare, or a currently-dimmed (inactive) box
   would silently lose its own position transition the moment it's the one
   whose layout changes, since .vn-box-dim (also a class, same specificity)
   is declared after .vn-box2 and wins outright otherwise. */
.vn-box-dim{opacity:.42;filter:saturate(.6);transition:opacity .3s ease,left .3s ease,top .3s ease,width .3s ease,height .3s ease}
.vn-face.vn-linked{transition:opacity .35s ease}
#vn-speaker.vn-name-nobg{background:none!important;box-shadow:none!important;padding:0!important}
/* #7: "inside the box" mode reparents #vn-speaker into the box but, without
   this, still inherited the base rule's position:absolute;top:-25px below -
   meant for the floating tab/free look - so it kept rendering as a tab
   poking out above the box's top edge regardless of the chosen mode,
   mismatching the Canvas editor's own preview (.ce-spk has no absolute
   positioning at all, so it already sat correctly in the box's own flow). */
#vn-speaker.vn-name-inbox{position:static;align-self:flex-start;box-shadow:none;margin-bottom:2px}
/* #92: a custom layout's box position/size (editor/modules/canvas-editor.js,
   applied here via player/layout.js's styleBox()) can genuinely differ
   scene-to-scene or group-to-group - this glides it to its new spot instead
   of snapping. No-op for the vast majority of projects, where the box sits
   in the exact same place every scene: identical left/top/width/height
   values mean the transition has nothing to actually animate. */
/* A real report: a fixed-height layout box (layout.js's styleBox()) whose
   dialogue + choices needed more room than that height just spilled the
   extra choice buttons straight past the box's own border, below the
   visible frame. styleBox() now treats that height as a floor and lets the
   box grow with its content (capped at the stage's own bottom edge); this
   overflow-y:auto is only the fallback for the rare case that even THAT
   isn't room enough, so content scrolls inside the box instead of spilling
   past it. overflow-x stays hidden since width is never content-driven. */
#vn-box{position:absolute;left:0;right:0;bottom:0;min-height:180px;background:var(--box-bg);overflow-y:auto;overflow-x:hidden;
  backdrop-filter:blur(3px);border-top:2px solid var(--accent);padding:20px 26px 24px;display:flex;flex-direction:column;gap:8px;
  transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}
/* display:none by default: renderSceneLine() only ever sets this to
   'inline-block' once a dialogue line actually has a name to show, so
   nothing here means nothing SHOULD be visible yet - a real report found an
   empty, padded, skin-coloured pill floating over a project's opening
   cutscene, since no dialogue line (the only code path that touches this
   element's display) had run even once to hide or show it. */
#vn-speaker{position:absolute;top:-25px;left:24px;background:var(--accent);color:#1a032b;font-weight:800;display:none;
  font-size:15px;letter-spacing:.5px;padding:4px 14px;border-radius:8px 8px 0 0;margin:0;box-shadow:0 -3px 8px rgba(0,0,0,.28);z-index:1}
/* #81: only actually constrains anything once a Canvas editor layout gives
   #vn-box a real (not auto) height - flex:1 on an auto-height parent is
   inert, so a project with no custom layout keeps growing to fit exactly
   as before. Once the box IS a fixed size, this is what lets text longer
   than it can hold scroll smoothly inside it (runtime.js scrolls it as the
   typewriter reveals more) instead of visibly spilling out past the box. */
#vn-text{font-size:19px;line-height:1.55;min-height:56px;white-space:pre-wrap;flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
#vn-doc{align-self:flex-start;background:#0369a1;border:1px solid #38bdf8;color:#e0f2fe;font-size:13px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer}
#vn-choices,#vn-cs-choices{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.vn-choice{background:var(--btn);border:1px solid #475569;color:#f1f5f9;font-size:16px;text-align:left;padding:11px 16px;border-radius:8px;cursor:pointer;transition:.12s;font-family:inherit}
.vn-choice:hover{background:var(--btn-h);border-color:var(--accent);transform:translateX(3px)}
.vn-choice.locked{opacity:.45;cursor:not-allowed;border-style:dashed}
.vn-choice.locked:hover{transform:none;border-color:#475569;background:var(--btn)}
.vn-hint{color:#94a3b8;font-size:13px;font-style:italic}
.vn-end{color:var(--accent);font-weight:700;font-size:16px;margin-bottom:6px}
.vn-roll{color:#fde68a;font-weight:700;font-size:16px;margin-bottom:6px}
.vn-share{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.vn-share .vn-hint{margin:0 0 6px}
.vn-share-row{display:flex;flex-wrap:wrap;gap:8px}
.vn-share-btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;background:rgba(15,23,42,.55);
  border:1px solid rgba(255,255,255,.28);color:#e2e8f0;cursor:pointer}
.vn-share-btn:hover{border-color:var(--accent);color:#fff}

#vn-nav{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:8}
#vn-nav button{width:34px;height:34px;border-radius:8px;background:rgba(15,23,42,.72);border:1px solid #475569;color:#e2e8f0;font-size:15px;cursor:pointer}
#vn-nav button:hover{background:rgba(51,65,85,.9);border-color:var(--accent)}
#vn-nav button[disabled]{opacity:.3;cursor:default}

/* FF7-style dialogue skin */
/* ---- play-screen skins (set on #vn-stage as sk-<style>) ---------------- */
/* Classic RPG; deep-blue gradient textbox, à la old console RPGs */
.sk-jrpg #vn-box{background:linear-gradient(180deg,#0b1e6b 0%,#071246 100%);border:4px solid #eef2ff;border-radius:10px;left:18px;right:18px;bottom:16px;box-shadow:0 0 0 2px #1e3a8a inset}
.sk-jrpg #vn-speaker{background:#eef2ff;color:#0b1e6b;top:-27px;left:22px}
.sk-jrpg #vn-text{color:#fff;text-shadow:1px 1px 0 #000}
.sk-jrpg .vn-choice,.sk-jrpg #vn-cs-choices .vn-choice,.sk-jrpg #vn-narr-choices .vn-choice,.sk-jrpg #vn-viewer-choices .vn-choice{background:linear-gradient(180deg,#12297f,#0a1a58);border:2px solid #cdd7ff;color:#fff}
/* Terminal; green phosphor on black */
.sk-terminal #vn-box{background:#020a02;border:2px solid #22c55e;border-radius:0;box-shadow:0 0 24px #16a34a55 inset}
.sk-terminal #vn-speaker{background:#052e05;color:#4ade80;border-radius:0;box-shadow:none;font-family:"VT323","Courier New",monospace;letter-spacing:2px}
.sk-terminal #vn-text{color:#4ade80;font-family:"VT323","Courier New",monospace;text-shadow:0 0 6px #22c55e88}
.sk-terminal .vn-choice,.sk-terminal #vn-cs-choices .vn-choice,.sk-terminal #vn-narr-choices .vn-choice,.sk-terminal #vn-viewer-choices .vn-choice{background:#020a02;border:1px solid #22c55e;color:#4ade80;font-family:"VT323","Courier New",monospace}
.sk-terminal .vn-choice:hover{background:#052e05}
/* Parchment; aged paper, ink serif (fantasy / tabletop) */
.sk-parchment #vn-box{background:linear-gradient(180deg,#f4e4c1,#e7d3a8);border:3px solid #7c5a2e;border-radius:6px;box-shadow:0 0 0 2px #b89b6a inset}
.sk-parchment #vn-speaker{background:#7c5a2e;color:#f4e4c1;font-family:Georgia,serif}
.sk-parchment #vn-text{color:#3a2a12;font-family:Georgia,"Times New Roman",serif}
.sk-parchment .vn-choice,.sk-parchment #vn-cs-choices .vn-choice,.sk-parchment #vn-narr-choices .vn-choice,.sk-parchment #vn-viewer-choices .vn-choice{background:#efdcb4;border:2px solid #7c5a2e;color:#3a2a12;font-family:Georgia,serif}
.sk-parchment .vn-choice:hover{background:#e2c793}
/* Comic; bold outlines, bright panel */
.sk-comic #vn-box{background:#fffbe8;border:4px solid #111;border-radius:14px;box-shadow:6px 6px 0 #111}
.sk-comic #vn-speaker{background:#ffe14d;color:#111;border:3px solid #111;border-radius:10px 10px 0 0;top:-28px}
.sk-comic #vn-text{color:#111;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:700}
.sk-comic .vn-choice,.sk-comic #vn-cs-choices .vn-choice,.sk-comic #vn-narr-choices .vn-choice,.sk-comic #vn-viewer-choices .vn-choice{background:#8ad3ff;border:3px solid #111;color:#111;font-weight:800;box-shadow:3px 3px 0 #111}
.sk-comic .vn-choice:hover{background:#5ec0ff}
/* Neon; synthwave grid glow */
.sk-neon #vn-box{background:linear-gradient(180deg,#1a0330 0%,#0b0118 100%);border:2px solid #ec4899;border-radius:8px;box-shadow:0 0 22px #ec489988,0 0 40px #22d3ee44 inset}
.sk-neon #vn-speaker{background:#22d3ee;color:#0b0118;box-shadow:0 0 14px #22d3eeaa}
.sk-neon #vn-text{color:#f5d0fe;text-shadow:0 0 8px #ec4899aa}
.sk-neon .vn-choice,.sk-neon #vn-cs-choices .vn-choice,.sk-neon #vn-narr-choices .vn-choice,.sk-neon #vn-viewer-choices .vn-choice{background:linear-gradient(180deg,#2a0845,#170229);border:1px solid #22d3ee;color:#f5d0fe;box-shadow:0 0 12px #22d3ee55}
.sk-neon .vn-choice:hover{border-color:#ec4899;box-shadow:0 0 16px #ec489988}

/* ── CUTSCENE layer (text over background, no dialogue box) ────────────── */
#vn-cs{position:absolute;inset:0;display:none;z-index:5}
#vn-cs-dim{position:absolute;inset:0;background:#000;opacity:0}
#vn-cs-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:8% 10%;z-index:1}
#vn-cs-wrap.align-top{justify-content:flex-start}
#vn-cs-wrap.align-center{justify-content:center}
#vn-cs-wrap.align-bottom{justify-content:flex-end}
#vn-cs-text{color:#fff;text-align:center;line-height:1.5;white-space:pre-wrap;font-family:inherit}
#vn-cs-text.size-md{font-size:24px}#vn-cs-text.size-lg{font-size:34px}#vn-cs-text.size-xl{font-size:46px;font-weight:800}
#vn-cs-choices{margin-top:26px;align-items:center}
/* A real report: this dark, semi-transparent fallback (for the 'plain' skin,
   or unskinned text over an arbitrary background image/video) used to also
   silently override every NAMED skin's own choice colour here specifically,
   since an id+class selector always outranks a skin's plain class-only
   .vn-choice rule regardless of source order - so a bright skin like comic
   or parchment still got this dark pill for a cutscene's continue button,
   unreadable against its own light dialogue box. Each .sk-X block above now
   repeats its own .vn-choice rule for this id too, which outranks this
   fallback wherever a skin is actually active; this rule only still applies
   with no skin at all. */
#vn-cs-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}

/* ── NARRATOR layer (#168: "unattributed" lines - floats over the stage,
   background/portraits stay visible but dim, unlike the cutscene layer) ── */
#vn-narr{position:absolute;inset:0;display:none;z-index:5}
#vn-narr-dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s ease}
#vn-narr-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8% 10%;z-index:1}
#vn-narr-text{color:#fff;text-align:center;line-height:1.5;white-space:pre-wrap;font-style:italic;font-size:22px;text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000}
#vn-narr-choices{margin-top:26px;align-items:center}
#vn-narr-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}
.fx-none{}
.fx-shadow{text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000}
.fx-emboss{text-shadow:1px 1px 0 rgba(255,255,255,.45),-1px -1px 0 rgba(0,0,0,.75)}
.fx-outline{text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 4px #000}
.fx-glow{text-shadow:0 0 10px var(--accent),0 0 22px var(--accent)}

/* ── VIEWER scene (#90: a whole scene dedicated to examining one photo or
   video, not talked over) - a photo renders as a simplified panorama (drag
   left/right/up/down to look around, wheel/pinch to zoom; a flat pan/zoom,
   not a true spherical reprojection, deliberately kept dependency-free), a
   video uses the browser's own native controls (play/pause/seek/FF/rewind
   all come free from the <video controls> element itself, rather than
   hand-rolled buttons). ────────────────────────────────────────────────── */
#vn-viewer{position:absolute;inset:0;display:none;z-index:5;background:#000}
#vn-viewer-stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab}
#vn-viewer-stage.dragging{cursor:grabbing}
#vn-viewer-img{position:absolute;left:50%;top:50%;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;transform:translate(-50%,-50%);display:none}
#vn-viewer-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
#vn-viewer-caption{position:absolute;left:0;right:0;bottom:6%;padding:0 10%;text-align:center;color:#fff;line-height:1.4;white-space:pre-wrap;text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000;font-size:20px;z-index:1;pointer-events:none;display:none}
#vn-viewer-choices{position:absolute;left:0;right:0;bottom:2%;display:flex;flex-direction:column;gap:9px;align-items:center;z-index:1}
#vn-viewer-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}

/* ── TITLE screen ─────────────────────────────────────────────────────── */
#vn-title{position:absolute;inset:0;display:none;z-index:10}
#vn-title-bg{position:absolute;inset:0;background-size:cover;background-position:center;background:#0b1120}
#vn-title-bg video{width:100%;height:100%;object-fit:cover}
#vn-title-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.6))}
#vn-title-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8%}
#vn-title-h{color:#fff;font-size:56px;font-weight:900;letter-spacing:1px;text-align:center;margin:0;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#vn-title-sub{color:#e2e8f0;font-size:22px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#vn-title-start{margin-top:18px;background:var(--accent);color:#1a032b;font-weight:800;font-size:20px;letter-spacing:1px;
  padding:12px 34px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#vn-title-start:hover{filter:brightness(1.08)}
/* #96: extra title-screen menu items (Credits/Settings/a custom link) - a
   deliberately quieter look than the one primary Start button, same family
   of shape so they read as siblings, not competing calls to action. */
#vn-title-menu{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.vn-title-menu-btn{background:rgba(15,23,42,.55);color:#e2e8f0;font-weight:600;font-size:15px;letter-spacing:.5px;
  padding:8px 24px;border:1px solid rgba(255,255,255,.28);border-radius:9px;cursor:pointer;backdrop-filter:blur(2px)}
.vn-title-menu-btn:hover{border-color:var(--accent);color:#fff}
/* social icon row: plain circular glyph buttons, doesn't try to guess a
   platform's real brand icon (that would mean shipping/maintaining a logo
   set) - just a text/emoji glyph keyed off the link's own label. */
#vn-title-social{display:flex;gap:10px;margin-top:14px}
.vn-title-social-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.28);color:#e2e8f0;font-size:15px;text-decoration:none;cursor:pointer}
.vn-title-social-ic:hover{border-color:var(--accent);color:#fff}

#vn-debug-btn{position:absolute;top:10px;left:12px;z-index:9;width:34px;height:34px;border-radius:8px;background:rgba(15,23,42,.72);border:1px solid #475569;color:#e2e8f0;font-size:16px;cursor:pointer}
#vn-debug-btn:hover{border-color:var(--accent)}
#vn-debug-panel{position:absolute;top:52px;left:12px;z-index:9;width:270px;max-height:74%;overflow:auto;background:rgba(9,12,20,.96);border:1px solid var(--accent);border-radius:10px;padding:12px;color:#e2e8f0;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.dbg-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dbg-row label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
/* ============================================================================
   Scenemaker; SCORM runtime wrapper (SCORM 1.2 AND SCORM 2004)
   ----------------------------------------------------------------------------
   A dependency-free bridge that talks to whichever LMS runtime is present.
   It auto-detects the API (API_1484_11 = 2004, API = 1.2), or honours the
   version chosen in the project (settings.scorm.version), and maps a single
   set of helpers onto the right CMI data model:

     SCORM.init()                 initialise + resume status
     SCORM.getBookmark()          resume cursor (suspend_data)
     SCORM.setBookmark(str)       store resume cursor (+ location)
     SCORM.setScore(0..100)       raw/min/max (+ scaled on 2004)
     SCORM.setComplete(passed)    completion + (optional) success status
     SCORM.setIncomplete()        mark still in progress
     SCORM.interaction(o)         log a choice as a cmi.interactions record
     SCORM.commit() / finish()    flush / close (records session time)

   Reporting is configurable via settings.scorm:
     version:'1.2'|'2004', reportScore, masteryScore, reportInteractions,
     reportTime, reportSuccess.
   With no LMS present every call is a safe no-op and bookmarks fall back to
   localStorage, so the story still plays and resumes locally.
   ==========================================================================*/
(function(){
  'use strict';
  var api=null, mode='1.2', ready=false, startMs=0, ix=0, LS_KEY='scenemaker_bookmark';
  var cfg = (function(){ try{ return (window.VN_PROJECT&&window.VN_PROJECT.settings&&window.VN_PROJECT.settings.scorm)||{}; }catch(e){ return {}; } })();

  function findAPI(win, name){ var t=0; while(win && !win[name] && win.parent && win.parent!==win && t<500){ t++; win=win.parent; } return (win&&win[name])?win[name]:null; }
  function locate(name){ var a=findAPI(window,name); if(!a && window.opener) a=findAPI(window.opener,name); return a; }

  // choose the runtime: honour the requested version, else auto-detect
  function pick(){
    var want=(cfg.version==='2004')?'2004':(cfg.version==='1.2'?'1.2':'auto');
    var a04=locate('API_1484_11'), a12=locate('API');
    if(want==='2004' && a04){ mode='2004'; return a04; }
    if(want==='1.2'  && a12){ mode='1.2';  return a12; }
    if(a04){ mode='2004'; return a04; }
    if(a12){ mode='1.2';  return a12; }
    return null;
  }
  var FN={ '1.2':{init:'LMSInitialize',get:'LMSGetValue',set:'LMSSetValue',commit:'LMSCommit',fin:'LMSFinish'},
           '2004':{init:'Initialize',get:'GetValue',set:'SetValue',commit:'Commit',fin:'Terminate'} };
  function G(k){ try{ return api[FN[mode].get](k); }catch(e){ return ''; } }
  function S(k,v){ try{ api[FN[mode].set](k,String(v)); return true; }catch(e){ return false; } }

  function fmtTime12(ms){ var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    function p(n){ return (n<10?'0':'')+n; } return p(h)+':'+p(m)+':'+p(ss)+'.00'; }
  function fmtTime04(ms){ var s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    return 'PT'+(h?h+'H':'')+(m?m+'M':'')+ss+'S'; }

  var SCORM={
    present:false, version:function(){ return mode; },
    init:function(){
      api=pick(); if(!api){ this.present=false; return false; }
      this.present=true; startMs=Date.now();
      var ok=api[FN[mode].init](''); ready=(ok==='true'||ok===true);
      if(!ready) return false;
      if(mode==='2004'){
        var cs=G('cmi.completion_status'); if(cs===''||cs==='unknown'||cs==='not attempted') S('cmi.completion_status','incomplete');
        if(cfg.masteryScore!=null) S('cmi.scaled_passing_score', String(Math.max(0,Math.min(1,cfg.masteryScore/100))));
      } else {
        var st=G('cmi.core.lesson_status'); if(st===''||st==='unknown'||st==='not attempted') S('cmi.core.lesson_status','incomplete');
        if(cfg.masteryScore!=null) S('cmi.student_data.mastery_score', String(cfg.masteryScore));
      }
      this.commit(); return true;
    },
    _cap:function(){ return mode==='2004'?60000:3800; },   // suspend_data size budget
    getBookmark:function(){
      if(ready){ try{ return G(mode==='2004'?'cmi.suspend_data':'cmi.suspend_data')||''; }catch(e){ return ''; } }
      try{ return localStorage.getItem(LS_KEY)||''; }catch(e){ return ''; }
    },
    setBookmark:function(str){ str=String(str||''); if(str.length>this._cap()) str=str.slice(0,this._cap());
      if(ready){ S('cmi.suspend_data',str); S(mode==='2004'?'cmi.location':'cmi.core.lesson_location', str.slice(0,mode==='2004'?1000:255)); }
      else { try{ localStorage.setItem(LS_KEY,str); }catch(e){} }
    },
    setScore:function(raw){ if(!ready || cfg.reportScore===false) return; raw=Math.max(0,Math.min(100,Math.round(raw)));
      if(mode==='2004'){ S('cmi.score.raw',raw); S('cmi.score.min',0); S('cmi.score.max',100); S('cmi.score.scaled', String(raw/100)); }
      else { S('cmi.core.score.raw',raw); S('cmi.core.score.min',0); S('cmi.core.score.max',100); }
    },
    setComplete:function(passed){ if(!ready) return;
      if(mode==='2004'){ S('cmi.completion_status','completed'); if(cfg.reportSuccess!==false && passed!=null) S('cmi.success_status', passed?'passed':'failed'); }
      else { S('cmi.core.lesson_status', (cfg.reportSuccess!==false && passed!=null) ? (passed?'passed':'failed') : 'completed'); }
      this.commit();
    },
    setIncomplete:function(){ if(!ready) return; if(mode==='2004') S('cmi.completion_status','incomplete'); else S('cmi.core.lesson_status','incomplete'); },
    interaction:function(o){ if(!ready || cfg.reportInteractions===false) return; o=o||{};
      var p = (mode==='2004'?'cmi.interactions.':'cmi.interactions.')+ix+'.';
      S(p+'id', o.id||('choice_'+ix)); S(p+'type', o.type||'choice');
      if(mode==='2004'){ S(p+'learner_response', o.response||''); if(o.result!=null) S(p+'result', o.result); S(p+'timestamp', new Date().toISOString()); }
      else { S(p+'student_response', (o.response||'').slice(0,255)); if(o.result!=null) S(p+'result', o.result); }
      ix++;
    },
    commit:function(){ if(ready){ try{ api[FN[mode].commit](''); }catch(e){} } },
    finish:function(){ if(!ready) return;
      if(cfg.reportTime!==false){ var d=Date.now()-startMs; S(mode==='2004'?'cmi.session_time':'cmi.core.session_time', mode==='2004'?fmtTime04(d):fmtTime12(d)); }
      try{ api[FN[mode].commit](''); api[FN[mode].fin](''); }catch(e){} ready=false;
    }
  };
  window.addEventListener('beforeunload',function(){ SCORM.finish(); });
  window.SCORM=SCORM;
})();

</script>

  else root.setProperty('--frame-w','0px');
  // Back/Forward/Restart live under Debug features now (only shown when debug is on).
  var on = !!dbg.enabled, any = on && (dbg.back||dbg.forward||dbg.restart);

  byId('vn-back').style.display    = (on&&dbg.back)?'inline-block':'none';

/* ============================================================================
   Scenemaker player; rich text (mini-markup -> safe HTML)
   Shares the exact markup spec with the editor's live preview.
   Global vnRenderRich(); loaded before runtime.js.
   ==========================================================================*/
(function(){
  var COLOR_OK=/^#[0-9a-fA-F]{3,6}$/;
  var NAMED={red:1,blue:1,green:1,yellow:1,orange:1,purple:1,pink:1,white:1,black:1,cyan:1,magenta:1,gray:1,grey:1,gold:1,lime:1,teal:1,navy:1,brown:1};
  var URL_OK=/^https?:\/\//i; // http(s) only - blocks javascript:/data: etc from a malicious/tampered .vnproj
  function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
  window.vnRenderRich=function(t){
    var s=escapeHtml(t);
    // #146: [url=https://...]label[/url] - hyperlinks in dialogue text. The
    // URL comes through escapeHtml() above already ('&' etc escaped), so
    // only quotes need escaping before it lands inside an href="" attribute;
    // an unrecognized scheme (not plain http/https) renders as plain text
    // instead of a live link rather than risking a javascript: URL.
    s=s.replace(/\[url=([^\]]+)\]([\s\S]*?)\[\/url\]/g,function(m,url,inner){
      // stopPropagation: the stage/dialogue box advance to the next line on
      // any click, so without this a link click would ALSO skip the line
      // out from under the reader the instant they click it.
      return URL_OK.test(url) ? '<a href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+inner+'</a>' : inner;
    });
    s=s.replace(/\[c=([#0-9a-zA-Z]+)\]([\s\S]*?)\[\/c\]/g,function(m,c,inner){ c=c.toLowerCase(); return (COLOR_OK.test(c)||NAMED[c])?'<span style="color:'+c+'">'+inner+'</span>':inner; });
    // #99: [kw=<color>|<bold>|<italic>]text[/kw] - the keyphrase/character-name
    // highlighter and per-variable {{token}} style both emit this internally
    // (never hand-typed); a compact payload avoids any combination ambiguity
    // between separately-nested **bold**/*italic* markers.
    s=s.replace(/\[kw=([^|\]]*)\|([01]?)\|([01]?)\]([\s\S]*?)\[\/kw\]/g,function(m,c,b,it,inner){
      c=c.toLowerCase(); var colorOk=c&&(COLOR_OK.test(c)||NAMED[c]);
      var out=inner; if(it==='1') out='<i>'+out+'</i>'; if(b==='1') out='<b>'+out+'</b>';
      return colorOk ? '<span style="color:'+c+'">'+out+'</span>' : out;
    });
    s=s.replace(/\[big\]([\s\S]*?)\[\/big\]/g,'<span style="font-size:1.35em">$1</span>');
    s=s.replace(/\[small\]([\s\S]*?)\[\/small\]/g,'<span style="font-size:.8em">$1</span>');
    s=s.replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>');
    s=s.replace(/\*([\s\S]+?)\*/g,'<i>$1</i>');
    s=s.replace(/__([\s\S]+?)__/g,'<u>$1</u>');
    s=s.replace(/~~([\s\S]+?)~~/g,'<s>$1</s>');
    return s;
  };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; typewriter (text speed) engine  (feature #8)
   Reveals a line's text by letter, by word, by whole line, or instantly, at a
   chosen speed. Markup-agnostic: it types the PLAIN text, then swaps in the fully
   formatted (rich) version when done. Exposes window.VNType:
       VNType.play(el, markup, speed, onDone)   speed = {mode, speed(1..10)}
       VNType.finish()      finish the current reveal immediately (skip)
       VNType.typing()      → true while a reveal is in progress
       VNType.onTick        optional hook(el, index, unit); used by the typing
                            sound / word-trigger features (#9/#7) when present.
   Loaded before runtime.js so runtime can call it.
   ==========================================================================*/
window.VNType = (function(){
  var timer=null, el=null, full=null, cb=null, active=false;
  // #81: pause/resume support for the "stop when the box is full" overflow
  // mode - units/i/delay are hoisted out of play() (not just local to it) so
  // resume() can restart the same reveal exactly where pause() left it,
  // instead of needing its own copy of the reveal state.
  var units=null, i=0, delay=130, paused=false, pageStart=0;

  function delayFor(speed){
    var s = (speed && speed.speed!=null) ? Number(speed.speed) : 5; // 1 (slow) .. 10 (fast)
    return Math.max(6, Math.round(130 - s*12)); // ms per unit
  }
  function clear(){ if(timer){ clearInterval(timer); timer=null; } }

  // pageStart lets the visible text be a WINDOW into the full reveal
  // (units[pageStart..i]) rather than always from the very start - see
  // nextPage() below, the "stop when the box is full" overflow mode.
  function tick(){
    i++; el.textContent = units.slice(pageStart,i).join('');
    if(typeof VNType.onTick==='function'){ try{ VNType.onTick(el, i, units[i-1], delay); }catch(e){} }
    if(i>=units.length) done();
  }

  function done(){
    clear(); paused=false; pageStart=0;
    if(el && full!=null) el.innerHTML = full;
    active=false; var d=cb; cb=null; el=null; full=null; units=null;
    if(d) d();
  }

  function play(target, markup, speed, onDone){
    finish(); // wrap up anything mid-reveal
    var rich = window.vnRenderRich ? window.vnRenderRich(markup||'') : (markup||'');
    var mode = (speed && speed.mode) || 'letter';
    if(mode==='instant' || mode==='line'){ target.innerHTML = rich; active=false; onDone&&onDone(); return; }
    // derive the plain text from the rendered rich HTML (markup-agnostic)
    var tmp=document.createElement('div'); tmp.innerHTML=rich; var plain=tmp.textContent||'';
    if(!plain){ target.innerHTML=rich; active=false; onDone&&onDone(); return; }
    units = (mode==='word') ? (plain.match(/\S+\s*/g) || [plain]) : plain.split('');
    el=target; full=rich; cb=onDone; active=true; paused=false; pageStart=0;
    i=0; delay=delayFor(speed);
    el.textContent='';
    timer=setInterval(tick, delay);
  }

  function finish(){ if(active) done(); }
  function typing(){ return active; }
  // pause: stops revealing more units without finishing the line (unlike
  // finish(), the un-typed remainder stays un-typed) - the box keeps showing
  // whatever's already visible. No-op if not currently active or already paused.
  function pause(){ if(active && !paused && timer){ clear(); paused=true; } }
  function isPaused(){ return paused; }
  // #81: resumes a paused reveal as a fresh PAGE - clears the box and moves
  // the visible window to start from here, instead of continuing to append
  // onto text that already filled the box (which would just re-overflow on
  // the very next unit, forever). Only meaningful use of a pause right now
  // is the "stop when the box is full" overflow mode.
  function nextPage(){ if(active && paused){ pageStart=i; if(el) el.textContent=''; paused=false; timer=setInterval(tick, delay); } }

  return { play:play, finish:finish, typing:typing, pause:pause, isPaused:isPaused, nextPage:nextPage, onTick:null };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; typing sound  (features #9, #3)
   Earthbound-style "blip" per typed character, synthesized with Web Audio (no
   audio file). Config comes from the speaking character:
       {enabled, wave, pitch(1..10), volume(1..10), chirp(0..10), detune(0..10)}
   wave: square | sine | triangle | sawtooth | noise (alien static).
   chirp: slides the pitch down over the blip. detune: adds a second detuned
   voice for a richer / weirder / alien tone. Driven by VNType.onTick.
   ==========================================================================*/
window.VNTypeSound = (function(){
  var ctx=null, cfg=null, master=1;
  function setMasterVolume(v){ master=Math.max(0,Math.min(1,Number(v))); }
  function ac(){ if(!ctx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ try{ ctx=new AC(); }catch(e){} } } return ctx; }
  function set(c){ cfg = (c && c.enabled) ? c : null; }
  function freqFor(p){ return 140 + (Number(p)||6) * 70; }        // pitch 1..10 → ~210..840 Hz
  var _lastBlip=0;
  function blip(unit, delayMs){
    if(!cfg) return;
    if(unit!=null && /^\s+$/.test(unit)) return; // skip whitespace
    var now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
    if(now-_lastBlip < 33) return;   // throttle to ~30/sec so fast typing stays crisp, not a buzz
    _lastBlip=now;
    var a=ac(); if(!a) return;
    if(a.state==='suspended' && a.resume){ try{ a.resume(); }catch(e){} }
    try{
      var t=a.currentTime, dur=(delayMs>0)?Math.max(0.018,Math.min(0.06, (delayMs/1000)*0.85)):0.06;
      var vol=Math.max(0,Math.min(1,(Number(cfg.volume)||5)/10))*0.14*master;
      var g=a.createGain(); g.connect(a.destination);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      var freq=freqFor(cfg.pitch), chirp=Number(cfg.chirp)||0, detune=Number(cfg.detune)||0;
      if((cfg.wave||'square')==='noise'){
        var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
        for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
        var src=a.createBufferSource(); src.buffer=buf; src.connect(g); src.start(t); src.stop(t+dur); return;
      }
      function voice(det){
        var o=a.createOscillator(); o.type=cfg.wave||'square';
        o.frequency.setValueAtTime(freq,t);
        if(chirp) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*(1-chirp*0.06)), t+dur);
        if(det) o.detune.value=det;
        o.connect(g); o.start(t); o.stop(t+dur);
      }
      voice(0);
      if(detune) voice(detune*14); // second detuned voice
    }catch(e){}
  }
  return { set:set, blip:blip, setMasterVolume:setMasterVolume };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; per-line sound effects  (feature #7)
   Each dialogue line can carry sound effects. An effect plays either after a
   delay from when the line appears, or the moment a chosen word is revealed by
   the typewriter. Effects can loop (off by default); any looping/queued effect
   is stopped when the line changes.
       VNSfx.load(sfxArray)      arm a line's effects (media values are ready URLs)
       VNSfx.tick(typedText)     called per typed unit; fires word-triggered ones
       VNSfx.stop()              stop + clear everything (called on line change)
   ==========================================================================*/
window.VNSfx = (function(){
  var timers=[], audios=[], pending=[], master=1;
  function setMasterVolume(v){ master=Math.max(0,Math.min(1,Number(v))); audios.forEach(function(a){ try{ a.volume=master; }catch(e){} }); }
  function stop(){
    timers.forEach(clearTimeout); timers=[];
    audios.forEach(function(a){ try{ a.pause(); }catch(e){} }); audios=[];
    pending=[];
  }
  function fire(url, loop){
    try{ var a=new Audio(url); a.loop=!!loop; a.volume=master; audios.push(a); var p=a.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){}
  }
  function load(sfxArr){
    stop();
    (sfxArr||[]).forEach(function(s){
      if(!s || !s.media) return;
      if(s.onWord){ pending.push({ word:String(s.onWord).toLowerCase(), url:s.media, loop:s.loop, done:false }); }
      else { timers.push(setTimeout(function(){ fire(s.media, s.loop); }, Math.max(0, Number(s.delay)||0))); }
    });
  }
  function tick(typedText){
    if(!pending.length) return;
    var lower=String(typedText||'').toLowerCase();
    pending.forEach(function(p){ if(!p.done && lower.indexOf(p.word)>=0){ p.done=true; fire(p.url, p.loop); } });
  }
  return { load:load, tick:tick, stop:stop, setMasterVolume:setMasterVolume };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; menu cursor sound
   A short "blip" played whenever the pointer hovers, or keyboard focus lands
   on, a menu option - choice buttons and the HUD Settings menu's own items.
   Off by default (project.settings.cursorSound.enabled). No media set means
   "play the built-in synthesized blip" (a quick two-tone chirp, Web Audio,
   no bundled file - same no-external-asset approach typesound.js already
   uses for the typing blip); a custom media key overrides it. Shares the
   existing SFX volume channel rather than adding a whole new one.
   ==========================================================================*/
window.VNCursorSound = (function(){
  var ctx=null, cfg=null, customUrl=null, master=1;
  function ac(){ if(!ctx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ try{ ctx=new AC(); }catch(e){} } } return ctx; }
  function setMasterVolume(v){ master=Math.max(0,Math.min(1,Number(v))); }
  function set(c, mediaUrl){ cfg=(c&&c.enabled)?c:null; customUrl=(cfg&&mediaUrl)?mediaUrl:null; }
  function playDefault(){
    var a=ac(); if(!a) return;
    if(a.state==='suspended' && a.resume){ try{ a.resume(); }catch(e){} }
    try{
      var t=a.currentTime, dur=0.07;
      var g=a.createGain(); g.connect(a.destination);
      g.gain.setValueAtTime(0.16*master,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      var o=a.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(880, t+dur*0.6);
      o.connect(g); o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  function play(){
    if(!cfg) return;
    if(customUrl){ try{ var a=new Audio(customUrl); a.volume=master; var p=a.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} return; }
    playDefault();
  }
  return { set:set, play:play, setMasterVolume:setMasterVolume };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; full-screen effects  (feature #8, player side)
   window.VNFx.apply(list) layers any number of simultaneous effects: colour/
   contrast filters (combined into one CSS filter string), overlay washes
   (crt/glitch/bow/warm/cold/vignette, each its own layer) and, for weather/
   dust, independent animated canvas particle systems - e.g. CRT scanlines
   with a vignette and light snow, all applied together (#10). list is
   [{type, intensity}, ...]; apply() also still accepts the older single
   {overlay, filter, intensity} shape for projects that never touched the
   new stacked picker, so nothing changes for them. Self-contained: injects
   its own CSS.
   ==========================================================================*/
(function(){
  var root, filterTarget, layer, effectsLayer, canvas, cctx, raf=null, W=0, H=0;
  var particleSets={}; // type -> parts[]
  var particleIntensity={}; // type -> intensity, so a window resize can reseed at the right density
  var TRUE_FILTERS=['sepia','noir','contrast','dream'];
  var WASH_OR_OVERLAY=['warm','cold','vignette','crt','glitch','bow'];
  var PARTICLE_TYPES=['snow','rain','dust'];
  function css(){
    if(document.getElementById('vn-fx-css')) return;
    var s=document.createElement('style'); s.id='vn-fx-css';
    s.textContent=[
      '#vn-fx{position:absolute;inset:0;pointer-events:none;z-index:42;overflow:hidden}',
      '#vn-fx-layers{position:absolute;inset:0}',
      '#vn-fx-layers>div,#vn-fx>canvas{position:absolute;inset:0;width:100%;height:100%}',
      '.fx-crt{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply;animation:fxflick 6s infinite}',
      '.fx-crt:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}',
      '@keyframes fxflick{0%,100%{opacity:.9}48%{opacity:.82}50%{opacity:1}}',
      '.fx-glitch{background:linear-gradient(90deg,rgba(255,0,60,.10),rgba(0,255,255,.10));mix-blend-mode:screen;animation:fxglitch .7s steps(2) infinite,fxtear 2.4s steps(1) infinite}',
      '@keyframes fxglitch{0%{transform:translateX(0)}20%{transform:translateX(-3px)}22%{transform:translateX(3px)}24%{transform:translateX(0)}70%{transform:translateX(2px)}72%{transform:translateX(0)}}',
      '.fx-vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}',
      '.fx-bow{background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 60px 20px rgba(0,0,0,.35)}',
      '.fx-bow:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05),transparent 40%);border-radius:50%/8%}',
      '@keyframes fxtear{0%,100%{clip-path:inset(0 0 0 0)}42%{clip-path:inset(18% 0 60% 0)}44%{clip-path:inset(60% 0 12% 0);transform:translateX(4px)}46%{clip-path:inset(0 0 0 0);transform:translateX(-4px)}80%{clip-path:inset(40% 0 40% 0)}82%{clip-path:inset(0 0 0 0)}}',
      '.fx-warm{background:rgba(255,168,74,.28);mix-blend-mode:soft-light}',
      '.fx-cold{background:rgba(70,130,255,.26);mix-blend-mode:soft-light}'
    ].join('\n');
    document.head.appendChild(s);
  }
  function ensure(){
    css();
    root=document.getElementById('vn-root')||document.body;
    filterTarget=document.getElementById('vn-screen')||document.getElementById('vn-stage')||root;
    layer=document.getElementById('vn-fx');
    if(!layer){ layer=document.createElement('div'); layer.id='vn-fx'; root.appendChild(layer); }
    if(!effectsLayer){ effectsLayer=document.createElement('div'); effectsLayer.id='vn-fx-layers'; layer.appendChild(effectsLayer); }
    if(!canvas){ canvas=document.createElement('canvas'); layer.appendChild(canvas); cctx=canvas.getContext('2d'); }
  }
  function filterCss(f,k){ // k = intensity 0.2..2
    switch(f){
      case 'sepia':    return 'sepia('+(0.55*k)+') saturate(1.15)';
      case 'noir':     return 'grayscale('+Math.min(1,0.85*k)+') contrast('+(1+0.12*k)+')';
      case 'contrast': return 'contrast('+(1+0.32*k)+') saturate('+(1+0.22*k)+')';
      case 'dream':    return 'brightness('+(1+0.06*k)+') saturate(1.15) blur('+(0.6*k)+'px)';
      default: return 'none';
    }
  }
  function resize(){ if(!canvas) return; var r=(root&&root.getBoundingClientRect)?root.getBoundingClientRect():{width:960,height:600};
    W=canvas.width=Math.max(2,r.width||960); H=canvas.height=Math.max(2,r.height||600); }
  function newPart(type,intensity){ var s=(intensity||5)/5;
    if(type==='rain') return {x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*12,v:6+Math.random()*6*s};
    if(type==='snow') return {x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,v:0.5+Math.random()*1.2*s,sway:Math.random()*6};
    return {x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.5,v:0.15+Math.random()*0.5*s,a:0.2+Math.random()*0.4}; // dust
  }
  function seed(type,intensity){ var n=Math.round((type==='rain'?120:type==='snow'?90:70)*((intensity||5)/6));
    var arr=[]; for(var i=0;i<n;i++) arr.push(newPart(type,intensity)); return arr; }
  function drawType(t,parts){
    if(t==='rain'){ cctx.strokeStyle='rgba(150,180,255,.5)'; cctx.lineWidth=1;
      parts.forEach(function(p){ cctx.beginPath(); cctx.moveTo(p.x,p.y); cctx.lineTo(p.x-2,p.y+p.l); cctx.stroke(); p.y+=p.v; p.x-=1; if(p.y>H){ p.y=-10; p.x=Math.random()*W; } }); }
    else if(t==='snow'){ cctx.fillStyle='rgba(255,255,255,.85)';
      parts.forEach(function(p){ cctx.beginPath(); cctx.arc(p.x,p.y,p.r,0,7); cctx.fill(); p.y+=p.v; p.x+=Math.sin((p.y+p.sway)/30)*0.6; if(p.y>H){ p.y=-6; p.x=Math.random()*W; } }); }
    else if(t==='dust'){ parts.forEach(function(p){ cctx.fillStyle='rgba(220,210,190,'+p.a+')'; cctx.beginPath(); cctx.arc(p.x,p.y,p.r,0,7); cctx.fill(); p.y+=p.v; p.x+=Math.sin(p.y/40)*0.3; if(p.y>H){ p.y=-4; p.x=Math.random()*W; } }); }
  }
  function frame(){
    if(!cctx){ raf=null; return; }
    var types=Object.keys(particleSets);
    if(!types.length){ raf=null; return; }
    cctx.clearRect(0,0,W,H);
    types.forEach(function(t){ drawType(t,particleSets[t]); });
    raf=requestAnimationFrame(frame);
  }
  // #10: accepts either the new [{type,intensity},...] stacked list, or the
  // older single {overlay,filter,intensity} object (projects/scenes/groups
  // that never touched the new picker); both resolve to the same internal shape.
  function normalizeList(fx){
    if(Array.isArray(fx)) return fx.filter(function(f){ return f && f.type && f.type!=='none'; });
    var out=[]; if(fx){
      if(fx.overlay && fx.overlay!=='none') out.push({type:fx.overlay, intensity:fx.intensity||5});
      if(fx.filter && fx.filter!=='none') out.push({type:fx.filter, intensity:fx.intensity||5});
    }
    return out;
  }
  function apply(fx){
    ensure();
    var list=normalizeList(fx);
    // 1. every true-CSS-filter entry (sepia/noir/contrast/dream) combines into one filter string
    var filterParts=[];
    list.forEach(function(f){ if(TRUE_FILTERS.indexOf(f.type)>=0){ var part=filterCss(f.type,(f.intensity||5)/5); if(part!=='none') filterParts.push(part); } });
    if(filterTarget) filterTarget.style.filter = filterParts.length ? filterParts.join(' ') : 'none';
    // 2. washes (warm/cold/vignette) and CSS overlays (crt/glitch/bow) each get their own layer
    effectsLayer.innerHTML='';
    var bow=null;
    list.forEach(function(f){
      if(WASH_OR_OVERLAY.indexOf(f.type)<0) return;
      var div=document.createElement('div');
      div.className='fx-'+f.type;
      div.style.opacity=Math.min(1,0.5+0.05*(f.intensity||5));
      effectsLayer.appendChild(div);
      if(f.type==='bow') bow=f;
    });
    if(filterTarget){
      filterTarget.style.borderRadius = bow ? Math.round(6+(bow.intensity||5)*1.4)+'px' : '';
      filterTarget.style.overflow = bow ? 'hidden' : '';
    }
    // 3. weather/dust: independent particle systems, one per active type, sharing one canvas
    var wanted={};
    list.forEach(function(f){ if(PARTICLE_TYPES.indexOf(f.type)>=0) wanted[f.type]=f.intensity||5; });
    Object.keys(particleSets).forEach(function(t){ if(!(t in wanted)){ delete particleSets[t]; delete particleIntensity[t]; } });
    if(Object.keys(wanted).length){
      resize();
      Object.keys(wanted).forEach(function(t){ particleIntensity[t]=wanted[t]; if(!particleSets[t]) particleSets[t]=seed(t,wanted[t]); });
      canvas.style.display='block';
      if(!raf) frame();
    } else {
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      if(cctx) cctx.clearRect(0,0,W,H);
      if(canvas) canvas.style.display='none';
    }
  }
  function clear(){ apply([]); }
  window.addEventListener('resize', function(){
    var types=Object.keys(particleSets); if(!types.length) return;
    resize();
    types.forEach(function(t){ particleSets[t]=seed(t,particleIntensity[t]); });
  });
  window.VNFx={ apply:apply, clear:clear };
})();

</script>
<script>
/* ============================================================================
   Scenemaker player; one-shot animated effects  (feature #2)
   window.VNSceneFx.fire('flash') plays a brief full-screen effect: light
   flashes, screen shake, glitch bursts, static, and more. Fired from cues tied
   to scene start/end, line start/end, a word being typed, or a character
   appearing. Self-contained CSS.
   ==========================================================================*/
(function(){
  var EFFECTS = ['flash','whiteflash','redflash','blueflash','shake','bigshake','rumble','glitch','static','zoompunch','blurpulse','fadeblack','fadewhite','invert','lightning','vignettepulse','chromatic','ripple','confetti','fireworks','goodcheck','badx'];
  function css(){ if(document.getElementById('vn-sfx-css')) return;
    var s=document.createElement('style'); s.id='vn-sfx-css';
    s.textContent=[
      '#vn-scenefx{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}',
      '.sfx-layer{position:absolute;inset:0}',
      '@keyframes sfxFlash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}',
      '@keyframes sfxLightning{0%,100%{opacity:0}8%{opacity:.95}16%{opacity:.1}26%{opacity:.85}40%{opacity:0}70%{opacity:.6}82%{opacity:0}}',
      '@keyframes sfxFadeIn{0%{opacity:0}45%{opacity:1}100%{opacity:0}}',
      '@keyframes sfxInvert{0%,100%{filter:none}30%,60%{filter:invert(1) hue-rotate(180deg)}}',
      '@keyframes sfxBlur{0%,100%{filter:none}50%{filter:blur(6px)}}',
      '@keyframes sfxZoom{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}55%{transform:scale(.97)}}',
      '@keyframes sfxShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-6px,3px)}20%{transform:translate(7px,-4px)}30%{transform:translate(-8px,-3px)}40%{transform:translate(6px,5px)}50%{transform:translate(-5px,4px)}60%{transform:translate(6px,-5px)}70%{transform:translate(-6px,3px)}80%{transform:translate(5px,4px)}90%{transform:translate(-3px,-2px)}}',
      '@keyframes sfxBigShake{0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-14px,8px) rotate(-1deg)}30%{transform:translate(15px,-10px) rotate(1deg)}45%{transform:translate(-16px,-8px) rotate(-1deg)}60%{transform:translate(13px,11px) rotate(1deg)}75%{transform:translate(-11px,7px) rotate(-.5deg)}90%{transform:translate(8px,-6px)}}',
      '@keyframes sfxRumble{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}}',
      '@keyframes sfxGlitchLayer{0%{opacity:0;clip-path:inset(0 0 100% 0)}10%{opacity:.9;clip-path:inset(20% 0 40% 0);transform:translateX(8px)}22%{clip-path:inset(60% 0 10% 0);transform:translateX(-10px)}34%{clip-path:inset(0 0 70% 0);transform:translateX(6px)}50%{opacity:.5}100%{opacity:0;transform:translateX(0)}}',
      '@keyframes sfxStatic{0%,100%{opacity:0}10%,90%{opacity:.5}}',
      '@keyframes sfxRipple{0%{transform:scale(0);opacity:.6}100%{transform:scale(2.4);opacity:0}}',
      '.sfx-shake{animation:sfxShake .5s ease}.sfx-bigshake{animation:sfxBigShake .7s ease}.sfx-rumble{animation:sfxRumble .12s linear 8}',
      '.sfx-zoompunch{animation:sfxZoom .45s ease}.sfx-blurpulse{animation:sfxBlur .6s ease}.sfx-invert{animation:sfxInvert .5s steps(2)}',
      // Celebration / bad-choice: a big green check or red X, popping in

    var spk=characterFor(line);

    var _lay=(window.VNLayout&&VNLayout.resolved)?VNLayout.resolved(P,scene):null;
    var boxes=[box]; ['2','3','4'].forEach(function(n){ var cfg=_lay&&_lay['box'+n]; if(cfg&&cfg.enabled){ var bx=document.getElementById('vn-box'+n); if(bx) boxes.push(bx); } });
    var slot=0; (scene.cast||[]).forEach(function(c,ix){ if(c.id===line.speakingCast) slot=ix; });
    // #92: a library-linked speaker keeps their remembered box slot from an
    // earlier scene instead of just this scene's own cast order, if one is
    // already on record; either way, record (or re-affirm) that raw
    // preference AFTER computing it, so a later scene with fewer boxes
    // clamping it down doesn't corrupt what gets remembered for a scene
    // with more boxes again after that.
    var castEntry=(scene.cast||[]).filter(function(c){return c.id===line.speakingCast;})[0];
    var persistId=(spk && castEntry && castEntry.charId===spk.id) ? spk.id : null;
    if(persistId){ if(_charBoxSlot[persistId]!=null) slot=_charBoxSlot[persistId]; else _charBoxSlot[persistId]=slot; }
    var boxIdx = (boxes.length>1) ? Math.min(slot, boxes.length-1) : 0;
    var activeBox=boxes[boxIdx];
    var tEl = boxIdx===0 ? textEl : document.getElementById('vn-text'+(boxIdx+1));
    var sEl = boxIdx===0 ? speakerEl : document.getElementById('vn-speaker'+(boxIdx+1));
    if(!tEl){ tEl=textEl; sEl=speakerEl; activeBox=box; boxIdx=0; }
    _spokenSlots[boxIdx]=true;
    // #98: an opt-in setting - the currently-speaking box's border tints to
    // that character's own editor colour (Characters panel), so a reader can
    // tell speakers apart at a glance the same way the editor already can.
    // Always resets first, win or lose: activeBox is the SAME element reused
    // across every line, so a stale tint from an earlier colored speaker
    // must not linger once a colorless one (or this whole setting) applies.
    activeBox.style.borderWidth=''; activeBox.style.borderStyle=''; activeBox.style.borderColor='';
    if(P.settings && P.settings.screen && P.settings.screen.charColorBorders && spk && spk.color){
      activeBox.style.borderWidth='2px'; activeBox.style.borderStyle='solid'; activeBox.style.borderColor=spk.color;
    }
    // #80: a non-active box keeps showing whatever it last said (just
    // dimmed via vn-box-dim below) instead of going blank the moment a
    // different character speaks - it only actually clears once that box
    // itself goes away (layout.js's apply(), when its `enabled` flag turns
    // off). Optionally (hideUntilSpoken), an extra box (2-4) that's never
    // had a line yet stays fully hidden rather than sitting there empty;
    // the main box always shows, so nothing that already assumes it's
    // present has to change.
    var hideUnspoken=(window.VNLayout&&VNLayout.hideUntilSpoken)?VNLayout.hideUntilSpoken(P,scene):false;
    boxes.forEach(function(bx,i){ if(!bx) return;
      if(i>0) bx.style.display=(hideUnspoken && !_spokenSlots[i]) ? 'none' : 'flex';
      bx.classList.toggle('vn-box-dim', i!==boxIdx); });
    tEl.style.fontFamily=fontStack(line.font); sEl.style.fontFamily=fontStack(line.font);
    sEl.textContent=nm;
    if(sEl===speakerEl && _lay && _lay.name && _lay.name.mode==='portrait'){
      // display is fully owned by applyNameToPortrait (called from
      // renderStage(), above), which knows whether there's an actual
      // portrait to attach the name to - not just whether there's name
      // text - so a stray name never floats at a stale leftover position.
    } else { sEl.style.display=nm?'inline-block':'none'; }
    VNTypeSound.set(spk && spk.typeSound);
    VNSfx.load(_lineAudioClips(line));
    _curScene=scene; _curActiveBox=activeBox; tEl.scrollTop=0; // #81: fresh line starts scrolled to its top
    VNType.play(tEl, subst(applyKeywordHighlights(line.text||''), true), effectiveSpeed(line), function(){ VNSfx.tick(tEl.textContent); tickWordCues(tEl.textContent); fireCues(line.vfx,'end'); portraitLayer.style.bottom=_portraitsBottomPx(box)+'px'; if(window.VNLayout && VNLayout.applyName && _lay) VNLayout.applyName(_lay, box, document.getElementById('vn-frame')); });
    var doc=line.doc||{media:null};
    if(doc.media){ docBtn.style.display='inline-block'; docBtn.textContent='\uD83D\uDCC4 '+(doc.label||'Open document'); docBtn.onclick=function(e){ e.stopPropagation(); window.open(mediaSrc(doc.media),'_blank'); }; }
    else docBtn.style.display='none';
    choicesEl.innerHTML=''; canAdvance = visibleIdx(scene, idx+1, sceneVisits(scene.id)) < scene.lines.length;
    if(canAdvance){ showContinuePrompt(scene, activeBox); } else { hideContinuePrompt(); checkComplete(scene); endOrChoices(scene, choicesEl); }
    // Anchor the portrait area to the actual box height so faces sit ABOVE the
    // dialogue box (and never overlap the box or the name) as it grows/shrinks.
    portraitLayer.style.bottom = _portraitsBottomPx(box) + 'px';
    // #tab-reflow: VNLayout.apply() (and the tab's own position within it)
    // already ran once this line, back when the box still held the PREVIOUS
    // line's content - before a fixed-height box that grows to fit (see
    // layout.js's styleBox()) had actually grown for this one. A 'tab' name
    // mode reads the box's rendered offsetTop/offsetWidth, so this first
    // re-run (right after THIS line's choices, if any, are already in the
    // box) gets it close immediately. It isn't the last word, though: with
    // little or no choices and a lot of DIALOGUE TEXT, the box's real height
    // comes mostly from the typewriter revealing that text over time, not
    // from anything present yet at this synchronous point - a second real
    // report found the tab still landing inside the box, this time on a
    // single-line ending with no choices at all. The SAME call also runs
    // inside VNType.play()'s own onDone callback above (which fires once
    // typing truly finishes, naturally or via a skip-to-end click, exactly
    // where portraitLayer's own re-measurement already happens) - that's the
    // one guaranteed to see the box at its final, fully-grown height.
    if(window.VNLayout && VNLayout.applyName && _lay) VNLayout.applyName(_lay, box, document.getElementById('vn-frame'));
  }

  function showCutsceneLine(scene, idx){
    // A real report: an empty, styled little pill stayed visible, floating
    // over the frame, whenever a cutscene showed - a 'tab'/'free' name mode
    // positions #vn-speaker as a sibling of the box (not inside it, so it can
    // sit ON the box's edge), so hiding the BOX alone never hid this too; on
    // a project's very first scene it's even emptier, since no dialogue line
    // has ever run yet to give it a display style at all.
    box.style.display='none'; if(speakerEl) speakerEl.style.display='none'; if(narrEl) narrEl.style.display='none'; portraitLayer.style.display='none'; csEl.style.display='block'; if(choicesEl) choicesEl.innerHTML='';
    _viewerTeardown(); // #90: leaving a viewer scene stops its video/drag state rather than leaving it running hidden
    hideContinuePrompt(); // a free-floating prompt lives outside the box, so it needs its own clear here
    clearStage(); stageScene=null;
    var cs=scene.cutscene||{dim:0.4,effect:'shadow',size:'lg',align:'center'};
    csDim.style.opacity = (cs.dim!=null?cs.dim:0.4);
    csWrap.className = 'align-'+(cs.align||'center');
    var line=scene.lines[idx]||{text:'',font:''};
    csText.className = 'size-'+(cs.size||'lg')+' fx-'+(cs.effect||'shadow');
    csText.style.fontFamily=fontStack(line.font);
    var csSpk=characterFor(line);
    VNTypeSound.set(csSpk && csSpk.typeSound);
    VNSfx.load(_lineAudioClips(line));
    VNType.play(csText, subst(applyKeywordHighlights(line.text||''), true), effectiveSpeed(line), function(){ VNSfx.tick(csText.textContent); });
    csChoices.innerHTML=''; canAdvance = visibleIdx(scene, idx+1, sceneVisits(scene.id)) < scene.lines.length;
    if(canAdvance){ var h=document.createElement('div'); h.className='vn-hint'; h.textContent='\u25B8 click to continue'; csChoices.appendChild(h); }
    else { checkComplete(scene); endOrChoices(scene, csChoices); }
  }

  // #90: viewer scenes (a whole screen dedicated to examining one photo or
  // video). _viewerActive gates the shared drag/wheel listeners (set up
  // once in boot(), not re-attached per scene) so they're no-ops whenever a
  // viewer isn't actually on screen; _viewerZoom/_viewerOffX/_viewerOffY are
  // the photo's current pan/zoom state, reset fresh every time this renders.
  var _viewerActive=false, _viewerZoom=1, _viewerOffX=0, _viewerOffY=0;
  var _viewerDrag=null, _viewerDragMoved=false;
  function _viewerClamp(){
    var sw=viewerStage.clientWidth||1, sh=viewerStage.clientHeight||1;
    var iw=viewerImg.naturalWidth||sw, ih=viewerImg.naturalHeight||sh;
    var rh=sh*_viewerZoom, rw=(iw/ih)*rh; // rendered at height:100% * zoom, width follows the image's own aspect ratio

    _viewerOffY=Math.max(-maxY,Math.min(maxY,_viewerOffY));
  }
  function _viewerApply(){
    viewerImg.style.transform='translate(-50%,-50%) translate('+_viewerOffX+'px,'+_viewerOffY+'px) scale('+_viewerZoom+')';
  }
  function _viewerTeardown(){
    _viewerActive=false; _viewerDrag=null;
    if(viewerEl) viewerEl.style.display='none';
    if(viewerVideo){ try{ viewerVideo.pause(); }catch(e){} viewerVideo.onended=null; viewerVideo.removeAttribute('src'); viewerVideo.load(); viewerVideo.style.display='none'; }
    if(viewerImg) viewerImg.style.display='none';
    if(viewerStage) viewerStage.classList.remove('dragging');
  }
  function showViewerScene(scene, idx){
    box.style.display='none'; if(narrEl) narrEl.style.display='none'; csEl.style.display='none'; portraitLayer.style.display='none';
    if(choicesEl) choicesEl.innerHTML=''; if(csChoices) csChoices.innerHTML=''; if(narrChoices) narrChoices.innerHTML='';
    hideContinuePrompt(); clearStage(); stageScene=null;
    _viewerTeardown(); viewerEl.style.display='block';
    var line=scene.lines[idx]||{text:'',font:''};
    var v=scene.viewer||{kind:'photo360',media:null,loop:true};
    viewerCaption.style.fontFamily=fontStack(line.font);
    var capTxt=subst(applyKeywordHighlights(line.text||''), false);
    viewerCaption.textContent=capTxt; viewerCaption.style.display=capTxt?'block':'none';
    if(v.kind==='video' && v.media){
      viewerVideo.style.display='block'; viewerVideo.loop=!!v.loop; viewerVideo.src=mediaSrc(v.media);
      viewerVideo.onended=function(){ if(!viewerVideo.loop && canAdvance) advanceLine(); };
      var p=viewerVideo.play(); if(p&&p.catch) p.catch(function(){}); // autoplay can be blocked; native controls still let them press play
    } else {

      viewerImg.style.display='block'; viewerImg.src=v.media?mediaSrc(v.media):'';
      viewerImg.onload=function(){ _viewerClamp(); _viewerApply(); };
      _viewerApply(); _viewerActive=true;
    }
    viewerChoices.innerHTML=''; canAdvance = visibleIdx(scene, idx+1, sceneVisits(scene.id)) < scene.lines.length;
    if(canAdvance){ var h=document.createElement('div'); h.className='vn-hint'; h.textContent='\u25B8 click to continue'; viewerChoices.appendChild(h); }
    else { checkComplete(scene); endOrChoices(scene, viewerChoices); }
  }

  // #168: an "unattributed" line (narrator commentary, off-screen dialogue,
  // and the like) floats over the stage with no speaker name or dialogue
  // box, but unlike a cutscene it leaves the background/portraits showing
  // (dimmed by default, project.settings.narration.dimOthers) instead of
  // hiding them.
  function showNarratorLine(scene, idx){
    box.style.display='none'; csEl.style.display='none'; portraitLayer.style.display='block'; narrEl.style.display='block';
    _viewerTeardown(); // #90: leaving a viewer scene stops its video/drag state rather than leaving it running hidden
    if(choicesEl) choicesEl.innerHTML=''; if(csChoices) csChoices.innerHTML='';
    hideContinuePrompt(); // a free-floating prompt lives outside the box, so it needs its own clear here
    var line=scene.lines[idx]||{text:'',font:''};
    renderStage(scene, line); // keep portraits/background visible and current, just dimmed below
    portraitLayer.style.bottom='0px'; // no dialogue box eating space at the bottom
    fireCues(line.vfx,'start');
    _wordCues=(line.vfx||[]).filter(function(c){return c.on==='word'&&c.word;}).map(function(c){return {word:String(c.word).toLowerCase(),effect:c.effect,intensity:c.intensity,done:false};});
    var ns=(P.settings&&P.settings.narration)||{dimOthers:true};
    narrDim.style.opacity = (ns.dimOthers!==false) ? 0.55 : 0;
    narrText.style.fontFamily=fontStack(line.font);
    var nSpk=characterFor(line);
    VNTypeSound.set(nSpk && nSpk.typeSound);
    VNSfx.load(_lineAudioClips(line));
    VNType.play(narrText, subst(applyKeywordHighlights(line.text||''), true), effectiveSpeed(line), function(){ VNSfx.tick(narrText.textContent); tickWordCues(narrText.textContent); fireCues(line.vfx,'end'); });
    narrChoices.innerHTML=''; canAdvance = visibleIdx(scene, idx+1, sceneVisits(scene.id)) < scene.lines.length;
    if(canAdvance){ var h=document.createElement('div'); h.className='vn-hint'; h.textContent='\u25B8 click to continue'; narrChoices.appendChild(h); }
    else { checkComplete(scene); endOrChoices(scene, narrChoices); }
  }

  document.addEventListener('DOMContentLoaded', boot);
})();

</script>

<script>
/* ============================================================================
   Scenemaker player; on-screen tools bar  (features #4-#9)
   A small bottom bar with the tools the author enabled: fullscreen, screenshot,

(function(){
  function R(){ return window.VNRuntime; }
  function css(){ if(document.getElementById('vn-hud-css')) return;

      '.vn-ov-card h3{margin:0 0 12px}',

      '.vn-row input[type=range]{flex:1}',
