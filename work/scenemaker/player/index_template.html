<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__VN_TITLE__</title>
__VN_FONTLINKS__
<style>
/* Scenemaker player; fixed 1000x640 design stage scaled to fit any window. */
:root{
  --box-bg:rgba(9,12,20,.86); --ink:#f1f5f9; --accent:#e879f9; --btn:#1e293b; --btn-h:#334155;
  --frame:transparent; --frame-w:0px; --frame-r:0px; --font:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
/* #59: opt-in lockdown (Settings > Screen & frame), body.vn-lockdown added at boot.
   Inputs/textareas stay selectable so the "ask for input" prompt still works. */
body.vn-lockdown{-webkit-user-select:none;user-select:none}
body.vn-lockdown input,body.vn-lockdown textarea{-webkit-user-select:text;user-select:text}
#vn-fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#vn-stage{position:relative;width:1000px;height:640px;transform-origin:center center;
  color:var(--ink);font-family:var(--font);overflow:hidden;background:#0b1120}
#vn-frame{position:absolute;inset:0;overflow:hidden;border:var(--frame-w) solid var(--frame);border-radius:var(--frame-r)}

#vn-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#0b1120}
#vn-bg video{width:100%;height:100%;object-fit:cover}
#vn-portraits{position:absolute;left:0;right:0;top:0;bottom:180px;pointer-events:none;z-index:2}

/* #overlay: opt-in embed modes (window.VN_OVERLAY_OPTS; see player/overlay.js
   and scorm.py's build_overlay_html). html.vn-overlay is only ever added by
   that same script, so a normal SCORM/preview/lite export never matches any
   rule here and renders exactly as it always has. */
html.vn-overlay,html.vn-overlay body{background:transparent}
/* fullscreen: #vn-fit still fills the viewport, but its own background (and
   the stage's) go transparent too, so the host page/game shows through both
   the scaled stage's own letterbox AND any scene with no background set of
   its own - a scene WITH a background (image/video/colour) still covers it
   exactly as before. */
html.vn-overlay-fullscreen #vn-fit{background:transparent}
html.vn-overlay-fullscreen #vn-stage{background:transparent}
/* modal: #vn-fit shrinks to a centered box instead of filling the viewport;
   fitScale() (runtime.js) only ever reads its clientWidth/clientHeight, so
   the existing scale-to-fit math needs no changes to work inside this box
   instead of the full window. */
html.vn-overlay-modal #vn-fit{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);
  width:var(--vn-overlay-w,70%);height:var(--vn-overlay-h,70%);border-radius:14px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
/* the dim backdrop (opts.dim, default on) sits behind #vn-fit in both modes -
   inserted as body's first child, so normal DOM order already stacks it
   below every fixed-position sibling added after it. */
#vn-overlay-dim{position:fixed;inset:0;background:#000;pointer-events:none}
html.vn-overlay-noportraits #vn-portraits{display:none!important}

.pfx-glitch{animation:pfxGlitch .5s steps(2) infinite}
@keyframes pfxGlitch{0%,100%{transform:translateX(-50%)}30%{transform:translate(calc(-50% - 3px),0);filter:hue-rotate(20deg)}32%{transform:translate(calc(-50% + 3px),0)}34%{transform:translateX(-50%)}}
.pfx-bow{border-radius:14px}
.pfx-crt{animation:pfxCrtFlicker 6s infinite}
@keyframes pfxCrtFlicker{0%,100%{opacity:1}48%{opacity:.9}50%{opacity:1}}
.vn-face{position:absolute;bottom:0;transform:translateX(-50%);
  transition:left .35s ease, transform .35s ease, opacity .25s ease, filter .25s ease;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
.vn-face.dim{opacity:.6;transform:translateX(-50%) scale(.95);filter:brightness(.58) drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.vn-face.leaving{opacity:0}
/* #NEW: a subtle grow-and-glow while a character is the one talking (opt-in,
   Characters panel's own Intensity/Speed sliders set the custom properties
   below) - keeps the SAME base translateX(-50%) centering .vn-face already
   relies on in both keyframe stops, same as .dim above already has to. */
@keyframes vnSpeakPulse{
  0%,100%{ transform:translateX(-50%) scale(1); filter:drop-shadow(0 8px 20px rgba(0,0,0,.55)); }
  50%{ transform:translateX(-50%) scale(var(--vn-pulse-scale,1.06)); filter:drop-shadow(0 8px 20px rgba(0,0,0,.55)) drop-shadow(0 0 var(--vn-pulse-glow,10px) var(--vn-pulse-color,#e879f9)); }
}
.vn-face.vn-speak-pulse{animation:vnSpeakPulse var(--vn-pulse-dur,.6s) ease-in-out infinite}
.vn-face.size-square{width:150px;height:150px;object-fit:cover;bottom:9%;border-radius:8px}
.vn-face.size-tall{height:62%;width:auto;object-fit:contain}
.vn-face.size-full{height:84%;width:auto;object-fit:contain}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
@keyframes fxLeft{from{opacity:0;transform:translateX(-50%) translateX(-90px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fxRight{from{opacity:0;transform:translateX(-50%) translateX(90px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes fxBottom{from{opacity:0;transform:translateX(-50%) translateY(70px)}to{opacity:1;transform:translateX(-50%)}}
.enter-fade{animation:fxFade .4s ease both}
.enter-fromLeft{animation:fxLeft .42s ease both}
.enter-fromRight{animation:fxRight .42s ease both}
.enter-fromBottom{animation:fxBottom .42s ease both}
.enter-none{}
.pb-none{}.pb-round{border-radius:14px;border:3px solid rgba(255,255,255,.85)}
.pb-square{border:3px solid rgba(255,255,255,.85)}.pb-soft{border-radius:20px;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.pb-glow{border-radius:12px;box-shadow:0 0 18px 3px var(--accent);border:2px solid var(--accent)}
.pb-gold{border-radius:10px;border:3px solid #d4af37;box-shadow:0 0 10px rgba(212,175,55,.5)}



.vn-hint{margin-top:6px}

.vn-face.exit-fade{animation:vnExitFade .34s ease forwards}
.vn-face.exit-toLeft{animation:vnExitLeft .34s ease forwards}
.vn-face.exit-toRight{animation:vnExitRight .34s ease forwards}
.vn-face.exit-toBottom{animation:vnExitDown .34s ease forwards}
.vn-face.exit-pop{animation:vnExitPop .3s ease forwards}
@keyframes vnExitFade{to{opacity:0}}
@keyframes vnExitLeft{to{opacity:0;transform:translateX(calc(-50% - 60px))}}
@keyframes vnExitRight{to{opacity:0;transform:translateX(calc(-50% + 60px))}}
@keyframes vnExitDown{to{opacity:0;transform:translate(-50%,60px)}}
@keyframes vnExitPop{to{opacity:0;transform:translateX(-50%) scale(.6)}}
.vn-cont-pulse{animation:vnContPulse 1.3s ease-in-out infinite}
@keyframes vnContPulse{0%,100%{opacity:.5}50%{opacity:1}}
.vn-cont-blinkArrow .vn-cont-arrow{animation:vnContBlink 1s steps(1) infinite}
.vn-cont-cursor{animation:vnContBlink 1s steps(1) infinite}
@keyframes vnContBlink{0%,100%{opacity:1}50%{opacity:0}}
.vn-cont-icon{height:1em;width:auto;vertical-align:middle}
.vn-cont-icon-blink{animation:vnContBlink 1s steps(1) infinite}
/* #98: the credits screen's own optional "auto-scrolling roll" style (Credits
   screen editor); the static (default) credits panel needs no keyframe of its
   own, still built entirely inline in runtime.js like before. */
@keyframes vnCrScroll{from{transform:translateY(0)}to{transform:translateY(-100%)}}
/* #83: scene transitions (a fade/slide on the WHOLE #vn-frame as one scene
   hands off to another) - kept separate from the character-portrait
   enter/exit keyframes above and layout.js's own box/portrait entrance
   ones, since those assume their own element's base transform/centering.
   Defined here (always loaded) rather than inside layout.js's own CSS
   injector, which only ever runs for a project that has a custom Canvas
   layout - transitions work with or without one. */
@keyframes vnSceneFadeOut{from{opacity:1}to{opacity:0}}
@keyframes vnSceneFadeIn{from{opacity:0}to{opacity:1}}
@keyframes vnSceneSlideOutUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
@keyframes vnSceneSlideInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes vnSceneSlideOutDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(40px)}}
@keyframes vnSceneSlideInDown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
@keyframes vnSceneSlideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-60px)}}
@keyframes vnSceneSlideInLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes vnSceneSlideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}
@keyframes vnSceneSlideInRight{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
/* #118: four more transition families, same "out then in" pairing as fade/slide above.
   Wipe: a hard clip-path edge sweeps across (no translation, unlike slide), same
   direction convention as slide (the boundary keeps moving the same way across
   both halves: out erases toward that edge, in then grows in from that edge). */
@keyframes vnSceneWipeOutUp{from{clip-path:inset(0 0 0% 0)}to{clip-path:inset(0 0 100% 0)}}
@keyframes vnSceneWipeInUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutDown{from{clip-path:inset(0% 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
@keyframes vnSceneWipeInDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutLeft{from{clip-path:inset(0 0% 0 0)}to{clip-path:inset(0 100% 0 0)}}
@keyframes vnSceneWipeInLeft{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneWipeOutRight{from{clip-path:inset(0 0 0 0%)}to{clip-path:inset(0 0 0 100%)}}
@keyframes vnSceneWipeInRight{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vnSceneZoomOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.15)}}
@keyframes vnSceneZoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes vnSceneIrisOut{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
@keyframes vnSceneIrisIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes vnSceneFlipOut{from{opacity:1;transform:perspective(900px) rotateY(0deg)}to{opacity:0;transform:perspective(900px) rotateY(90deg)}}
@keyframes vnSceneFlipIn{from{opacity:0;transform:perspective(900px) rotateY(-90deg)}to{opacity:1;transform:perspective(900px) rotateY(0deg)}}
.vn-cont-icon-pulse{animation:vnContPulse 1.3s ease-in-out infinite}
.vn-box2{position:absolute;background:var(--box-bg);border-bottom:2px solid var(--accent);padding:16px 22px;display:none;flex-direction:column;gap:6px;z-index:3;backdrop-filter:blur(3px);overflow-y:auto;overflow-x:hidden;transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}
.vn-speaker2{position:absolute;top:-22px;left:20px;background:var(--accent);color:#1a032b;font-weight:800;padding:2px 12px;border-radius:6px 6px 0 0;font-size:14px}
.vn-text2{font-size:19px;line-height:1.5;white-space:pre-wrap;flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
/* #92: a `transition` shorthand always replaces, never merges, with another
   rule's on the same element - so this needs the SAME left/top/width/height
   entries #vn-box/.vn-box2 declare, or a currently-dimmed (inactive) box
   would silently lose its own position transition the moment it's the one
   whose layout changes, since .vn-box-dim (also a class, same specificity)
   is declared after .vn-box2 and wins outright otherwise. */
.vn-box-dim{opacity:.42;filter:saturate(.6);transition:opacity .3s ease,left .3s ease,top .3s ease,width .3s ease,height .3s ease}
.vn-face.vn-linked{transition:opacity .35s ease}
#vn-speaker.vn-name-nobg{background:none!important;box-shadow:none!important;padding:0!important}
/* #7: "inside the box" mode reparents #vn-speaker into the box but, without
   this, still inherited the base rule's position:absolute;top:-25px below -
   meant for the floating tab/free look - so it kept rendering as a tab
   poking out above the box's top edge regardless of the chosen mode,
   mismatching the Canvas editor's own preview (.ce-spk has no absolute
   positioning at all, so it already sat correctly in the box's own flow). */
#vn-speaker.vn-name-inbox{position:static;align-self:flex-start;box-shadow:none;margin-bottom:2px}
/* #92: a custom layout's box position/size (editor/modules/canvas-editor.js,
   applied here via player/layout.js's styleBox()) can genuinely differ
   scene-to-scene or group-to-group - this glides it to its new spot instead
   of snapping. No-op for the vast majority of projects, where the box sits
   in the exact same place every scene: identical left/top/width/height
   values mean the transition has nothing to actually animate. */
/* A real report: a fixed-height layout box (layout.js's styleBox()) whose
   dialogue + choices needed more room than that height just spilled the
   extra choice buttons straight past the box's own border, below the
   visible frame. styleBox() now treats that height as a floor and lets the
   box grow with its content (capped at the stage's own bottom edge); this
   overflow-y:auto is only the fallback for the rare case that even THAT
   isn't room enough, so content scrolls inside the box instead of spilling
   past it. overflow-x stays hidden since width is never content-driven. */
#vn-box{position:absolute;left:0;right:0;bottom:0;min-height:180px;background:var(--box-bg);overflow-y:auto;overflow-x:hidden;
  backdrop-filter:blur(3px);border-top:2px solid var(--accent);padding:20px 26px 24px;display:flex;flex-direction:column;gap:8px;
  transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}
/* display:none by default: renderSceneLine() only ever sets this to
   'inline-block' once a dialogue line actually has a name to show, so
   nothing here means nothing SHOULD be visible yet - a real report found an
   empty, padded, skin-coloured pill floating over a project's opening
   cutscene, since no dialogue line (the only code path that touches this
   element's display) had run even once to hide or show it. */
#vn-speaker{position:absolute;top:-25px;left:24px;background:var(--accent);color:#1a032b;font-weight:800;display:none;
  font-size:15px;letter-spacing:.5px;padding:4px 14px;border-radius:8px 8px 0 0;margin:0;box-shadow:0 -3px 8px rgba(0,0,0,.28);z-index:1}
/* #81: only actually constrains anything once a Canvas editor layout gives
   #vn-box a real (not auto) height - flex:1 on an auto-height parent is
   inert, so a project with no custom layout keeps growing to fit exactly
   as before. Once the box IS a fixed size, this is what lets text longer
   than it can hold scroll smoothly inside it (runtime.js scrolls it as the
   typewriter reveals more) instead of visibly spilling out past the box. */
#vn-text{font-size:19px;line-height:1.55;min-height:56px;white-space:pre-wrap;flex:1 1 auto;overflow-y:auto;scroll-behavior:smooth}
#vn-doc{align-self:flex-start;background:#0369a1;border:1px solid #38bdf8;color:#e0f2fe;font-size:13px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer}
#vn-choices,#vn-cs-choices{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.vn-choice{background:var(--btn);border:1px solid #475569;color:#f1f5f9;font-size:16px;text-align:left;padding:11px 16px;border-radius:8px;cursor:pointer;transition:.12s;font-family:inherit}
.vn-choice:hover{background:var(--btn-h);border-color:var(--accent);transform:translateX(3px)}
.vn-choice.locked{opacity:.45;cursor:not-allowed;border-style:dashed}
.vn-choice.locked:hover{transform:none;border-color:#475569;background:var(--btn)}
.vn-hint{color:#94a3b8;font-size:13px;font-style:italic}
.vn-end{color:var(--accent);font-weight:700;font-size:16px;margin-bottom:6px}
.vn-roll{color:#fde68a;font-weight:700;font-size:16px;margin-bottom:6px}
.vn-share{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.vn-share .vn-hint{margin:0 0 6px}
.vn-share-row{display:flex;flex-wrap:wrap;gap:8px}
.vn-share-btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;background:rgba(15,23,42,.55);
  border:1px solid rgba(255,255,255,.28);color:#e2e8f0;cursor:pointer}
.vn-share-btn:hover{border-color:var(--accent);color:#fff}

#vn-nav{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:8}
#vn-nav button{width:34px;height:34px;border-radius:8px;background:rgba(15,23,42,.72);border:1px solid #475569;color:#e2e8f0;font-size:15px;cursor:pointer}
#vn-nav button:hover{background:rgba(51,65,85,.9);border-color:var(--accent)}
#vn-nav button[disabled]{opacity:.3;cursor:default}

/* FF7-style dialogue skin */
/* ---- play-screen skins (set on #vn-stage as sk-<style>) ---------------- */
/* Classic RPG; deep-blue gradient textbox, à la old console RPGs */
.sk-jrpg #vn-box{background:linear-gradient(180deg,#0b1e6b 0%,#071246 100%);border:4px solid #eef2ff;border-radius:10px;left:18px;right:18px;bottom:16px;box-shadow:0 0 0 2px #1e3a8a inset}
.sk-jrpg #vn-speaker{background:#eef2ff;color:#0b1e6b;top:-27px;left:22px}
.sk-jrpg #vn-text{color:#fff;text-shadow:1px 1px 0 #000}
.sk-jrpg .vn-choice,.sk-jrpg #vn-cs-choices .vn-choice,.sk-jrpg #vn-narr-choices .vn-choice,.sk-jrpg #vn-viewer-choices .vn-choice{background:linear-gradient(180deg,#12297f,#0a1a58);border:2px solid #cdd7ff;color:#fff}
/* Terminal; green phosphor on black */
.sk-terminal #vn-box{background:#020a02;border:2px solid #22c55e;border-radius:0;box-shadow:0 0 24px #16a34a55 inset}
.sk-terminal #vn-speaker{background:#052e05;color:#4ade80;border-radius:0;box-shadow:none;font-family:"VT323","Courier New",monospace;letter-spacing:2px}
.sk-terminal #vn-text{color:#4ade80;font-family:"VT323","Courier New",monospace;text-shadow:0 0 6px #22c55e88}
.sk-terminal .vn-choice,.sk-terminal #vn-cs-choices .vn-choice,.sk-terminal #vn-narr-choices .vn-choice,.sk-terminal #vn-viewer-choices .vn-choice{background:#020a02;border:1px solid #22c55e;color:#4ade80;font-family:"VT323","Courier New",monospace}
.sk-terminal .vn-choice:hover{background:#052e05}
/* Parchment; aged paper, ink serif (fantasy / tabletop) */
.sk-parchment #vn-box{background:linear-gradient(180deg,#f4e4c1,#e7d3a8);border:3px solid #7c5a2e;border-radius:6px;box-shadow:0 0 0 2px #b89b6a inset}
.sk-parchment #vn-speaker{background:#7c5a2e;color:#f4e4c1;font-family:Georgia,serif}
.sk-parchment #vn-text{color:#3a2a12;font-family:Georgia,"Times New Roman",serif}
.sk-parchment .vn-choice,.sk-parchment #vn-cs-choices .vn-choice,.sk-parchment #vn-narr-choices .vn-choice,.sk-parchment #vn-viewer-choices .vn-choice{background:#efdcb4;border:2px solid #7c5a2e;color:#3a2a12;font-family:Georgia,serif}
.sk-parchment .vn-choice:hover{background:#e2c793}
/* Comic; bold outlines, bright panel */
.sk-comic #vn-box{background:#fffbe8;border:4px solid #111;border-radius:14px;box-shadow:6px 6px 0 #111}
.sk-comic #vn-speaker{background:#ffe14d;color:#111;border:3px solid #111;border-radius:10px 10px 0 0;top:-28px}
.sk-comic #vn-text{color:#111;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:700}
.sk-comic .vn-choice,.sk-comic #vn-cs-choices .vn-choice,.sk-comic #vn-narr-choices .vn-choice,.sk-comic #vn-viewer-choices .vn-choice{background:#8ad3ff;border:3px solid #111;color:#111;font-weight:800;box-shadow:3px 3px 0 #111}
.sk-comic .vn-choice:hover{background:#5ec0ff}
/* Neon; synthwave grid glow */
.sk-neon #vn-box{background:linear-gradient(180deg,#1a0330 0%,#0b0118 100%);border:2px solid #ec4899;border-radius:8px;box-shadow:0 0 22px #ec489988,0 0 40px #22d3ee44 inset}
.sk-neon #vn-speaker{background:#22d3ee;color:#0b0118;box-shadow:0 0 14px #22d3eeaa}
.sk-neon #vn-text{color:#f5d0fe;text-shadow:0 0 8px #ec4899aa}
.sk-neon .vn-choice,.sk-neon #vn-cs-choices .vn-choice,.sk-neon #vn-narr-choices .vn-choice,.sk-neon #vn-viewer-choices .vn-choice{background:linear-gradient(180deg,#2a0845,#170229);border:1px solid #22d3ee;color:#f5d0fe;box-shadow:0 0 12px #22d3ee55}
.sk-neon .vn-choice:hover{border-color:#ec4899;box-shadow:0 0 16px #ec489988}

/* ── CUTSCENE layer (text over background, no dialogue box) ────────────── */
#vn-cs{position:absolute;inset:0;display:none;z-index:5}
#vn-cs-dim{position:absolute;inset:0;background:#000;opacity:0}
#vn-cs-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:8% 10%;z-index:1}
#vn-cs-wrap.align-top{justify-content:flex-start}
#vn-cs-wrap.align-center{justify-content:center}
#vn-cs-wrap.align-bottom{justify-content:flex-end}
#vn-cs-text{color:#fff;text-align:center;line-height:1.5;white-space:pre-wrap;font-family:inherit}
#vn-cs-text.size-md{font-size:24px}#vn-cs-text.size-lg{font-size:34px}#vn-cs-text.size-xl{font-size:46px;font-weight:800}
#vn-cs-choices{margin-top:26px;align-items:center}
/* A real report: this dark, semi-transparent fallback (for the 'plain' skin,
   or unskinned text over an arbitrary background image/video) used to also
   silently override every NAMED skin's own choice colour here specifically,
   since an id+class selector always outranks a skin's plain class-only
   .vn-choice rule regardless of source order - so a bright skin like comic
   or parchment still got this dark pill for a cutscene's continue button,
   unreadable against its own light dialogue box. Each .sk-X block above now
   repeats its own .vn-choice rule for this id too, which outranks this
   fallback wherever a skin is actually active; this rule only still applies
   with no skin at all. */
#vn-cs-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}

/* ── NARRATOR layer (#168: "unattributed" lines - floats over the stage,
   background/portraits stay visible but dim, unlike the cutscene layer) ── */
#vn-narr{position:absolute;inset:0;display:none;z-index:5}
#vn-narr-dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s ease}
#vn-narr-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8% 10%;z-index:1}
#vn-narr-text{color:#fff;text-align:center;line-height:1.5;white-space:pre-wrap;font-style:italic;font-size:22px;text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000}
#vn-narr-choices{margin-top:26px;align-items:center}
#vn-narr-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}
.fx-none{}
.fx-shadow{text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000}
.fx-emboss{text-shadow:1px 1px 0 rgba(255,255,255,.45),-1px -1px 0 rgba(0,0,0,.75)}
.fx-outline{text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 4px #000}
.fx-glow{text-shadow:0 0 10px var(--accent),0 0 22px var(--accent)}

/* ── VIEWER scene (#90: a whole scene dedicated to examining one photo or
   video, not talked over) - a photo renders as a simplified panorama (drag
   left/right/up/down to look around, wheel/pinch to zoom; a flat pan/zoom,
   not a true spherical reprojection, deliberately kept dependency-free), a
   video uses the browser's own native controls (play/pause/seek/FF/rewind
   all come free from the <video controls> element itself, rather than
   hand-rolled buttons). ────────────────────────────────────────────────── */
#vn-viewer{position:absolute;inset:0;display:none;z-index:5;background:#000}
#vn-viewer-stage{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab}
#vn-viewer-stage.dragging{cursor:grabbing}
#vn-viewer-img{position:absolute;left:50%;top:50%;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;transform:translate(-50%,-50%);display:none}
#vn-viewer-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
#vn-viewer-caption{position:absolute;left:0;right:0;bottom:6%;padding:0 10%;text-align:center;color:#fff;line-height:1.4;white-space:pre-wrap;text-shadow:0 3px 10px rgba(0,0,0,.9),0 1px 2px #000;font-size:20px;z-index:1;pointer-events:none;display:none}
#vn-viewer-choices{position:absolute;left:0;right:0;bottom:2%;display:flex;flex-direction:column;gap:9px;align-items:center;z-index:1}
#vn-viewer-choices .vn-choice{max-width:70%;text-align:center;background:rgba(15,23,42,.7)}

/* ── TITLE screen ─────────────────────────────────────────────────────── */
#vn-title{position:absolute;inset:0;display:none;z-index:10}
#vn-title-bg{position:absolute;inset:0;background-size:cover;background-position:center;background:#0b1120}
#vn-title-bg video{width:100%;height:100%;object-fit:cover}
#vn-title-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.6))}
#vn-title-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8%}
#vn-title-h{color:#fff;font-size:56px;font-weight:900;letter-spacing:1px;text-align:center;margin:0;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#vn-title-sub{color:#e2e8f0;font-size:22px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#vn-title-start{margin-top:18px;background:var(--accent);color:#1a032b;font-weight:800;font-size:20px;letter-spacing:1px;
  padding:12px 34px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#vn-title-start:hover{filter:brightness(1.08)}
/* #96: extra title-screen menu items (Credits/Settings/a custom link) - a
   deliberately quieter look than the one primary Start button, same family
   of shape so they read as siblings, not competing calls to action. */
#vn-title-menu{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.vn-title-menu-btn{background:rgba(15,23,42,.55);color:#e2e8f0;font-weight:600;font-size:15px;letter-spacing:.5px;
  padding:8px 24px;border:1px solid rgba(255,255,255,.28);border-radius:9px;cursor:pointer;backdrop-filter:blur(2px)}
.vn-title-menu-btn:hover{border-color:var(--accent);color:#fff}
/* social icon row: plain circular glyph buttons, doesn't try to guess a
   platform's real brand icon (that would mean shipping/maintaining a logo
   set) - just a text/emoji glyph keyed off the link's own label. */
#vn-title-social{display:flex;gap:10px;margin-top:14px}
.vn-title-social-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.28);color:#e2e8f0;font-size:15px;text-decoration:none;cursor:pointer}
.vn-title-social-ic:hover{border-color:var(--accent);color:#fff}

#vn-debug-btn{position:absolute;top:10px;left:12px;z-index:9;width:34px;height:34px;border-radius:8px;background:rgba(15,23,42,.72);border:1px solid #475569;color:#e2e8f0;font-size:16px;cursor:pointer}
#vn-debug-btn:hover{border-color:var(--accent)}
#vn-debug-panel{position:absolute;top:52px;left:12px;z-index:9;width:270px;max-height:74%;overflow:auto;background:rgba(9,12,20,.96);border:1px solid var(--accent);border-radius:10px;padding:12px;color:#e2e8f0;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.dbg-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dbg-row label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbg-row input,.dbg-row select{background:#000;border:1px solid #475569;color:#fff;border-radius:4px;padding:3px 5px;font-size:12px}
#vn-debug-reset{background:var(--btn);border:1px solid var(--accent);color:#fff;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer;width:100%}
#vn-debug-reset:hover{background:var(--btn-h)}
#vn-audio{display:none}
</style>
</head>
<body>
<div id="vn-loading" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070d;color:#e5e7eb;font-family:system-ui,sans-serif"><div id="vn-loadtext" style="font-size:15px;letter-spacing:2px;opacity:.8">LOADING…</div><div style="width:180px;height:7px;background:#1e293b;border-radius:5px;overflow:hidden;margin-top:12px"><div id="vn-loadbar" style="height:100%;width:35%;background:var(--accent);border-radius:5px;animation:vnload 1.1s ease-in-out infinite"></div></div></div>
<style>@keyframes vnload{0%{margin-left:-35%}100%{margin-left:100%}}</style>
<div id="vn-fit">
  <div id="vn-stage">
    <div id="vn-frame">
      <div id="vn-bg"></div>
      <div id="vn-portraits"></div>

      <div id="vn-cs">
        <div id="vn-cs-dim"></div>
        <div id="vn-cs-wrap" class="align-center">
          <div id="vn-cs-text" class="size-lg fx-shadow"></div>
          <div id="vn-cs-choices"></div>
        </div>
      </div>

      <div id="vn-narr">
        <div id="vn-narr-dim"></div>
        <div id="vn-narr-wrap">
          <div id="vn-narr-text"></div>
          <div id="vn-narr-choices"></div>
        </div>
      </div>

      <div id="vn-viewer">
        <div id="vn-viewer-stage">
          <img id="vn-viewer-img" alt="">
          <video id="vn-viewer-video" controls playsinline></video>
        </div>
        <div id="vn-viewer-caption"></div>
        <div id="vn-viewer-choices"></div>
      </div>

      <div id="vn-box">
        <span id="vn-speaker"></span>
        <div id="vn-text"></div>
        <button id="vn-doc" style="display:none"></button>
        <div id="vn-choices"></div>
      </div>

      <div id="vn-nav" style="display:none">
        <button id="vn-back" title="Back">&#9664;</button>
        <button id="vn-restart" title="Restart">&#8635;</button>
        <button id="vn-fwd" title="Forward">&#9654;</button>
      </div>

      <button id="vn-debug-btn" title="Debug" style="display:none">&#128027;</button>
      <div id="vn-debug-panel" style="display:none">
        <div style="font-weight:800;letter-spacing:1px;margin-bottom:8px;color:var(--accent)">DEBUG</div>
        <div id="vn-debug-count" style="display:none;margin-bottom:8px;opacity:.85"></div>
        <div id="vn-debug-vars"></div>
        <button id="vn-debug-reset" style="display:none">&#8635; Reset all</button>
      </div>

      <div id="vn-title">
        <div id="vn-title-bg"></div>
        <div id="vn-title-scrim"></div>
        <div id="vn-title-inner">
          <h1 id="vn-title-h"></h1>
          <div id="vn-title-sub"></div>
          <button id="vn-title-start">Start</button>
          <div id="vn-title-menu"></div>
          <div id="vn-title-social"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<audio id="vn-audio"></audio>

<script>
  window.VN_PROJECT = __VN_PROJECT_JSON__;
  window.VN_PREVIEW = __VN_PREVIEW__;
  // #146: customize the loading screen (text/bar colour) as early as
  // possible - runs synchronously, right after VN_PROJECT exists, well
  // before runtime.js/the rest of the player even loads, so there's no
  // flash of the built-in default first. Both fields blank/absent (every
  // project before this existed) leaves the built-in "LOADING…" text and
  // var(--accent) bar untouched.
  (function(){
    var ld = (window.VN_PROJECT.settings && window.VN_PROJECT.settings.loading) || {};
    if(ld.text){ var t=document.getElementById('vn-loadtext'); if(t) t.textContent=ld.text; }
    if(ld.color){ var b=document.getElementById('vn-loadbar'); if(b) b.style.background=ld.color; }
  })();
</script>
<script src="scorm_api.js"></script>
<script src="theme.js"></script>
<script src="rich.js"></script>
<script src="typewriter.js"></script>
<script src="typesound.js"></script>
<script src="sfx.js"></script>
<script src="cursorsound.js"></script>
<script src="fx.js"></script>
<script src="scene-fx.js"></script>
<script src="layout.js"></script>
<script src="overlay.js"></script>
<script src="runtime.js"></script>
<script>window.addEventListener("load",function(){ setTimeout(function(){ var l=document.getElementById("vn-loading"); if(l) l.style.display="none"; }, 1500); });</script>
<script src="hud.js"></script>
</body>
</html>
