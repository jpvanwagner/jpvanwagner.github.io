<!DOCTYPE html>
<!--
    PORTFOLIO/INDEX.HTML - A browser preview of Vinyasa for the portfolio site (published there as
    work/vinyasa/index.html by its pull hub, with the Nunito fonts beside it in fonts/).
    It only imitates the real app with sample notifications (its window, and its one-line ticker docked
    beside ZenTabs' bar on a pretend screen): nothing talks to Asana.
    Colors match THEMES in vinyasa.py. The sound is the app's default singing bowl ("Singing Bell Hit 2"
    by ryancacophony, freesound.org, CC0), embedded below as an MP3 so the page needs no audio files.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyasa preview</title>
<script>try{if(parent!==window&&parent.DemoControls)parent.DemoControls.early(window)}catch(e){}</script>
<style>
    @font-face { font-family: "Nunito"; src: url("fonts/Nunito-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Nunito"; src: url("fonts/Nunito-Bold.ttf") format("truetype"); font-weight: 700; }
    :root, .dawn {
        --page: #E9E6DF; --bg: #F5F3EE; --surface: #FFFFFF; --alt: #ECE9E2; --border: #E0DCD3;
        --text: #2F3B3A; --muted: #7D8885; --faint: #A9B1AE; --accent: #4F8A7E; --accent-hover: #3F766B;
        --on-accent: #FFFFFF; --added: #4F8A7E; --completed: #7C9F68; --moved: #8A84B3; --danger: #B26B63;
        --task: #DCD8D0; --task-icon: #C9C4BA; --soft: #DDEBE6;
    }
    .dusk {
        --page: #121819; --bg: #1B2224; --surface: #232C2E; --alt: #2C3739; --border: #344043;
        --text: #E6EBE9; --muted: #98A5A1; --faint: #66736F; --accent: #79B3A6; --accent-hover: #8FC4B8;
        --on-accent: #14201E; --added: #79B3A6; --completed: #9DBF8A; --moved: #A9A3D1; --danger: #D08F86;
        --task: #0D1213; --task-icon: #2A3436; --soft: #2D4541;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--page); color: var(--text); font: 14px/1.4 "Nunito", "Segoe UI", system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px;
           transition: background .4s; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    .window { width: min(380px, 100%); height: min(460px, calc(100vh - 110px)); background: var(--bg); border-radius: 10px;
              box-shadow: 0 10px 30px rgba(0,0,0,.12), 0 0 0 1px var(--border); display: flex; flex-direction: column; overflow: hidden;
              transition: background .4s; }
    .titlebar { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
                font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--surface); }
    .titlebar span { letter-spacing: .02em; }
    .dots { display: flex; gap: 6px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
    header { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; }
    header .mark { color: var(--accent); margin-top: 4px; flex: none; }
    header .titles { flex: 1; min-width: 0; }
    header h1 { font-size: 17px; margin: 0; font-weight: 700; }
    header p { margin: 0; font-size: 12.5px; color: var(--muted); }
    .ghost { color: var(--muted); font-size: 13px; padding: 2px 6px; }
    .ghost:hover, .ghost:focus-visible { color: var(--text); }
    .danger:hover, .danger:focus-visible { color: var(--danger); }
    .rule { height: 1px; background: var(--border); margin: 0 16px; }
    .list { flex: 1; overflow-y: auto; padding: 12px 12px 12px 16px; }
    .card { display: flex; background: var(--surface); border: 1px solid var(--border); margin: 0 4px 10px 0;
            animation: arrive .6s ease-out; }
    .card .stripe { width: 4px; flex: none; }
    .card .body { padding: 10px 14px; flex: 1; min-width: 0; }
    .kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .card h2 { font-size: 14px; margin: 2px 0 1px; font-weight: 700; }
    .meta { font-size: 12.5px; color: var(--muted); }
    .actions { margin-top: 8px; display: flex; gap: 14px; }
    .actions button { padding: 0; font-size: 13px; color: var(--muted); }
    .actions button:hover, .actions button:focus-visible { color: var(--text); }
    .actions .danger:hover, .actions .danger:focus-visible { color: var(--danger); }
    .calm { text-align: center; padding-top: 48px; color: var(--muted); animation: arrive .8s ease-out; }
    .calm svg { color: var(--faint); }
    .calm h2 { color: var(--text); font-size: 20px; margin: 10px 0 2px; }
    .calm p { margin: 0; font-size: 12.5px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .controls button { padding: 7px 16px; background: var(--alt); color: var(--text); font-size: 13px; transition: background .2s; }
    .controls button:hover, .controls button:focus-visible { background: var(--border); }
    .controls .primary { background: var(--accent); color: var(--on-accent); font-weight: 700; }
    .controls .primary:hover, .controls .primary:focus-visible { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: var(--accent); text-decoration: underline; }
    .jv-credit { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
    .jv-credit img { width: 20px; height: 20px; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; }
    /* The ticker, docked beside ZenTabs' bar on a pretend screen */
    .desk { width: min(760px, 100%); height: min(400px, calc(100vh - 110px)); min-height: 300px; display: flex; flex-direction: column;
            background: var(--page); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12), 0 0 0 1px var(--border); }
    .desk[hidden], .window[hidden] { display: none; }
    .page-mock { flex: 1; background: var(--surface); padding: 14px 22px; display: flex; flex-direction: column; gap: 10px; }
    .page-mock b { height: 26px; border-radius: 7px; background: var(--alt); width: 40%; margin-bottom: 6px; }
    .page-mock i { height: 9px; border-radius: 5px; background: var(--alt); width: 70%; }
    .page-mock i:nth-of-type(2) { width: 86%; } .page-mock i:nth-of-type(3) { width: 52%; } .page-mock i:nth-of-type(4) { width: 78%; }
    .strip { height: 40px; flex: none; display: flex; background: var(--bg); border-top: 1px solid var(--border); }
    .zt { width: 40%; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-right: 1px solid var(--border); }
    .zt .pick { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px;
                background: var(--surface); border: 1px solid var(--border); color: var(--muted); overflow: hidden; white-space: nowrap; }
    .zt .dot { width: 14px; height: 14px; border-radius: 50%; background: #4C8BF5; flex: none; }
    .zt .zname { font-size: 11px; color: var(--faint); white-space: nowrap; }
    .tick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 0; position: relative; }
    .tick .stripe { width: 3px; align-self: stretch; background: var(--accent); flex: none; }
    .tick svg.waves { color: var(--accent); flex: none; margin-left: 6px; }
    .tick .msg { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; cursor: pointer;
                 border-radius: 4px; padding: 3px 4px; transition: background .4s; }
    .tick .msg.flash { background: var(--soft); }
    .tick .msg.turning { animation: turn .35s ease-out; }
    .tick .kind { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; flex: none; }
    .tick .t { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; max-width: 62%; }
    .tick .m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
    .tick .n { font-size: 12px; color: var(--muted); flex: none; padding: 2px 4px; }
    .tbtn { width: 28px; height: 28px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 5px; }
    .tbtn:hover:not(:disabled), .tbtn:focus-visible { color: var(--text); background: var(--alt); }
    .tbtn:disabled { color: var(--faint); }
    .taskbar { height: 32px; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; background: var(--task); }
    .taskbar i { width: 18px; height: 18px; border-radius: 5px; background: var(--task-icon); }
    .taskbar span { position: absolute; right: 12px; font-size: 11px; color: var(--muted); }
    .tip { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px;
           font-size: 13px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 3; }
    .tip.on { opacity: .94; }
    @keyframes turn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (max-width: 560px) { .zt, .tick .m, .tick .kind, .tick .n { display: none; } .tick .t { max-width: none; } }
    @media (prefers-reduced-motion: reduce) { .tick .msg.turning { animation: none; } .tick .msg { transition: none; } }
    @keyframes arrive { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card, .calm { animation: none; } }
</style>

<script>
(function () {
    'use strict';
    // Three gentle waves, the same mark the app draws
    function waves(size, stroke, pad) {
        var d = '', spread = size * 0.2, amp = size * 0.045;
        [-1, 0, 1].forEach(function (i) {
            var y0 = size / 2 + i * spread, inset = pad + (i ? size * 0.05 : 0), span = size - 2 * inset;
            for (var t = 0; t <= 40; t++) {
                var x = inset + span * t / 40, y = y0 + amp * Math.sin(t / 40 * 3 * Math.PI);
                d += (t ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
            }
        });
        return d;
    }
    document.getElementById('wave-path').setAttribute('d', waves(22, 1.6, 1.5));
    var calmSvg = '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="' + waves(44, 2.6, 3) +
                  '" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';

    var KINDS = { added: 'New task', completed: 'Completed', moved: 'Moved', assigned: 'Reassigned' };
    var COLOR = { added: 'added', completed: 'completed', moved: 'moved', assigned: 'moved' };
    var SAMPLES = [
        ['added', 'Draft the spring newsletter', 'New in Marketing', 'Priya'],
        ['completed', 'Review onboarding module 3', 'Completed in Training Team', 'Sam'],
        ['moved', 'Update the safety checklist', 'Moved to In Review · Operations', 'Alex'],
        ['assigned', 'Record the welcome video', 'Assigned to Jordan · Training Team', 'Priya'],
        ['added', 'Plan the quarterly town hall', 'New in Operations', 'Morgan'],
        ['completed', 'Proofread the holiday schedule', 'Completed in Marketing', 'Alex'],
        ['moved', 'Storyboard the heat safety course', 'Moved to Doing · Training Team', 'Sam'],
        ['added', 'Collect feedback from the pilot group', 'New in Training Team', 'Jordan']
    ];
    var alerts = [], next = 0, MAX = 5, list = document.getElementById('list');

    function clock(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

    function render() {
        ticker(true);
        list.textContent = '';
        document.getElementById('clear').hidden = !alerts.length;
        if (!alerts.length) {
            var calm = el('div', 'calm');
            calm.innerHTML = calmSvg + '<h2>All is calm</h2><p>New activity from your projects will appear here.</p>';
            list.appendChild(calm);
            return;
        }
        alerts.forEach(function (a) {
            var card = el('article', 'card'), stripe = el('div', 'stripe'), body = el('div', 'body');
            stripe.style.background = 'var(--' + COLOR[a.kind] + ')';
            var kind = el('div', 'kind', KINDS[a.kind]); kind.style.color = 'var(--' + COLOR[a.kind] + ')';
            body.appendChild(kind);
            body.appendChild(el('h2', '', a.title));
            body.appendChild(el('div', 'meta', a.detail));
            body.appendChild(el('div', 'meta', 'by ' + a.who + ' · ' + clock(a.time)));
            var actions = el('div', 'actions');
            [['Got it', ''], ['Snooze', ''], ['Mute task', 'danger']].forEach(function (b) {
                var btn = el('button', b[1], b[0]); btn.type = 'button';
                btn.addEventListener('click', function () { alerts.splice(alerts.indexOf(a), 1); render(); });
                actions.appendChild(btn);
            });
            body.appendChild(actions);
            card.appendChild(stripe); card.appendChild(body);
            list.appendChild(card);
        });
    }

    bowl.volume = 0.8;
    function chime() {
        try { bowl.currentTime = 0; var p = bowl.play(); if (p && p.catch) p.catch(function () {}); }
        catch (e) { /* no sound available: the preview still works */ }
    }

    function send() {
        var s = SAMPLES[next++ % SAMPLES.length];
        alerts.unshift({ kind: s[0], title: s[1], detail: s[2], who: s[3], time: new Date() });
        alerts.length = Math.min(alerts.length, MAX);
        tIndex = 0;
        render();
        var msg = document.getElementById('t-msg');
        msg.classList.add('flash'); setTimeout(function () { msg.classList.remove('flash'); }, 1600);
        list.scrollTop = 0;
        chime();
    }

    // The ticker: one line, each notification in turn, docked beside ZenTabs' bar
    var tIndex = 0, tTimer = null, tHover = false, tipTimer;
    var $ = function (id) { return document.getElementById(id); };
    $('t-waves').setAttribute('d', waves(22, 1.6, 1.5));
    function tip(text) {
        var t = $('tip'); t.textContent = text; t.classList.add('on');
        clearTimeout(tipTimer); tipTimer = setTimeout(function () { t.classList.remove('on'); }, 2400);
    }
    function ticker(turning) {
        if ($('desk').hidden) return;
        var a = alerts.length ? alerts[tIndex % alerts.length] : null, msg = $('t-msg');
        if (a) tIndex %= alerts.length; else tIndex = 0;
        $('t-stripe').style.background = a ? 'var(--' + COLOR[a.kind] + ')' : 'transparent';
        $('t-kind').textContent = a ? KINDS[a.kind] : '';
        $('t-kind').style.color = a ? 'var(--' + COLOR[a.kind] + ')' : '';
        $('t-title').textContent = a ? a.title : 'All is calm';
        $('t-meta').textContent = a ? a.detail + '  ·  by ' + a.who + '  ·  ' + clock(a.time) : 'New activity will appear here.';
        $('t-next').textContent = alerts.length > 1 ? (tIndex + 1) + ' of ' + alerts.length : '';
        $('t-next').hidden = alerts.length < 2;
        ['t-got', 't-snooze', 't-open'].forEach(function (id) { $(id).disabled = !a; });
        $('t-clock').textContent = clock(new Date());
        if (turning) { msg.classList.remove('turning'); void msg.offsetWidth; msg.classList.add('turning'); }
        clearTimeout(tTimer);

    }
    function current() { return alerts.length ? alerts[tIndex % alerts.length] : null; }
    function drop(a, text) { if (!a) return; alerts.splice(alerts.indexOf(a), 1); render(); tip(text); }
    $('t-got').addEventListener('click', function () { drop(current(), 'Got it: cleared.'); });
    $('t-snooze').addEventListener('click', function () { drop(current(), 'Snoozed: Vinyasa won’t mention that task for a while.'); });
    function openIt() { var a = current(); if (a) tip('In the app, this opens “' + a.title + '” in Asana.'); }
    $('t-open').addEventListener('click', openIt);
    $('t-msg').addEventListener('click', openIt);
    $('t-msg').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(); } });
    $('t-next').addEventListener('click', function () { tIndex++; ticker(true); });
    $('tick').addEventListener('mouseenter', function () { tHover = true; clearTimeout(tTimer); });
    $('tick').addEventListener('mouseleave', function () { tHover = false; ticker(); });
    $('tickmode').addEventListener('click', function () {
        var on = $('desk').hidden;
        $('desk').hidden = !on;

        ticker();
    });
    document.getElementById('send').addEventListener('click', send);
    document.getElementById('clear').addEventListener('click', function () { alerts = []; render(); });

        document.body.classList.toggle('dawn', !dusk);
        this.textContent = dusk ? 'Switch to Dawn' : 'Switch to Dusk';
        this.setAttribute('aria-pressed', dusk ? 'true' : 'false');
    });

    var year = new Date().getFullYear();
    if (year > 2026) document.getElementById('jv-years').textContent = '2026\u2013' + year;

    // Start with two quiet sample notifications already waiting (no chime until the visitor asks)
    var start = Date.now();
    alerts = [SAMPLES[1], SAMPLES[0]].map(function (s, i) {
        return { kind: s[0], title: s[1], detail: s[2], who: s[3], time: new Date(start - (i ? 9 : 2) * 60000) };
    });
    next = 2;
    render();
})();
</script>
</body>
</html>
